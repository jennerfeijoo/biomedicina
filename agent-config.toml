[agent]
state_directory = ".citonauta-agent"

[models]
content = "qwen3.6:27b"
review = "qwen3.6:27b"
technical = "ornith:9b"
embedding = "qwen3-embedding:0.6b"
host = "http://127.0.0.1:11434"
context_tokens = 32768
output_tokens = 16384
temperature = 0.2
timeout_seconds = 3600.0
review_think = true

[generation]
minimum_course_words = 2200
maximum_generation_attempts = 3
maximum_validation_repairs = 3
related_courses = 4
research_results = 12
openalex_enabled = true
europe_pmc_enabled = true

[git]
default_branch = "main"
remote = "origin"
branch_prefix = "agent/course"
auto_push = true
create_pull_request = true
wait_for_checks = true
auto_merge = false
merge_method = "squash"
delete_branch = true
require_clean_worktree = true

[reviewer_validation]
directory = "data/reviewer_validations"
provider = "ollama"
model_version = "unfrozen"
prompt_id = "citonauta-course-review-v2"
rubric_version = "course-review-rubric-v2"
domain = "general_biomedicine"
risk_level = "high"
language = "es"
source_access = "metadata_or_abstract"
claim_types = ["definition", "mechanism", "equation", "method", "clinical", "safety", "regulation", "pedagogy"]
