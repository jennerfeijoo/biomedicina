  <g id="text_19">
   <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start" x="51.84" y="72" transform="rotate(-0 51.84 72)">Dos parámetros, una curva indistinguible</text>
  </g>
  <g id="text_20">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="51.84" y="106.56" transform="rotate(-0 51.84 106.56)">Observable normalizado z(t) = exp[−(CL/V)t]. No se conoce V por otra vía.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(51.84 498.626625)">La curva identifica k = CL/V = 0,2 h⁻¹, pero no separa CL de V.</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(51.84 512.64)">Una observación independiente de volumen aportaría la escala que falta.</text>
  </g>
