<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Un ciclo de vida con retroalimentación</title><desc id="desc">Diseño y transferencia llevan a producción controlada; la información posmercado alimenta evaluación y cambios, que retroalimentan diseño y riesgos. Las obligaciones dependen de jurisdicción, uso previsto y sistema de calidad; el esquema no es una vía de autorización.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f82"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f82"/></marker></defs>
<rect width="900" height="900" rx="24" fill="#f3f7fa"/><g font-family="Arial, sans-serif"><text x="44" y="48" font-size="18" fill="#087f82" font-weight="700">CITONAUTA  /  DISPOSITIVOS MÉDICOS  /  U6</text><text x="44" y="99" font-size="34" fill="#12334a" font-weight="700">Un ciclo de vida con retroalimentación</text><text x="44" y="137" font-size="22" fill="#486174" font-weight="400">La vigilancia alimenta la revisión del diseño y sus controles.</text><rect x="44" y="180" width="386" height="175" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="198" width="5" height="139" rx="2" fill="#087f82"/><text x="66" y="218" font-size="25" fill="#087f82" font-weight="700">Diseño y transferencia</text><text x="66" y="257" font-size="23" fill="#12334a" font-weight="400">Requisitos y riesgos.</text><text x="66" y="287" font-size="23" fill="#12334a" font-weight="400">Salidas aptas para producción.</text><rect x="470" y="180" width="386" height="175" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="470" y="198" width="5" height="139" rx="2" fill="#087f82"/><text x="492" y="218" font-size="25" fill="#087f82" font-weight="700">Producción controlada</text><text x="492" y="257" font-size="23" fill="#12334a" font-weight="400">Configuración identificada.</text><text x="492" y="287" font-size="23" fill="#12334a" font-weight="400">Procesos y registros.</text><path d="M438 268 L462 268" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M663 365 L663 434" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="470" y="447" width="386" height="175" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="470" y="465" width="5" height="139" rx="2" fill="#087f82"/><text x="492" y="485" font-size="25" fill="#087f82" font-weight="700">Información posmercado</text><text x="492" y="524" font-size="23" fill="#12334a" font-weight="400">Quejas, incidentes y señales.</text><text x="492" y="554" font-size="23" fill="#12334a" font-weight="400">Evaluar contexto y calidad.</text><rect x="44" y="447" width="386" height="175" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="465" width="5" height="139" rx="2" fill="#087f82"/><text x="66" y="485" font-size="25" fill="#087f82" font-weight="700">Evaluación y cambios</text><text x="66" y="524" font-size="23" fill="#12334a" font-weight="400">Actualizar riesgos y controles.</text><text x="66" y="554" font-size="23" fill="#12334a" font-weight="400">Verificar o validar según impacto.</text><path d="M462 535 L438 535" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M237 437 L237 365" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="678" width="812" height="122" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="696" width="5" height="86" rx="2" fill="#087f82"/><text x="66" y="716" font-size="25" fill="#087f82" font-weight="700">Jurisdicción, uso previsto y sistema de calidad</text><text x="66" y="755" font-size="23" fill="#12334a" font-weight="400">Determinan obligaciones; este ciclo es una síntesis docente.</text><text x="44" y="854" font-size="19" fill="#486174" font-weight="400">Esquema docente original · CC BY-NC 4.0</text><text x="44" y="880" font-size="18" fill="#486174" font-weight="400">Leer junto con el alcance y las fuentes de la unidad.</text></g></svg>
