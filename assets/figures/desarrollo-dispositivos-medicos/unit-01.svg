<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">De la observación a la necesidad</title><desc id="desc">Observación, interpretación, actores y entorno informan una necesidad. La necesidad describe población, problema y resultado; todavía no selecciona tecnología. La disposición es una síntesis docente, no una secuencia obligatoria.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f82"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f82"/></marker></defs>
<rect width="900" height="900" rx="24" fill="#f3f7fa"/><g font-family="Arial, sans-serif"><text x="44" y="48" font-size="18" fill="#087f82" font-weight="700">CITONAUTA  /  DISPOSITIVOS MÉDICOS  /  U1</text><text x="44" y="99" font-size="34" fill="#12334a" font-weight="700">De la observación a la necesidad</text><text x="44" y="137" font-size="22" fill="#486174" font-weight="400">Cuatro perspectivas para formular una pregunta de diseño.</text><rect x="44" y="180" width="386" height="172" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="198" width="5" height="136" rx="2" fill="#087f82"/><text x="66" y="218" font-size="25" fill="#087f82" font-weight="700">Observación</text><text x="66" y="257" font-size="23" fill="#12334a" font-weight="400">¿Qué ocurrió realmente?</text><text x="66" y="287" font-size="23" fill="#12334a" font-weight="400">Registrar tarea y contexto.</text><rect x="470" y="180" width="386" height="172" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="470" y="198" width="5" height="136" rx="2" fill="#087f82"/><text x="492" y="218" font-size="25" fill="#087f82" font-weight="700">Interpretación</text><text x="492" y="257" font-size="23" fill="#12334a" font-weight="400">¿Qué podría explicarlo?</text><text x="492" y="287" font-size="23" fill="#12334a" font-weight="400">Contrastar otras hipótesis.</text><rect x="44" y="392" width="386" height="172" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="410" width="5" height="136" rx="2" fill="#087f82"/><text x="66" y="430" font-size="25" fill="#087f82" font-weight="700">Actores</text><text x="66" y="469" font-size="23" fill="#12334a" font-weight="400">Usuario, paciente y otros</text><text x="66" y="499" font-size="23" fill="#12334a" font-weight="400">actores no siempre coinciden.</text><rect x="470" y="392" width="386" height="172" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="470" y="410" width="5" height="136" rx="2" fill="#087f82"/><text x="492" y="430" font-size="25" fill="#087f82" font-weight="700">Entorno de uso</text><text x="492" y="469" font-size="23" fill="#12334a" font-weight="400">¿Dónde y con qué recursos?</text><text x="492" y="499" font-size="23" fill="#12334a" font-weight="400">Describir restricciones.</text><path d="M237 572 L237 618" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M663 572 L663 618" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="628" width="812" height="172" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="646" width="5" height="136" rx="2" fill="#087f82"/><text x="66" y="666" font-size="25" fill="#087f82" font-weight="700">Necesidad antes que solución</text><text x="66" y="705" font-size="23" fill="#12334a" font-weight="400">Población + problema + resultado deseado.</text><text x="66" y="735" font-size="23" fill="#12334a" font-weight="400">Seleccionar una tecnología requiere un análisis posterior.</text><text x="44" y="854" font-size="19" fill="#486174" font-weight="400">Esquema docente original · CC BY-NC 4.0</text><text x="44" y="880" font-size="18" fill="#486174" font-weight="400">Leer junto con el alcance y las fuentes de la unidad.</text></g></svg>
