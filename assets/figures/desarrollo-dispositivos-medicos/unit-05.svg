<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Verificar y validar</title><desc id="desc">Verificación compara desempeño con especificaciones; validación considera necesidades y uso previsto. Un ensayo de banco, un estudio de factores humanos y un estudio clínico responden preguntas distintas; el banco por sí solo no demuestra beneficio clínico.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f82"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f82"/></marker></defs>
<rect width="900" height="900" rx="24" fill="#f3f7fa"/><g font-family="Arial, sans-serif"><text x="44" y="48" font-size="18" fill="#087f82" font-weight="700">CITONAUTA  /  DISPOSITIVOS MÉDICOS  /  U5</text><text x="44" y="99" font-size="34" fill="#12334a" font-weight="700">Verificar y validar</text><text x="44" y="137" font-size="22" fill="#486174" font-weight="400">Dos preguntas relacionadas que requieren evidencia adecuada.</text><rect x="44" y="180" width="386" height="250" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="198" width="5" height="214" rx="2" fill="#087f82"/><text x="66" y="218" font-size="25" fill="#087f82" font-weight="700">Verificación</text><text x="66" y="257" font-size="23" fill="#12334a" font-weight="400">¿Cumple especificaciones?</text><text x="66" y="287" font-size="23" fill="#12334a" font-weight="400">Referencia: requisito definido.</text><text x="66" y="317" font-size="23" fill="#12334a" font-weight="400">Ejemplo educativo:</text><text x="66" y="347" font-size="23" fill="#12334a" font-weight="400">error de medición frente</text><text x="66" y="377" font-size="23" fill="#12334a" font-weight="400">al límite especificado.</text><rect x="470" y="180" width="386" height="250" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="470" y="198" width="5" height="214" rx="2" fill="#087f82"/><text x="492" y="218" font-size="25" fill="#087f82" font-weight="700">Validación</text><text x="492" y="257" font-size="23" fill="#12334a" font-weight="400">¿Sirve para el uso previsto?</text><text x="492" y="287" font-size="23" fill="#12334a" font-weight="400">Referencia: necesidad y uso.</text><text x="492" y="317" font-size="23" fill="#12334a" font-weight="400">Ejemplo educativo:</text><text x="492" y="347" font-size="23" fill="#12334a" font-weight="400">usuarios representativos</text><text x="492" y="377" font-size="23" fill="#12334a" font-weight="400">realizan tareas críticas.</text><rect x="44" y="475" width="812" height="155" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="493" width="5" height="119" rx="2" fill="#087f82"/><text x="66" y="513" font-size="25" fill="#087f82" font-weight="700">Evidencia según la pregunta</text><text x="66" y="552" font-size="23" fill="#12334a" font-weight="400">Banco, factores humanos y estudios clínicos tienen alcances</text><text x="66" y="582" font-size="23" fill="#12334a" font-weight="400">distintos. La selección depende del dispositivo y su uso.</text><rect x="44" y="670" width="812" height="130" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="688" width="5" height="94" rx="2" fill="#087f82"/><text x="66" y="708" font-size="25" fill="#087f82" font-weight="700">Límite de inferencia</text><text x="66" y="747" font-size="23" fill="#12334a" font-weight="400">Un ensayo de banco no demuestra por sí solo beneficio clínico.</text><text x="44" y="854" font-size="19" fill="#486174" font-weight="400">Esquema docente original · CC BY-NC 4.0</text><text x="44" y="880" font-size="18" fill="#486174" font-weight="400">Leer junto con el alcance y las fuentes de la unidad.</text></g></svg>
