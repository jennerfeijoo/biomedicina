<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Del peligro al riesgo residual</title><desc id="desc">Identificar peligros y exposición, considerar probabilidad y severidad, priorizar seguridad inherente, protección e información de seguridad. Verificar controles y evaluar riesgo residual individual y global. No se propone un umbral universal de aceptación.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f82"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f82"/></marker></defs>
<rect width="900" height="900" rx="24" fill="#f3f7fa"/><g font-family="Arial, sans-serif"><text x="44" y="48" font-size="18" fill="#087f82" font-weight="700">CITONAUTA  /  DISPOSITIVOS MÉDICOS  /  U3</text><text x="44" y="99" font-size="34" fill="#12334a" font-weight="700">Del peligro al riesgo residual</text><text x="44" y="137" font-size="22" fill="#486174" font-weight="400">La información de seguridad no sustituye un diseño más seguro.</text><rect x="44" y="180" width="386" height="160" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="198" width="5" height="124" rx="2" fill="#087f82"/><text x="66" y="218" font-size="25" fill="#087f82" font-weight="700">Peligro y exposición</text><text x="66" y="257" font-size="23" fill="#12334a" font-weight="400">Identificar una fuente de daño</text><text x="66" y="287" font-size="23" fill="#12334a" font-weight="400">y situaciones de exposición.</text><rect x="470" y="180" width="386" height="160" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="470" y="198" width="5" height="124" rx="2" fill="#087f82"/><text x="492" y="218" font-size="25" fill="#087f82" font-weight="700">Daño y riesgo</text><text x="492" y="257" font-size="23" fill="#12334a" font-weight="400">Considerar probabilidad</text><text x="492" y="287" font-size="23" fill="#12334a" font-weight="400">y severidad del daño.</text><path d="M438 260 L462 260" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><text x="44" y="390" font-size="20" fill="#087f82" font-weight="700">PRIORIDAD DE LOS CONTROLES</text><rect x="44" y="410" width="812" height="100" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="428" width="5" height="64" rx="2" fill="#087f82"/><text x="66" y="448" font-size="25" fill="#087f82" font-weight="700">1 · Seguridad inherente</text><text x="66" y="487" font-size="23" fill="#12334a" font-weight="400">Reducir riesgos mediante el diseño.</text><rect x="44" y="530" width="812" height="100" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="548" width="5" height="64" rx="2" fill="#087f82"/><text x="66" y="568" font-size="25" fill="#087f82" font-weight="700">2 · Medidas de protección</text><text x="66" y="607" font-size="23" fill="#12334a" font-weight="400">Incorporar protecciones cuando corresponda.</text><rect x="44" y="650" width="812" height="100" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="668" width="5" height="64" rx="2" fill="#087f82"/><text x="66" y="688" font-size="25" fill="#087f82" font-weight="700">3 · Información de seguridad</text><text x="66" y="727" font-size="23" fill="#12334a" font-weight="400">Comunicar riesgos y precauciones restantes.</text><text x="44" y="794" font-size="23" fill="#12334a" font-weight="700">Verificar controles y evaluar riesgo residual individual y global.</text><text x="44" y="854" font-size="19" fill="#486174" font-weight="400">Esquema docente original · CC BY-NC 4.0</text><text x="44" y="880" font-size="18" fill="#486174" font-weight="400">Leer junto con el alcance y las fuentes de la unidad.</text></g></svg>
