<title id="title">Construir evidencia de verificación</title><desc id="desc">El requisito, criterio, configuración y muestra se combinan con método, condiciones, instrumentos e incertidumbre para interpretar el resultado. Un cambio exige analizar la aplicabilidad de la evidencia previa.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f82"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f82"/></marker></defs>
<rect width="900" height="900" rx="24" fill="#f3f7fa"/><g font-family="Arial, sans-serif"><text x="44" y="48" font-size="18" fill="#087f82" font-weight="700">CITONAUTA  /  DISPOSITIVOS MÉDICOS  /  U4</text><text x="44" y="99" font-size="34" fill="#12334a" font-weight="700">Construir evidencia de verificación</text><text x="44" y="137" font-size="22" fill="#486174" font-weight="400">Un resultado tiene sentido dentro de una configuración.</text><rect x="44" y="180" width="386" height="200" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="198" width="5" height="164" rx="2" fill="#087f82"/><text x="66" y="218" font-size="25" fill="#087f82" font-weight="700">Qué se evalúa</text><text x="66" y="257" font-size="23" fill="#12334a" font-weight="400">Requisito y criterio previo.</text><text x="66" y="287" font-size="23" fill="#12334a" font-weight="400">Configuración y versión.</text><text x="66" y="317" font-size="23" fill="#12334a" font-weight="400">Muestra identificada.</text><rect x="470" y="180" width="386" height="200" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="470" y="198" width="5" height="164" rx="2" fill="#087f82"/><text x="492" y="218" font-size="25" fill="#087f82" font-weight="700">Cómo se evalúa</text><text x="492" y="257" font-size="23" fill="#12334a" font-weight="400">Método y condiciones.</text><text x="492" y="287" font-size="23" fill="#12334a" font-weight="400">Instrumentos e incertidumbre.</text><text x="492" y="317" font-size="23" fill="#12334a" font-weight="400">Protocolo documentado.</text><path d="M237 390 L237 438" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><path d="M663 390 L663 438" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="450" width="812" height="165" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="468" width="5" height="129" rx="2" fill="#087f82"/><text x="66" y="488" font-size="25" fill="#087f82" font-weight="700">Resultado interpretable</text><text x="66" y="527" font-size="23" fill="#12334a" font-weight="400">Comparar evidencia con el criterio predefinido.</text><text x="66" y="557" font-size="23" fill="#12334a" font-weight="400">Registrar desviaciones, incertidumbre y límites.</text><path d="M450 625 L450 663" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="675" width="812" height="125" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="693" width="5" height="89" rx="2" fill="#087f82"/><text x="66" y="713" font-size="25" fill="#087f82" font-weight="700">Cambio de diseño → análisis de impacto</text><text x="66" y="752" font-size="23" fill="#12334a" font-weight="400">¿La evidencia previa sigue siendo aplicable a esta versión?</text><text x="44" y="854" font-size="19" fill="#486174" font-weight="400">Esquema docente original · CC BY-NC 4.0</text><text x="44" y="880" font-size="18" fill="#486174" font-weight="400">Leer junto con el alcance y las fuentes de la unidad.</text></g></svg>
