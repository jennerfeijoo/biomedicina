<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
<title id="title">Trazabilidad en dos direcciones</title><desc id="desc">La necesidad se vincula con validación; el requisito, con verificación. Arquitectura y control de cambios mantienen estos enlaces. Las flechas dobles representan trazabilidad, no causalidad ni una secuencia temporal.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f82"/></marker><marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#087f82"/></marker></defs>
<rect width="900" height="900" rx="24" fill="#f3f7fa"/><g font-family="Arial, sans-serif"><text x="44" y="48" font-size="18" fill="#087f82" font-weight="700">CITONAUTA  /  DISPOSITIVOS MÉDICOS  /  U2</text><text x="44" y="99" font-size="34" fill="#12334a" font-weight="700">Trazabilidad en dos direcciones</text><text x="44" y="137" font-size="22" fill="#486174" font-weight="400">Los enlaces permiten justificar el diseño y revisar cambios.</text><rect x="44" y="185" width="386" height="160" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="203" width="5" height="124" rx="2" fill="#087f82"/><text x="66" y="223" font-size="25" fill="#087f82" font-weight="700">Necesidad</text><text x="66" y="262" font-size="23" fill="#12334a" font-weight="400">Resultado que importa</text><text x="66" y="292" font-size="23" fill="#12334a" font-weight="400">a la población o al usuario.</text><rect x="470" y="185" width="386" height="160" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="470" y="203" width="5" height="124" rx="2" fill="#087f82"/><text x="492" y="223" font-size="25" fill="#087f82" font-weight="700">Validación</text><text x="492" y="262" font-size="23" fill="#12334a" font-weight="400">¿Se satisface el uso previsto</text><text x="492" y="292" font-size="23" fill="#12334a" font-weight="400">en su contexto?</text><path d="M438 265 L462 265" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="44" y="410" width="386" height="160" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="428" width="5" height="124" rx="2" fill="#087f82"/><text x="66" y="448" font-size="25" fill="#087f82" font-weight="700">Requisito identificable</text><text x="66" y="487" font-size="23" fill="#12334a" font-weight="400">Condición verificable,</text><text x="66" y="517" font-size="23" fill="#12334a" font-weight="400">con criterio de aceptación.</text><rect x="470" y="410" width="386" height="160" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="470" y="428" width="5" height="124" rx="2" fill="#087f82"/><text x="492" y="448" font-size="25" fill="#087f82" font-weight="700">Verificación</text><text x="492" y="487" font-size="23" fill="#12334a" font-weight="400">Método, resultado y evidencia</text><text x="492" y="517" font-size="23" fill="#12334a" font-weight="400">frente al requisito.</text><path d="M438 490 L462 490" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M237 355 L237 397" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M663 355 L663 397" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><rect x="44" y="635" width="812" height="165" rx="18" fill="white" stroke="#cddce5" stroke-width="2"/><rect x="44" y="653" width="5" height="129" rx="2" fill="#087f82"/><text x="66" y="673" font-size="25" fill="#087f82" font-weight="700">Arquitectura y cambios</text><text x="66" y="712" font-size="23" fill="#12334a" font-weight="400">Asignar requisitos a funciones, módulos e interfaces.</text><text x="66" y="742" font-size="23" fill="#12334a" font-weight="400">Mantener enlaces y revisar su impacto cuando cambia el diseño.</text><path d="M237 580 L237 623" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><path d="M663 580 L663 623" fill="none" stroke="#087f82" stroke-width="3" marker-end="url(#arrow)" marker-start="url(#back)"/><text x="44" y="854" font-size="19" fill="#486174" font-weight="400">Esquema docente original · CC BY-NC 4.0</text><text x="44" y="880" font-size="18" fill="#486174" font-weight="400">Leer junto con el alcance y las fuentes de la unidad.</text></g></svg>
