name: One-shot Biosensores U5 self-assessment repair

on:
  push:
    branches:
      - codex/biosensores-unit-05-academic-quality

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/biosensores-unit-05-academic-quality
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Repair final self-assessment object
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('data/course_redevelopment/biosensores/units/unit-05.json'),
              Path('data/generated_units/biosensores/unit-05.json'),
          ]
          needle = '"question": "¿Qué queda fuera de U5 aunque el expediente analítico sea sólido?"'
          for path in paths:
              lines = path.read_text(encoding='utf-8').splitlines()
              matches = [i for i, line in enumerate(lines) if needle in line]
              assert len(matches) == 1, (path, matches)
              i = matches[0]
              if not lines[i].rstrip().endswith('}'):
                  lines[i] += '}'
              text = '\n'.join(lines) + '\n'
              json.loads(text)
              path.write_text(text, encoding='utf-8')

          assert paths[0].read_bytes() == paths[1].read_bytes()
          PY
          python tests/test_biosensores_unit_05_curated.py
      - name: Commit repair and self-clean
        run: |
          rm .github/workflows/fix-biosensores-u5-self-assessment-temp.yml
          git config user.name "JennerFeijoo"
          git config user.email "65651751+jennerfeijoo@users.noreply.github.com"
          git add -A
          git commit -m "Fix Biosensores U5 self-assessment JSON"
          git push origin HEAD:codex/biosensores-unit-05-academic-quality
