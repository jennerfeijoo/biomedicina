name: Bioinstrumentation U4 Practices

on:
  pull_request:
    paths:
      - "data/practice_implementations/bioinstrumentacion-unit-04.json"
      - "data/unit_preparation/bioinstrumentacion-unit-04-blocker-resolution.json"
      - "scripts/bioinstrumentation_u4_practice_u4p1.py"
      - "scripts/bioinstrumentation_u4_practice_u4p2.py"
      - "scripts/bioinstrumentation_u4_practice_u4p3.py"
      - "scripts/validate_bioinstrumentation_u4_practices.py"
      - "docs/pilots/bioinstrumentacion/unit-04/PRACTICE_IMPLEMENTATION.md"
      - ".github/workflows/bioinstrumentation-u4-practices.yml"
  push:
    branches: [main]
    paths:
      - "data/practice_implementations/bioinstrumentacion-unit-04.json"
      - "scripts/bioinstrumentation_u4_practice_u4p1.py"
      - "scripts/bioinstrumentation_u4_practice_u4p2.py"
      - "scripts/bioinstrumentation_u4_practice_u4p3.py"
      - "scripts/validate_bioinstrumentation_u4_practices.py"
      - ".github/workflows/bioinstrumentation-u4-practices.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/validate_bioinstrumentation_u4_preparation.py
      - run: python scripts/validate_bioinstrumentation_u4_blockers.py
      - run: python scripts/validate_bioinstrumentation_u4_practices.py
