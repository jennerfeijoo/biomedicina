name: One-shot canonical BMC course closure

on:
  push:
    branches:
      - codex/biomecanica-medios-continuos-course-completion

permissions:
  contents: write

jobs:
  curate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/biomecanica-medios-continuos-course-completion
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build canonical course from curated U1-U6
        run: python scripts/curate_bmc_course_temp.py
      - name: Validate canonical academic corpus
        run: |
          python scripts/validate_academic_courses.py --course biomecanica-medios-continuos --strict-content
          python -m unittest tests.test_biomecanica_medios_continuos_canonical
      - name: Validate repository architecture and portfolio
        run: |
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_course_portfolio.py --strict
      - name: Regenerate public course from canonical source
        run: python scripts/generate_site.py --force --subject biomecanica-medios-continuos --with-units --force-authored-units
      - name: Validate public output
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py
      - name: Self-clean and commit canonical closure
        run: |
          rm scripts/curate_bmc_course_temp.py
          rm .github/workflows/curate-bmc-course-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build canonical Biomecánica de Medios Continuos course"
          git pull --rebase origin codex/biomecanica-medios-continuos-course-completion
          git push origin HEAD:codex/biomecanica-medios-continuos-course-completion
