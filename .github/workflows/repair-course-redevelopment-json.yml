name: Repair course redevelopment JSON

on:
  push:
    branches:
      - agent/biologia-desarrollo-evidence-based
    paths:
      - 'scripts/repair_course_redevelopment_json.py'
      - '.github/workflows/repair-course-redevelopment-json.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biologia-desarrollo-evidence-based
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair and validate unit JSON
        run: |
          python scripts/repair_course_redevelopment_json.py \
            --subject-id biologia-desarrollo \
            --write
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data/course_redevelopment/biologia-desarrollo/units')
          for path in sorted(root.glob('unit-*.json')):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'valid: {path}')
          PY
          git diff --check
      - name: Commit repaired files
        run: |
          if git diff --quiet; then
            echo 'No repairs required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/course_redevelopment/biologia-desarrollo/units/unit-*.json
          git commit -m 'Repair redevelopment unit JSON syntax'
          git push origin HEAD:agent/biologia-desarrollo-evidence-based
