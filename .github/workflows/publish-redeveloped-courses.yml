name: Publish redeveloped courses

on:
  pull_request:
    paths:
      - 'data/course_redevelopment/**'
      - 'data/course_outlines.json'
      - 'scripts/publish_courses.py'
      - 'scripts/promote_provisional_subjects.py'
      - 'scripts/package_publication_preview.py'
      - 'scripts/audit_developed_courses.py'
      - 'scripts/sync_catalog_statuses.py'
      - 'scripts/generate_public_indexes.py'
      - 'scripts/validate_generated_units.py'
      - 'scripts/audit_course_completion.py'
      - 'scripts/generate_site.py'
      - 'scripts/advanced_unit_renderer.py'
      - '.github/workflows/publish-redeveloped-courses.yml'
  push:
    branches:
      - main
    paths:
      - 'data/course_redevelopment/**'
      - 'data/course_outlines.json'
      - 'scripts/publish_courses.py'
      - 'scripts/promote_provisional_subjects.py'
      - 'scripts/package_publication_preview.py'
      - 'scripts/audit_developed_courses.py'
      - 'scripts/sync_catalog_statuses.py'
      - 'scripts/generate_public_indexes.py'
      - 'scripts/validate_generated_units.py'
      - 'scripts/audit_course_completion.py'
      - 'scripts/generate_site.py'
      - 'scripts/advanced_unit_renderer.py'
      - '.github/workflows/publish-redeveloped-courses.yml'
  workflow_dispatch:
    inputs:
      subject:
        description: 'Identificador de una asignatura; vacío publica todos los paquetes reconstruidos'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-redeveloped-courses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select courses
        shell: bash
        env:
          REQUESTED_SUBJECT: ${{ inputs.subject }}
        run: |
          if [[ -n "${REQUESTED_SUBJECT:-}" ]]; then
            printf '%s\n' "--subject" "$REQUESTED_SUBJECT" > publication-args.txt
          else
            printf '%s\n' "--all" > publication-args.txt
          fi
          cat publication-args.txt

      - name: Promote reconstructed courses
        id: promote
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mapfile -t args < publication-args.txt
          python scripts/publish_courses.py "${args[@]}" \
            --manifest publication-manifest.json 2>&1 | tee publication-diagnostic.txt

      - name: Upload promotion diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-publication-promotion-diagnostic
          path: |
            publication-args.txt
            publication-manifest.json
            publication-diagnostic.txt
          if-no-files-found: warn

      - name: Enforce promotion
        if: steps.promote.outcome != 'success'
        run: |
          cat publication-diagnostic.txt
          exit 1

      - name: Promote provisional subjects into curriculum
        run: python scripts/promote_provisional_subjects.py --manifest publication-manifest.json

      - name: Validate advanced units
        id: advanced_units
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate_generated_units.py 2>&1 | tee advanced-unit-validation.txt

      - name: Upload advanced-unit validation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-unit-validation-diagnostic
          path: advanced-unit-validation.txt
          if-no-files-found: error

      - name: Enforce advanced-unit validation
        if: steps.advanced_units.outcome != 'success'
        run: |
          cat advanced-unit-validation.txt
          exit 1

      - name: Generate selected public courses
        id: generate_public
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            mapfile -t args < publication-args.txt
            python scripts/publish_courses.py "${args[@]}" --list-subjects > publication-subjects.txt
            while IFS= read -r subject; do
              [[ -z "$subject" ]] && continue
              python scripts/generate_site.py \
                --force \
                --subject "$subject" \
                --with-units \
                --force-authored-units
            done < publication-subjects.txt
          } 2>&1 | tee public-generation-diagnostic.txt

      - name: Upload public-generation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-generation-diagnostic
          path: |
            publication-subjects.txt
            public-generation-diagnostic.txt
          if-no-files-found: warn

      - name: Enforce public generation
        if: steps.generate_public.outcome != 'success'
        run: |
          cat public-generation-diagnostic.txt
          exit 1

      - name: Regenerate affected area and catalog indexes
        run: python scripts/generate_public_indexes.py --manifest publication-manifest.json

      - name: Synchronize catalog editorial statuses
        run: python scripts/sync_catalog_statuses.py

      - name: Validate public alignment
        run: python scripts/audit_public_unit_alignment.py --strict

      - name: Validate internal links
        run: python scripts/validate_links.py

      - name: Verify publication contract
        id: verify_publication
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            mapfile -t args < publication-args.txt
            echo '== Public course contract =='
            python scripts/publish_courses.py "${args[@]}" --check-public
            echo '== Provisional promotion contract =='
            python scripts/promote_provisional_subjects.py --manifest publication-manifest.json --check
            echo '== Public indexes contract =='
            python scripts/generate_public_indexes.py --manifest publication-manifest.json --check
            echo '== Catalog statuses contract =='
            python scripts/sync_catalog_statuses.py --check
          } 2>&1 | tee publication-contract-diagnostic.txt

      - name: Upload publication-contract diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-contract-diagnostic
          path: publication-contract-diagnostic.txt
          if-no-files-found: error

      - name: Enforce publication contract
        if: steps.verify_publication.outcome != 'success'
        run: |
          cat publication-contract-diagnostic.txt
          exit 1

      - name: Audit developed courses
        id: developed_audit
        continue-on-error: true
        run: |
          mkdir -p audit-artifacts
          python scripts/audit_developed_courses.py \
            --strict \
            --json-output audit-artifacts/developed-courses.json \
            --markdown-output audit-artifacts/developed-courses.md \
            > audit-artifacts/developed-courses-summary.txt 2>&1

      - name: Upload developed-course audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developed-courses-audit
          path: audit-artifacts/
          if-no-files-found: error

      - name: Enforce developed-course audit
        if: steps.developed_audit.outcome != 'success'
        run: |
          cat audit-artifacts/developed-courses-summary.txt
          exit 1

      - name: Package publication preview
        run: python scripts/package_publication_preview.py --manifest publication-manifest.json

      - name: Upload publication preview
        uses: actions/upload-artifact@v4
        with:
          name: redeveloped-course-publication-preview
          path: publication-preview/
          if-no-files-found: error

      - name: Package generated indexes
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          manifest = json.loads(Path('publication-manifest.json').read_text(encoding='utf-8'))
          output = Path('generated-indexes')
          catalog = Path('catalogo/index.html')
          target = output / catalog
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(catalog, target)
          for area_id in sorted({course['area_id'] for course in manifest['courses']}):
              source = Path(area_id) / 'index.html'
              target = output / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          PY

      - name: Upload generated indexes
        uses: actions/upload-artifact@v4
        with:
          name: redeveloped-course-indexes
          path: generated-indexes/
          if-no-files-found: error

      - name: Commit public publication
        if: >-
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
          (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/subjects data/generated_courses data/generated_units data/catalog_statuses.json data/citonauta_curriculum.json data/course_outlines.json data/provisional_subjects.json catalogo/index.html
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path('publication-manifest.json').read_text(encoding='utf-8'))
          for course in manifest['courses']:
              subprocess.run(['git', 'add', '-A', '--', course['public_path']], check=True)
              subprocess.run(['git', 'add', '-A', '--', f"{course['area_id']}/index.html"], check=True)
          PY
          if git diff --cached --quiet; then
            echo "No hay cambios de publicación."
            exit 0
          fi
          subjects=$(paste -sd, publication-subjects.txt)
          git commit -m "Publish redeveloped courses: ${subjects}"
          target_branch="${GITHUB_HEAD_REF:-main}"
          git push origin "HEAD:${target_branch}"
