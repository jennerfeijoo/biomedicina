name: Normalize epidemiology equations

on:
  pull_request:
    paths:
      - '.github/workflows/normalize-epidemiology-equations.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize and validate source units
        id: normalize
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee normalization-diagnostic.txt
          import json
          import traceback
          from pathlib import Path

          root = Path('data/course_redevelopment/epidemiologia-metodos-investigacion-clinica/units')
          slash = chr(92)
          replacements = {
              slash + 'leftarrow': '←',
              slash + 'rightarrow': '→',
              slash + 'perp': '⊥',
              slash + 'neq': '≠',
              slash + 'in': '∈',
              slash + ';': ' ',
          }
          changed = []
          for path in sorted(root.glob('unit-*.json')):
              print(f'Validando {path}')
              try:
                  text = path.read_text(encoding='utf-8')
                  lines = []
                  for line in text.splitlines(keepends=True):
                      if '"latex"' in line:
                          for old, new in replacements.items():
                              line = line.replace(old, new)
                          line = line.replace(slash, '')
                      lines.append(line)
                  normalized = ''.join(lines)
                  data = json.loads(normalized)
                  for section in data.get('theory_sections', []):
                      for equation in section.get('equations', []):
                          latex = str(equation.get('latex', ''))
                          if slash in latex:
                              raise ValueError(f'barra invertida restante en ecuación: {latex!r}')
                  if normalized != text:
                      path.write_text(normalized, encoding='utf-8')
                      changed.append(str(path))
              except Exception:
                  print(f'ERROR EN {path}')
                  traceback.print_exc()
                  raise
          print('Archivos normalizados:', changed)
          PY
      - name: Upload normalization diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epidemiology-equation-normalization
          path: normalization-diagnostic.txt
          if-no-files-found: error
      - name: Enforce normalization
        if: steps.normalize.outcome != 'success'
        run: |
          cat normalization-diagnostic.txt
          exit 1
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/course_redevelopment/epidemiologia-metodos-investigacion-clinica/units
          if git diff --cached --quiet; then
            echo "No hay expresiones que normalizar."
            exit 0
          fi
          git commit -m "Normalize epidemiology equation notation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
