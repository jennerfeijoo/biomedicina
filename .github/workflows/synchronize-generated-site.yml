name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Curate Biomecanica de Medios Continuos U1
        run: python scripts/curate_bmc_u1_temp.py

      - name: Validate structured academic content
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_generic_content.py
          python scripts/audit_curriculum_completeness.py
          python tests/test_biomecanica_medios_continuos_unit_01_curated.py

      - name: Regenerate affected public course
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_site.py --force --subject biomecanica-medios-continuos --with-units --force-authored-units
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Remove temporary curator and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          rm -f scripts/curate_bmc_u1_temp.py

      - name: Commit curated source, mirror, regression and public pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios permanentes que sincronizar."
            exit 0
          fi
          git commit -m "Curate Biomecanica de Medios Continuos U1"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
