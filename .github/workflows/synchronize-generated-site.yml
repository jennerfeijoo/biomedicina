name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build canonical Biosensores corpus
        shell: bash
        run: |
          set -euo pipefail
          python scripts/curate_biosensores_canonical_temp.py
          python scripts/patch_biosensores_canonical_temp.py
          python scripts/validate_academic_courses.py --course biosensores --strict-content
          python -m unittest tests.test_biosensores_canonical_course

      - name: Validate structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          python scripts/validate_academic_courses.py --course biosensores --strict-content
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Synchronize editorial metadata
        shell: bash
        run: |
          set -euo pipefail
          python scripts/sync_catalog_statuses.py

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py
          python scripts/validate_academic_courses.py --course biosensores --strict-content
          python -m unittest tests.test_biosensores_canonical_course

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-site-synchronization
          path: global-generation.txt
          if-no-files-found: warn

      - name: Commit canonical closure and public site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          rm -f scripts/curate_biosensores_canonical_temp.py
          rm -f scripts/patch_biosensores_canonical_temp.py
          rm -f scripts/build_biosensores_canonical_temp.py
          rm -f global-generation.txt
          git add -A
          if git diff --cached --quiet; then
            echo "El cierre canónico de Biosensores ya está sincronizado."
            exit 0
          fi
          git commit -m "Close Biosensores canonical academic corpus"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
