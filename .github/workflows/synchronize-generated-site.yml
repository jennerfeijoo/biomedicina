name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Repair legacy Biomateriales U4 JSON escape
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('data/course_redevelopment/biomateriales/units/unit-04.json')
          mirror = Path('data/generated_units/biomateriales/unit-04.json')
          text = source.read_text(encoding='utf-8')
          text = text.replace('m_{productos\\ recuperados}', 'm_{productos\\\\ recuperados}')
          text = text.replace('m_{perdida\\ del\\ especimen}', 'm_{perdida\\\\ del\\\\ especimen}')
          json.loads(text)
          source.write_text(text, encoding='utf-8')
          mirror.write_text(text, encoding='utf-8')
          assert source.read_bytes() == mirror.read_bytes()
          PY

      - name: Validate structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python -m unittest tests.test_biomateriales_unit_04_curated
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Restore workflow and commit clean result
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          rm -f .github/workflows/temp-fix-biomateriales-u4-json.yml global-generation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No clean changes to commit."
            exit 0
          fi
          git commit -m "Repair and synchronize Biomateriales U4"
          git fetch origin "${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
