name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: publish-redeveloped-courses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Isolate unpublished Bioinstrumentation authoral draft
        shell: bash
        run: |
          set -euo pipefail
          unit="data/course_redevelopment/bioinstrumentacion/units/unit-01.json"
          if [[ -f "$unit" ]]; then
            mkdir -p "$RUNNER_TEMP/bioinstrumentacion-u1"
            mv "$unit" "$RUNNER_TEMP/bioinstrumentacion-u1/unit-01.json"
            echo "Unpublished authoral draft excluded from public generation."
          fi

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Compile Bioinstrumentation U1 authoral source
        shell: bash
        run: |
          python scripts/build_bioinstrumentation_u1_authoral_unit.py
          python scripts/validate_bioinstrumentation_u1_authoral_unit.py

      - name: Validate Bioinstrumentation U1 scientific and editorial audit
        run: python scripts/validate_bioinstrumentation_u1_scientific_editorial_audit.py

      - name: Validate Bioinstrumentation U2 authoring preparation
        run: python scripts/validate_bioinstrumentation_u2_preparation.py

      - name: Validate Bioinstrumentation U2 technical blocker resolution
        run: python scripts/validate_bioinstrumentation_u2_blockers.py

      - name: Validate Bioinstrumentation U2 disciplinary review handoff
        run: python scripts/validate_bioinstrumentation_u2_review_handoff.py

      - name: Validate Bioinstrumentation U2 provisional practice authorization
        run: python scripts/validate_bioinstrumentation_u2_provisional_practice_authorization.py

      - name: Validate Bioinstrumentation U2 practices
        run: python scripts/validate_bioinstrumentation_u2_practices.py

      - name: Build Bioinstrumentation U2 scientific and editorial audit
        run: python scripts/build_bioinstrumentation_u2_scientific_editorial_audit.py

      - name: Validate Bioinstrumentation U2 assessment
        run: python scripts/validate_bioinstrumentation_u2_assessment.py

      - name: Validate Bioinstrumentation U2 scientific and editorial audit
        run: python scripts/validate_bioinstrumentation_u2_scientific_editorial_audit.py

      - name: Build Bioinstrumentation U2 provisional authoring authorization
        run: python scripts/build_bioinstrumentation_u2_provisional_authorization.py

      - name: Validate Bioinstrumentation U2 provisional authoring authorization
        run: python scripts/validate_bioinstrumentation_u2_provisional_authorization.py

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-site-synchronization
          path: global-generation.txt
          if-no-files-found: warn

      - name: Commit deterministic site, audit and authorization state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            data/assessment_implementations/bioinstrumentacion-unit-02.json \
            data/assessment_fixtures/bioinstrumentacion/unit-02/mastery-dynamic.json \
            data/assessment_fixtures/bioinstrumentacion/unit-02/mastery-loading.json \
            data/assessment_fixtures/bioinstrumentacion/unit-02/diagnostic-loading.json \
            data/course_audits/bioinstrumentacion/UNIT_02_PRACTICES_ASSESSMENT_SCIENTIFIC_EDITORIAL_AUDIT_2026-07-29.json \
            data/course_plan_packages/package-04-bioinstrumentation-excellence-pilot.json \
            docs/pilots/bioinstrumentacion/unit-02/ASSESSMENT_IMPLEMENTATION.md \
            docs/pilots/bioinstrumentacion/unit-02/AUTHORING_READINESS.md \
            docs/pilots/bioinstrumentacion/unit-02/INTERNAL_SCIENTIFIC_EDITORIAL_AUDIT.md \
            data/course_redevelopment/bioinstrumentacion/units/unit-01.json \
            ciencias-basicas \
            biologicas-medicas \
            ingenieria-biomedica \
            gestion-etica-comunicacion \
            catalogo
          if git diff --cached --quiet; then
            echo "El sitio, la auditoría y la autorización provisional ya están sincronizados."
            exit 0
          fi
          git commit -m "Synchronize provisional U2 authoring authorization"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
