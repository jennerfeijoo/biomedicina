name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: publish-redeveloped-courses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-site-synchronization
          path: global-generation.txt
          if-no-files-found: warn

      - name: Commit deterministic site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ciencias-basicas biologicas-medicas ingenieria-biomedica gestion-etica-comunicacion catalogo
          if git diff --cached --quiet; then
            echo "El sitio generado ya está sincronizado."
            exit 0
          fi
          git commit -m "Synchronize deterministic site generation"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
