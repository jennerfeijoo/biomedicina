name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build canonical Ingeniería de Tejidos corpus
        shell: bash
        run: |
          set -euo pipefail
          python scripts/curate_ingenieria_tejidos_canonical_temp.py

      - name: Validate structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_academic_courses.py --course ingenieria-tejidos --strict-content
          python -m unittest tests.test_ingenieria_tejidos_canonical
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Regenerate Ingeniería de Tejidos deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --subject ingenieria-tejidos --with-units 2>&1 | tee canonical-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py
          python scripts/validate_academic_courses.py --course ingenieria-tejidos --strict-content

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ingenieria-tejidos-canonical-synchronization
          path: canonical-generation.txt
          if-no-files-found: warn

      - name: Remove temporary curator and restore workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          rm -f scripts/curate_ingenieria_tejidos_canonical_temp.py canonical-generation.txt

      - name: Commit canonical corpus and deterministic public site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            data/courses/ingenieria-tejidos \
            tests/test_ingenieria_tejidos_canonical.py \
            biologicas-medicas/ingenieria-tejidos \
            .github/workflows/synchronize-generated-site.yml \
            scripts/curate_ingenieria_tejidos_canonical_temp.py
          if git diff --cached --quiet; then
            echo "El cierre canónico ya está sincronizado."
            exit 0
          fi
          git commit -m "Build canonical Ingeniería de Tejidos course"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
