name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Clarify moral residue and self-clean curator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('data/course_redevelopment/etica-responsabilidad-social/units/unit-01.json')
          mirror = Path('data/generated_units/etica-responsabilidad-social/unit-01.json')
          text = source.read_text(encoding='utf-8')
          needle = 'Es necesario especificar qué exige el principio en ese contexto, evaluar la fuerza de las razones y explicar por qué una restricción es necesaria y proporcional.'
          addition = ' Una decisión justificable puede dejar un residuo moral: una obligación, un valor o una razón relevante puede permanecer insatisfecha aunque otra razón deba prevalecer tras comparar las alternativas. Registrar ese residuo orienta salvaguardas, mitigación, reconocimiento de la pérdida y revisión futura; no equivale por sí solo a demostrar que la decisión elegida sea incorrecta.'
          if text.count(needle) != 1:
              raise SystemExit(f'Expected exactly one target paragraph fragment, found {text.count(needle)}')
          updated = text.replace(needle, needle + addition, 1)
          source.write_text(updated, encoding='utf-8')
          mirror.write_text(updated, encoding='utf-8')
          if source.read_bytes() != mirror.read_bytes():
              raise SystemExit('Source and generated mirror diverged after patch')
          PY
          git fetch origin main
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            data/course_redevelopment/etica-responsabilidad-social/units/unit-01.json \
            data/generated_units/etica-responsabilidad-social/unit-01.json \
            .github/workflows/synchronize-generated-site.yml
          git commit -m "Clarify moral residue in Ética U1"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Validate structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-site-synchronization
          path: global-generation.txt
          if-no-files-found: warn

      - name: Commit deterministic public site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            ciencias-basicas \
            biologicas-medicas \
            ingenieria-biomedica \
            gestion-etica-comunicacion \
            catalogo
          if git diff --cached --quiet; then
            echo "El sitio público ya está sincronizado con sus fuentes estructuradas."
            exit 0
          fi
          git commit -m "Synchronize generated public site"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
