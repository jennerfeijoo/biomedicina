name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Add verified core resource
        run: python scripts/add_biomecanica_core_resource_temp.py

      - name: Validate structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_course_readiness.py --strict
          python tests/test_biomecanica_course_completion.py

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Commit readiness fix and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          git rm scripts/add_biomecanica_core_resource_temp.py
          rm -f global-generation.txt
          git add -A -- data/course_redevelopment/biomecanica/course.json .github/workflows/synchronize-generated-site.yml scripts/add_biomecanica_core_resource_temp.py ingenieria-biomedica/biomecanica catalogo ingenieria-biomedica/index.html
          if git diff --cached --quiet; then
            echo "No hay cambios que confirmar."
            exit 0
          fi
          git commit -m "Complete Biomecanica course readiness resources"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
