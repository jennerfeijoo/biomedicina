name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Normalize Biomateriales U4 recovery equation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('data/course_redevelopment/biomateriales/units/unit-04.json')
          mirror = Path('data/generated_units/biomateriales/unit-04.json')
          text = source.read_text(encoding='utf-8')
          malformed = r'"latex": "f_{rec}=\\frac{m_{productos\ recuperados}}{m_{perdida\ del\ especimen}}"'
          plain = '"latex": "f_rec=m_rec/m_loss"'
          fixed = r'"latex": "f_{rec}=\\frac{m_{recuperada}}{m_{perdida}}"'
          if malformed in text:
              text = text.replace(malformed, fixed, 1)
          elif plain in text:
              text = text.replace(plain, fixed, 1)
          elif fixed not in text:
              raise SystemExit('Recovery equation is in an unexpected state')
          json.loads(text)
          source.write_text(text, encoding='utf-8')
          mirror.write_text(text, encoding='utf-8')
          PY

      - name: Validate structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python -m unittest tests.test_biomateriales_unit_04_curated
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-site-synchronization
          path: global-generation.txt
          if-no-files-found: warn

      - name: Restore temporary workflow changes and commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          rm -f .github/workflows/fix-biomateriales-u4-json-temp.yml global-generation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            .github/workflows/synchronize-generated-site.yml \
            .github/workflows/fix-biomateriales-u4-json-temp.yml \
            data/course_redevelopment/biomateriales/units/unit-04.json \
            data/generated_units/biomateriales/unit-04.json \
            tests/test_biomateriales_unit_04_curated.py \
            ciencias-basicas \
            biologicas-medicas \
            ingenieria-biomedica \
            gestion-etica-comunicacion \
            catalogo
          if git diff --cached --quiet; then
            echo "No hay cambios que confirmar."
            exit 0
          fi
          git commit -m "Normalize and synchronize Biomateriales U4"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
