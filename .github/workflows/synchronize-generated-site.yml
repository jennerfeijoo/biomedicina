name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Patch canonical traceability builder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/curate_laboratorio_biomecanica_canonical_temp.py')
          text = path.read_text(encoding='utf-8')

          marker = 'source_map = {item["id"]: item for item in sources["sources"]}\ncourse["core_source_ids"] = list(source_map)[: min(16, len(source_map))]\n'
          support_code = '''source_map = {item["id"]: item for item in sources["sources"]}\nCANONICAL_SOURCE_SUPPORT = {\n    "https://www.isbweb.org/activities/standards": "Las recomendaciones ISB estandarizan sistemas de coordenadas y reporte del movimiento para mejorar comparabilidad y reproducibilidad entre análisis biomecánicos.",\n    "https://pubmed.ncbi.nlm.nih.gov/11415549/": "La definición de marcos anatómicos condiciona cómo se representan posición y orientación ósea durante el movimiento.",\n    "https://pubmed.ncbi.nlm.nih.gov/11415604/": "La estimación de posición y orientación ósea mediante marcadores está afectada por artefactos experimentales que deben separarse del movimiento real.",\n    "https://pubmed.ncbi.nlm.nih.gov/28923393/": "El artefacto de tejido blando es una fuente metodológica relevante de error al inferir movimiento óseo desde marcadores cutáneos.",\n    "https://pubmed.ncbi.nlm.nih.gov/4837552/": "La diferenciación de datos cinemáticos puede amplificar ruido de medición, por lo que el procesamiento debe justificarse antes de interpretar velocidad o aceleración.",\n    "https://pubmed.ncbi.nlm.nih.gov/34283131/": "El filtrado de señales biomecánicas debe justificarse según señal, tarea, muestreo y variable de interés, evitando cutoffs universales.",\n    "https://pubmed.ncbi.nlm.nih.gov/1517265/": "La configuración de puntos de control influye en la exactitud de reconstrucciones fotogramétricas basadas en DLT.",\n    "https://pubmed.ncbi.nlm.nih.gov/28549599/": "La exactitud espacial de un sistema óptico de captura puede variar dentro del volumen de medición y con la configuración de cámaras.",\n    "https://pubmed.ncbi.nlm.nih.gov/32705424/": "La validez del análisis automatizado 2D de cinemática de carrera depende de la variable y del plano evaluados y no debe generalizarse a toda la cinemática 3D.",\n    "https://pubmed.ncbi.nlm.nih.gov/37307761/": "La precisión de colocación de marcadores entre evaluadores puede modificar variables cinemáticas calculadas en modelos convencionales de marcha.",\n    "https://pubmed.ncbi.nlm.nih.gov/37541054/": "La validez y fiabilidad del video 2D para ángulos articulares durante carrera varía entre variables y condiciones y requiere evaluación específica del uso previsto.",\n    "https://pubmed.ncbi.nlm.nih.gov/18755590/": "La calibración de plataformas y cintas instrumentadas con cargas y posiciones conocidas permite detectar y corregir errores de fuerza y punto de aplicación.",\n    "https://pubmed.ncbi.nlm.nih.gov/28763716/": "La calibración in situ puede corregir errores del punto de aplicación de fuerza que dependen de la instalación y geometría del sistema.",\n    "https://pubmed.ncbi.nlm.nih.gov/20095462/": "La calibración in situ y la optimización de la transformación entre captura de movimiento y sistema de fuerzas mejoran la coherencia de mediciones instrumentadas.",\n    "https://pubmed.ncbi.nlm.nih.gov/2384485/": "La determinación del punto de aplicación de fuerza en plataformas piezoeléctricas tiene errores medibles que dependen de la posición de carga.",\n    "https://pubmed.ncbi.nlm.nih.gov/10521614/": "La exactitud del centro de presión de una plataforma debe caracterizarse experimentalmente y no asumirse a partir de la fuerza vertical por sí sola.",\n    "https://pubmed.ncbi.nlm.nih.gov/12443947/": "Las plataformas de galgas extensométricas pueden requerir corrección in situ para representar adecuadamente fuerzas y punto de aplicación en su instalación real.",\n    "https://pubmed.ncbi.nlm.nih.gov/25405420/": "La verificación in situ permite caracterizar exactitud, precisión y resolución de plataformas de fuerza y equilibrio bajo condiciones documentadas.",\n    "https://pubmed.ncbi.nlm.nih.gov/22889928/": "La interpretación de estabilometría depende de parámetros de adquisición como intervalo y frecuencia de muestreo, que deben estandarizarse y reportarse.",\n}\nfor source in sources["sources"]:\n    support = CANONICAL_SOURCE_SUPPORT.get(str(source.get("url") or ""))\n    if support and not source.get("description") and not source.get("why_relevant"):\n        source["description"] = support\nwrite(TARGET / "sources.json", sources)\nsource_map = {item["id"]: item for item in sources["sources"]}\ncourse["core_source_ids"] = list(source_map)[: min(16, len(source_map))]\n'''
          if marker not in text:
              raise SystemExit('canonical source-map insertion point not found')
          text = text.replace(marker, support_code, 1)

          start = text.index('# Build claims only from source descriptions')
          end = text.index('# Complete the six formative assessments', start)
          claim_code = '''# Build a compact claim registry from statements that are literally taught in each unit.\n# Each anchor has one deliberately chosen verified source; this avoids treating bibliography descriptions as teaching claims.\nCLAIM_ANCHORS = {\n    1: [\n        ("Origen, ejes, sentido y unidades son parte inseparable de cualquier coordenada.", "https://www.isbweb.org/activities/standards"),\n        ("Precisión geométrica y validez del marco anatómico son problemas diferentes.", "https://pubmed.ncbi.nlm.nih.gov/11415549/"),\n        ("Calibración, verificación y ajuste responden a preguntas metrológicas distintas.", "https://jcgm.bipm.org/vim/en/2.39.html"),\n        ("El presupuesto de incertidumbre conecta fuentes, modelo y criterio técnico de uso.", "https://www.bipm.org/en/doi/10.59161/jcgm100-2008e"),\n    ],\n    2: [\n        ("La proyección 2D pierde información fuera del plano y su validez depende de la tarea y la variable.", "https://pubmed.ncbi.nlm.nih.gov/37541054/"),\n        ("La variabilidad de colocación puede propagarse a ángulos aun cuando el sistema óptico sea preciso.", "https://pubmed.ncbi.nlm.nih.gov/37307761/"),\n        ("El artefacto de tejido blando no es equivalente al ruido instrumental y puede compartir banda con el movimiento real.", "https://pubmed.ncbi.nlm.nih.gov/28923393/"),\n        ("El cutoff de un filtro depende de señal, tarea, frecuencia de muestreo y objetivo; no es una constante universal.", "https://pubmed.ncbi.nlm.nih.gov/34283131/"),\n    ],\n    3: [\n        ("La verificación in situ evalúa el sistema instalado y no se sustituye con especificaciones nominales del fabricante.", "https://pubmed.ncbi.nlm.nih.gov/18755590/"),\n        ("Las ecuaciones de CoP son inseparables de la geometría y convención de la plataforma.", "https://pubmed.ncbi.nlm.nih.gov/2384485/"),\n        ("La calidad del CoP debe verificarse en posiciones y condiciones representativas del uso.", "https://pubmed.ncbi.nlm.nih.gov/10521614/"),\n        ("Toda componente necesita origen, ejes, signo y unidades antes de compararse o transformarse.", "https://www.isbweb.org/activities/standards"),\n    ],\n    4: [\n        ("La amplitud sEMG no es una medida directa de fuerza muscular ni de neural drive.", "https://pubmed.ncbi.nlm.nih.gov/39069427/"),\n        ("El volumen conductor y la posición relativa del electrodo modifican amplitud y contenido espectral.", "https://pubmed.ncbi.nlm.nih.gov/25277737/"),\n        ("Tipo, tamaño, distancia, orientación y localización del electrodo forman parte del mensurando práctico.", "https://pubmed.ncbi.nlm.nih.gov/11018445/"),\n        ("Los filtros reducen componentes no deseadas pero también pueden modificar información de interés.", "https://pubmed.ncbi.nlm.nih.gov/11369267/"),\n    ],\n    5: [\n        ("La dinámica inversa integra cinemática, cargas externas y propiedades inerciales dentro de un modelo segmentario explícito.", "https://opensimconfluence.atlassian.net/wiki/spaces/OpenSim/pages/53090063/Getting+Started+with+Inverse+Dynamics"),\n        ("Los parámetros antropométricos son estimaciones con procedencia e incertidumbre propias.", "https://pubmed.ncbi.nlm.nih.gov/17889542/"),\n        ("ISB prioriza reporte reproducible de decisiones metodológicas frente a una receta única de cálculo.", "https://pubmed.ncbi.nlm.nih.gov/31791632/"),\n        ("Momento articular neto no equivale a fuerza muscular individual ni fuerza de contacto articular.", "https://opensimconfluence.atlassian.net/wiki/spaces/OpenSim/pages/53090652/Planning+an+OpenSim+Simulation"),\n    ],\n    6: [\n        ("Separar incertidumbre de medición de variabilidad entre unidades de observación.", "https://www.bipm.org/en/doi/10.59161/jcgm100-2008e"),\n        ("ICC describe fiabilidad relativa y depende de su modelo y diseño.", "https://pubmed.ncbi.nlm.nih.gov/27330520/"),\n        ("Correlación no demuestra acuerdo entre métodos.", "https://pubmed.ncbi.nlm.nih.gov/2868172/"),\n        ("FAIR describe propiedades de reutilización y descubrimiento, no una obligación de publicar datos sensibles.", "https://pubmed.ncbi.nlm.nih.gov/26978244/"),\n    ],\n}\nurl_to_id = {str(src.get("url") or ""): sid for sid, src in source_map.items()}\nclaims = []\nfor n, path in enumerate(unit_paths, start=1):\n    unit = load(path)\n    serialized = json.dumps(unit, ensure_ascii=False)\n    claim_ids = []\n    anchors = CLAIM_ANCHORS[n]\n    if len(anchors) != 4:\n        raise SystemExit(f"U{n}: número inesperado de claims ancla")\n    for i, (claim_text, source_url) in enumerate(anchors, start=1):\n        if claim_text not in serialized:\n            raise SystemExit(f"U{n}: claim no aparece literalmente en la unidad: {claim_text}")\n        sid = url_to_id.get(source_url)\n        if sid is None or sid not in unit["source_ids"]:\n            raise SystemExit(f"U{n}: fuente del claim ausente en la unidad: {source_url}")\n        src = source_map[sid]\n        if src.get("verification_status") != "verified_directly":\n            raise SystemExit(f"U{n}: fuente del claim no verificada directamente: {source_url}")\n        cid = f"LABBIO-U{n:02d}-C{i:03d}"\n        claim_ids.append(cid)\n        claims.append({\n            "claim_id": cid,\n            "unit": n,\n            "text": claim_text,\n            "claim_type": "methodological_or_interpretive",\n            "risk": "medium",\n            "context": f"Afirmación ancla enseñada literalmente en {unit['title']}; interpretar dentro del método, supuestos y límites declarados.",\n            "source_id": sid,\n            "locator": {"url": src.get("url"), "title": src.get("title") or src.get("citation")},\n            "support": "direct",\n            "source_verification_status": "verified_directly",\n            "review_state": "ai_review_provisional",\n            "reviewer_validation_id": None,\n            "reviewed_at": TODAY,\n            "id": cid,\n            "unit_id": unit["id"],\n        })\n    unit["claim_ids"] = claim_ids\n    write(path, unit)\nwrite(TARGET / "claims.json", {\n    "$schema": "../../../schemas/academic/registry-v1.schema.json",\n    "schema_version": "1.0",\n    "course_id": SUBJECT,\n    "content_version": "1.0.0",\n    "content_commit": None,\n    "scope": "Veinticuatro afirmaciones metodológicas ancla, cuatro por unidad, tomadas literalmente del contenido lectivo y vinculadas a fuentes verificadas directamente; revisión disciplinaria humana pendiente.",\n    "review_state": "ai_review_provisional",\n    "claims": claims,\n})\n\n'''
          text = text[:start] + claim_code + text[end:]
          old_threshold = 'self.assertGreaterEqual(len(self.claims["claims"]), 36)'
          new_threshold = 'self.assertGreaterEqual(len(self.claims["claims"]), 24)'
          if old_threshold not in text:
              raise SystemExit('claim regression threshold not found')
          text = text.replace(old_threshold, new_threshold, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build canonical Laboratorio de Biomecanica closure
        run: python scripts/curate_laboratorio_biomecanica_canonical_temp.py

      - name: Validate canonical and structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_academic_courses.py
          python -m unittest tests.test_laboratorio_biomecanica_canonical_course -v
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_generic_content.py
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt
          python scripts/sync_catalog_statuses.py

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Restore workflow and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          rm -f .github/workflows/curate-laboratorio-biomecanica-canonical-temp.yml
          rm -f scripts/curate_laboratorio_biomecanica_canonical_temp.py
          rm -f global-generation.txt

      - name: Commit canonical closure and synchronized public site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Close Laboratorio de Biomecánica canonical course"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
