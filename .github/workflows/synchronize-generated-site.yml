name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Bootstrap canonical Desarrollo de Dispositivos Médicos
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/courses/desarrollo-dispositivos-medicos/course.json ]]; then
            python scripts/migrate_course_to_canonical.py \
              --subject desarrollo-dispositivos-medicos \
              --course-code DDM
          fi
          python scripts/validate_canonical_courses.py
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('data/courses/desarrollo-dispositivos-medicos')
          required = [
              root / 'course.json', root / 'glossary.json', root / 'sources.json',
              root / 'claims.json', root / 'media.json',
              root / 'assessments/course-assessment.json',
          ]
          required += [root / 'units' / f'unit-{i:02d}.json' for i in range(1, 7)]
          required += [root / 'assessments' / f'unit-{i:02d}.json' for i in range(1, 7)]
          for path in required:
              if not path.exists():
                  raise SystemExit(f'Missing canonical output: {path}')
              json.loads(path.read_text(encoding='utf-8'))
          PY

      - name: Validate structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-site-synchronization
          path: global-generation.txt
          if-no-files-found: warn

      - name: Commit canonical bootstrap and deterministic public site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          git rm -f .github/workflows/canonicalize-desarrollo-dispositivos-temp.yml || true
          git add -A -- \
            .github/workflows/synchronize-generated-site.yml \
            data/courses/desarrollo-dispositivos-medicos \
            ciencias-basicas \
            biologicas-medicas \
            ingenieria-biomedica \
            gestion-etica-comunicacion \
            catalogo
          if git diff --cached --quiet; then
            echo "El corpus canónico y el sitio público ya están sincronizados."
            exit 0
          fi
          git commit -m "Bootstrap canonical Desarrollo de Dispositivos Médicos"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
