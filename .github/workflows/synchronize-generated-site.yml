name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: publish-redeveloped-courses-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply one-time editorial truth migration
        run: python scripts/_apply_editorial_truth_patch.py

      - name: Validate pilot foundation
        run: |
          python -m py_compile scripts/generate_site.py scripts/validate_pilot_foundations.py
          python scripts/validate_course_plan_packages.py
          python scripts/validate_pilot_foundations.py

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-site-synchronization
          path: global-generation.txt
          if-no-files-found: warn

      - name: Remove one-time migration scaffolding
        shell: bash
        run: |
          rm scripts/_apply_editorial_truth_patch.py
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml

      - name: Commit deterministic site and permanent migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "El sitio generado ya está sincronizado."
            exit 0
          fi
          git commit -m "Enforce authoritative editorial states"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
