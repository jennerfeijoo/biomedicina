name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Curate Economia y Gestion U4
        shell: bash
        run: |
          set -euo pipefail
          python scripts/curate_economia_gestion_empresas_u4_temp.py

      - name: Validate structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          python -m unittest tests.test_economia_gestion_empresas_unit_04_curated
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Restore permanent workflow and remove temporary curator
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/synchronize-generated-site.yml > .github/workflows/synchronize-generated-site.yml
          rm -f scripts/curate_economia_gestion_empresas_u4_temp.py global-generation.txt

      - name: Commit curated unit and synchronized site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios después de curar U4."
            exit 0
          fi
          git commit -m "Curate Economía y Gestión de Empresas U4"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
