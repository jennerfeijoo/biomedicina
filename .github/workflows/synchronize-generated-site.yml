name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Repair strengthened Economía U4 curation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('data/course_redevelopment/economia-gestion-empresas/units/unit-04.json')
          mirror = Path('data/generated_units/economia-gestion-empresas/unit-04.json')
          test = Path('tests/test_economia_gestion_empresas_unit_04_curated.py')

          text = source.read_text(encoding='utf-8')
          repairs = [
              (
                  '''    {"error": "Introducir ICER, QALY o coste-efectividad formal en U4.", "correction": "Reservar evaluación económica sanitaria para U5 y limitar U4 a mercado, posicionamiento, adopción y proceso de compra."
            ],''',
                  '''    {"error": "Introducir ICER, QALY o coste-efectividad formal en U4.", "correction": "Reservar evaluación económica sanitaria para U5 y limitar U4 a mercado, posicionamiento, adopción y proceso de compra."}
            ],''',
              ),
              (
                  '''    {"question": "¿Qué conclusión pertenece a U5 y no a U4?", "answer": "Una conclusión formal de coste-efectividad o valor sanitario basada en resultados y costes comparativos.", "reasoning": "U4 estudia mercado, posicionamiento, adopción y compra; U5 aborda evaluación económica.", "common_error": "Usar ingresos potenciales como si fueran coste-efectividad."
            ],''',
                  '''    {"question": "¿Qué conclusión pertenece a U5 y no a U4?", "answer": "Una conclusión formal de coste-efectividad o valor sanitario basada en resultados y costes comparativos.", "reasoning": "U4 estudia mercado, posicionamiento, adopción y compra; U5 aborda evaluación económica.", "common_error": "Usar ingresos potenciales como si fueran coste-efectividad."}
            ],''',
              ),
              (
                  '''    {"topic": "Límite", "connection": "Mercado grande, interés, ingresos de escenario o acceso regulatorio no demuestran beneficio clínico, coste-efectividad, adopción sostenida ni recomendación de compra."
            ],''',
                  '''    {"topic": "Límite", "connection": "Mercado grande, interés, ingresos de escenario o acceso regulatorio no demuestran beneficio clínico, coste-efectividad, adopción sostenida ni recomendación de compra."}
            ],''',
              ),
          ]
          for broken, fixed in repairs:
              if broken not in text:
                  raise SystemExit(f'No se encontró un cierre JSON roto esperado: {broken[:100]!r}')
              text = text.replace(broken, fixed, 1)

          data = json.loads(text)
          assert data['unit'] == 4
          assert len(data['common_errors']) >= 12
          assert len(data['self_assessment']) >= 12
          assert len(data['biomedical_connections']) >= 5
          source.write_text(text, encoding='utf-8')
          mirror.write_bytes(source.read_bytes())

          test_text = test.read_text(encoding='utf-8')
          brittle = '''        self.assertNotIn("píxeles", text)
                  self.assertNotIn("vóxeles", text)
          '''
          robust = '''        self.assertNotIn("asignación de píxeles o vóxeles a regiones de interés según criterios anatómicos, funcionales o algorítmicos", text)
                  self.assertIn("no significa dividir una imagen", text)
          '''
          if brittle not in test_text:
              raise SystemExit('No se encontró la aserción frágil esperada en la regresión U4')
          test_text = test_text.replace(brittle, robust, 1)
          test.write_text(test_text, encoding='utf-8')
          PY

      - name: Validate structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python -m unittest tests.test_economia_gestion_empresas_unit_04_curated
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-site-synchronization
          path: global-generation.txt
          if-no-files-found: warn

      - name: Commit repaired academic source and deterministic public site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          rm -f global-generation.txt
          git add -A
          if git diff --cached --quiet; then
            echo "U4 y el sitio público ya están sincronizados."
            exit 0
          fi
          git commit -m "Repair and synchronize Economía y Gestión U4"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
