name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Bootstrap canonical Biomecanica
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d data/courses/biomecanica ]]; then
            python scripts/migrate_course_to_canonical.py --subject biomecanica --course-code BIOMEC
          fi

      - name: Audit canonical structure and strict content
        shell: bash
        run: |
          set +e
          python scripts/validate_academic_courses.py 2>&1 | tee biomecanica-structure.txt
          structure_code=${PIPESTATUS[0]}
          python scripts/validate_academic_courses.py --strict-content 2>&1 | tee biomecanica-strict-content.txt
          strict_code=${PIPESTATUS[0]}
          echo "structure_exit=${structure_code}"
          echo "strict_content_exit=${strict_code}"
          exit 0

      - name: Commit bootstrap and restore workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          git rm --ignore-unmatch .github/workflows/temp-biomecanica-canonical-bootstrap.yml
          rm -f biomecanica-structure.txt biomecanica-strict-content.txt
          git add -A -- data/courses/biomecanica .github/workflows
          if git diff --cached --quiet; then
            echo "No canonical bootstrap changes to commit."
            exit 0
          fi
          git commit -m "Bootstrap canonical Biomecanica corpus"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
