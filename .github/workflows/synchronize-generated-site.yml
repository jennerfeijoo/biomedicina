name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Preserve verified source relevance text for claims
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/curate_laboratorio_biomecanica_canonical_temp.py')
          text = path.read_text(encoding='utf-8')
          old_selected = '    selected = unit["source_ids"][:8]\n'
          new_selected = '    selected = [sid for sid in unit["source_ids"] if len(str(source_map[sid].get("description") or source_map[sid].get("why_relevant") or "").split()) >= 6][:8]\n'
          old_text = '        text = str(src.get("description") or "").strip()\n'
          new_text = '        text = str(src.get("description") or src.get("why_relevant") or "").strip()\n'
          if old_selected not in text:
              raise SystemExit('claim selection pattern not found')
          if old_text not in text:
              raise SystemExit('claim text pattern not found')
          text = text.replace(old_selected, new_selected, 1)
          text = text.replace(old_text, new_text, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build canonical Laboratorio de Biomecanica closure
        run: python scripts/curate_laboratorio_biomecanica_canonical_temp.py

      - name: Validate canonical and structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_academic_courses.py
          python -m unittest tests.test_laboratorio_biomecanica_canonical_course -v
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_generic_content.py
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt
          python scripts/sync_catalog_statuses.py

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Restore workflow and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          rm -f .github/workflows/curate-laboratorio-biomecanica-canonical-temp.yml
          rm -f scripts/curate_laboratorio_biomecanica_canonical_temp.py
          rm -f global-generation.txt

      - name: Commit canonical closure and synchronized public site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Close Laboratorio de Biomecánica canonical course"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
