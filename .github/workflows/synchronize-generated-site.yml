name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build canonical Aplicaciones de Salud Digital corpus
        shell: bash
        run: |
          set -euo pipefail
          python scripts/migrate_course_to_canonical.py \
            --subject aplicaciones-salud-digital \
            --course-code ASDIG
          python scripts/curate_aplicaciones_salud_digital_course_temp.py

      - name: Validate structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/validate_academic_courses.py
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aplicaciones-salud-digital-canonical-closure
          path: global-generation.txt
          if-no-files-found: warn

      - name: Self-clean one-shot curator and commit canonical closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          rm -f scripts/curate_aplicaciones_salud_digital_course_temp.py global-generation.txt
          git add -A -- \
            data/courses/aplicaciones-salud-digital \
            data/generated_courses/aplicaciones-salud-digital.json \
            data/generated_units/aplicaciones-salud-digital \
            data/subjects/ingenieria-biomedica/aplicaciones-salud-digital.json \
            data/source_registry/aplicaciones-salud-digital.json \
            data/claim_registry/aplicaciones-salud-digital.json \
            ingenieria-biomedica/aplicaciones-salud-digital \
            ingenieria-biomedica/index.html \
            catalogo/index.html \
            .github/workflows/synchronize-generated-site.yml \
            scripts/curate_aplicaciones_salud_digital_course_temp.py
          if git diff --cached --quiet; then
            echo "No hay cambios de cierre canónico."
            exit 0
          fi
          git commit -m "Build canonical Aplicaciones de Salud Digital course"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
