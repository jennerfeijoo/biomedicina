name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Curate canonical Biomecanica closure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/curate_biomecanica_canonical_temp.py
          python scripts/validate_academic_courses.py --course biomecanica --strict-content
          python -m unittest tests.test_biomecanica_canonical_course
          python scripts/validate_generated_units.py
          python scripts/validate_curriculum.py
          python scripts/audit_curriculum_completeness.py

      - name: Regenerate public site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Restore temporary files and commit closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          rm -f scripts/curate_biomecanica_canonical_temp.py global-generation.txt
          git add -A -- \
            .github/workflows/synchronize-generated-site.yml \
            scripts/curate_biomecanica_canonical_temp.py \
            data/courses/biomecanica \
            tests/test_biomecanica_canonical_course.py \
            ingenieria-biomedica/biomecanica \
            catalogo \
            ingenieria-biomedica/index.html
          if git diff --cached --quiet; then
            echo "No hay cambios que confirmar."
            exit 0
          fi
          git commit -m "Complete canonical Biomecanica course"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
