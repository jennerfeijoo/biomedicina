name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Curate Ética de investigación U2 and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/curate_etica_u2_temp.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          fixed = False
          for i, line in enumerate(lines):
              if '"topic": "Transparencia científica"' in line:
                  if i + 1 < len(lines) and lines[i + 1].strip() == '}':
                      del lines[i + 1]
                      fixed = True
                  break
          if not fixed:
              raise SystemExit('Expected stray brace after Transparencia científica was not found')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python -m py_compile scripts/curate_etica_u2_temp.py
          python scripts/curate_etica_u2_temp.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          rm -f scripts/curate_etica_u2_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            data/course_redevelopment/etica-responsabilidad-social/units/unit-02.json \
            data/generated_units/etica-responsabilidad-social/unit-02.json \
            scripts/curate_etica_u2_temp.py \
            .github/workflows/synchronize-generated-site.yml
          git commit -m "Curate Ética y Responsabilidad Social U2"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Validate structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-site-synchronization
          path: global-generation.txt
          if-no-files-found: warn

      - name: Commit deterministic public site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            ciencias-basicas \
            biologicas-medicas \
            ingenieria-biomedica \
            gestion-etica-comunicacion \
            catalogo
          if git diff --cached --quiet; then
            echo "El sitio público ya está sincronizado con sus fuentes estructuradas."
            exit 0
          fi
          git commit -m "Synchronize generated public site"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
