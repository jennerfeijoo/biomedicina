name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Repair Desarrollo Dispositivos U6 JSON
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('data/course_redevelopment/desarrollo-dispositivos-medicos/units/unit-06.json'),
              Path('data/generated_units/desarrollo-dispositivos-medicos/unit-06.json'),
          ]
          needle = 'autoridades competentes."\n  ],'
          replacement = 'autoridades competentes."}\n  ],'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if needle in text:
                  text = text.replace(needle, replacement, 1)
                  path.write_text(text, encoding='utf-8')
              json.loads(path.read_text(encoding='utf-8'))

          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit('Redevelopment source and generated mirror differ after repair')
          PY
          python -m unittest tests.test_desarrollo_dispositivos_medicos_unit_06_curated

      - name: Validate structured academic sources
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_curriculum_completeness.py
          python scripts/validate_pilot_foundations.py
          if [[ -f data/course_migrations/bioinstrumentacion-public-canonical-v1.json ]]; then
            python scripts/preflight_bioinstrumentation_atomic_migration.py
            python scripts/validate_bioinstrumentation_public_canonical.py
          fi

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-site-synchronization
          path: global-generation.txt
          if-no-files-found: warn

      - name: Commit repaired structured data and deterministic public site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          git rm -f .github/workflows/fix-desarrollo-dispositivos-u6-json-temp.yml
          git add -A -- \
            .github/workflows/synchronize-generated-site.yml \
            data/course_redevelopment/desarrollo-dispositivos-medicos/units/unit-06.json \
            data/generated_units/desarrollo-dispositivos-medicos/unit-06.json \
            ciencias-basicas \
            biologicas-medicas \
            ingenieria-biomedica \
            gestion-etica-comunicacion \
            catalogo
          if git diff --cached --quiet; then
            echo "La reparación y el sitio público ya están sincronizados."
            exit 0
          fi
          git commit -m "Fix and synchronize Desarrollo Dispositivos U6"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
