name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Bootstrap Biomecanica canonical corpus
        shell: bash
        run: |
          set -euo pipefail
          python scripts/migrate_course_to_canonical.py \
            --subject biomecanica \
            --course-code BIOMEC
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/courses/biomecanica/units/unit-06.json')
          unit = json.loads(path.read_text(encoding='utf-8'))
          mapped = unit.setdefault('course_learning_outcome_ids', [])
          if 'BIOMEC-LO07' not in mapped:
              mapped.append('BIOMEC-LO07')
          path.write_text(json.dumps(unit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python scripts/validate_academic_courses.py --course biomecanica
          python scripts/validate_generated_units.py
          python scripts/validate_curriculum.py
          python scripts/audit_curriculum_completeness.py

      - name: Regenerate site from canonical source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Restore workflow and commit bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          git add -A -- \
            .github/workflows/synchronize-generated-site.yml \
            data/courses/biomecanica \
            ciencias-basicas \
            biologicas-medicas \
            ingenieria-biomedica \
            gestion-etica-comunicacion \
            catalogo
          if git diff --cached --quiet; then
            echo "No hay cambios que confirmar."
            exit 0
          fi
          git commit -m "Bootstrap canonical Biomecanica course"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
