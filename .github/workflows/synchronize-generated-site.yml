name: Synchronize generated site

on:
  pull_request:
    paths:
      - 'data/**'
      - 'docs/**'
      - 'scripts/**'
      - 'templates/**'
      - 'tests/**'
      - '.github/workflows/synchronize-generated-site.yml'

permissions:
  contents: write

concurrency:
  group: synchronize-generated-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Curate Biofotonica U1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/curate_biofotonica_u1_temp.py
          python scripts/patch_biofotonica_u1_temp.py
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_curriculum_completeness.py
          python -m unittest tests.test_biofotonica_unit_01_curated

      - name: Regenerate site deterministically
        shell: bash
        run: |
          set -o pipefail
          python scripts/generate_site.py --force --with-units 2>&1 | tee global-generation.txt

      - name: Validate regenerated site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py
          python -m unittest tests.test_biofotonica_unit_01_curated

      - name: Upload synchronization diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generated-site-synchronization
          path: global-generation.txt
          if-no-files-found: warn

      - name: Commit curated unit and public site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          rm -f scripts/curate_biofotonica_u1_temp.py
          rm -f scripts/patch_biofotonica_u1_temp.py
          rm -f global-generation.txt
          git add -A
          if git diff --cached --quiet; then
            echo "Biofotónica U1 ya está sincronizada."
            exit 0
          fi
          git commit -m "Curate Biofotonica U1 tissue optics"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
