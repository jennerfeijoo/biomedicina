name: Bioinstrumentation U5 Final Authoral Audit

on:
  pull_request:
    paths:
      - "data/final_authoral_audits/bioinstrumentacion-unit-05.json"
      - "data/course_redevelopment/bioinstrumentacion/units/unit-05.json"
      - "docs/pilots/bioinstrumentacion/unit-05/FINAL_AUTHORAL_AUDIT.md"
      - "scripts/validate_bioinstrumentation_u5_final_audit.py"
      - ".github/workflows/bioinstrumentation-u5-final-audit.yml"
  push:
    branches: [main]
    paths:
      - "data/final_authoral_audits/bioinstrumentacion-unit-05.json"
      - "data/course_redevelopment/bioinstrumentacion/units/unit-05.json"
      - "docs/pilots/bioinstrumentacion/unit-05/FINAL_AUTHORAL_AUDIT.md"
      - "scripts/validate_bioinstrumentation_u5_final_audit.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/validate_bioinstrumentation_u5_final_audit.py
