name: Fix Imagenes U4 glossary duplicate

on:
  push:
    branches:
      - codex/imagenes-avanzadas-i-u4-nuclear-cuantitativa

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/imagenes-avanzadas-i-u4-nuclear-cuantitativa
          fetch-depth: 0
      - name: Rename duplicated DICOM glossary term
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('data/course_redevelopment/imagenes-biomedicas-avanzadas-i/units/unit-04.json'),
              Path('data/generated_units/imagenes-biomedicas-avanzadas-i/unit-04.json'),
          ]
          old = '"term":"Decay Correction"'
          new = '"term":"Decay Correction (atributo DICOM)"'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              assert text.count(old) == 1, (path, text.count(old))
              text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              data = json.loads(text)
              terms = [item['term'].strip().casefold() for item in data['glossary']]
              assert len(terms) == len(set(terms)), path
          assert paths[0].read_bytes() == paths[1].read_bytes()
          PY
      - name: Remove ephemeral workflow and commit fix
        run: |
          rm .github/workflows/fix-imagenes-u4-glossary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/course_redevelopment/imagenes-biomedicas-avanzadas-i/units/unit-04.json \
                  data/generated_units/imagenes-biomedicas-avanzadas-i/unit-04.json \
                  .github/workflows/fix-imagenes-u4-glossary.yml
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Corrige duplicado de glosario en Imagen Nuclear U4"
          git push origin HEAD:codex/imagenes-avanzadas-i-u4-nuclear-cuantitativa
