name: Build prerequisite map

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/prerequisite-graph' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Synchronize generated navigation
        run: python scripts/patch_prerequisite_navigation.py

      - name: Validate graph and JavaScript
        run: |
          python scripts/validate_prerequisite_graph.py
          node --check assets/js/prerequisite-map.js

      - name: Commit generated change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogo/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Synchronize prerequisite map navigation"
          git push origin HEAD:${{ github.head_ref }}
