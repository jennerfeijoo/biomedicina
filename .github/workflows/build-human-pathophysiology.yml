name: Build complete Human Pathophysiology

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/complete-human-pathophysiology' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout course branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record package fragment hashes
        run: sha256sum migration/fph_package.part00 migration/fph_package.part01 migration/fph_package.part02a migration/fph_package.part02b migration/fph_package.part03 migration/fph_package.part04a migration/fph_package.part04b migration/fph_package.part05 > fragment-hashes.txt

      - name: Upload package hash report
        uses: actions/upload-artifact@v4
        with:
          name: human-pathophysiology-package-hashes
          path: fragment-hashes.txt

      - name: Reconstruct validated academic package
        run: |
          echo 'b5d67819afaf3b1ba4448b5342923e0b2613392378a773477fc33e123981ff26  migration/fph_package.part00' | sha256sum --check
          echo '6ae5b99bda31aed9308cfe150fc17eb8d92e4dc03f8641f8454fdaf8cb56bcbf  migration/fph_package.part01' | sha256sum --check
          echo '8075bf32fbb2b5ca889786590b098483cc5d816c326b73113613c6960e1cc788  migration/fph_package.part02a' | sha256sum --check
          echo '820a99866f69c8e8afccb39dc774e696f3529a03d7426f28a035651be23d53f8  migration/fph_package.part02b' | sha256sum --check
          echo '12e7198df2d595a4b443abaeb833f211ca5694126e14b4b96db5b5e1565956b2  migration/fph_package.part03' | sha256sum --check
          echo 'eb07ee806efb75e82d91cda32984357739396c84a0db57da34b544e8bf6ffb10  migration/fph_package.part04a' | sha256sum --check
          echo 'f6ed0047c45afa83cfe7339649ba873ff0cedc90f4cbc9e462d051d119040575  migration/fph_package.part04b' | sha256sum --check
          echo 'b8b7dfd2a720a176f7587c0bae6526e25a45ac6da92da13074c91aae3c0247dd  migration/fph_package.part05' | sha256sum --check
          cat migration/fph_package.part00 \
              migration/fph_package.part01 \
              migration/fph_package.part02a \
              migration/fph_package.part02b \
              migration/fph_package.part03 \
              migration/fph_package.part04a \
              migration/fph_package.part04b \
              migration/fph_package.part05 > /tmp/fph-package.b64
          echo 'adba1928b548d5ee0ead0d433d1704ee3fdc9147eb3a6df70c5222ae27052bff  /tmp/fph-package.b64' | sha256sum --check
          base64 --decode /tmp/fph-package.b64 > /tmp/fph-package.tar.gz
          echo 'ac7b6f4db99550182da94cca13fe55b70fd71125e0c92c5296b9b74ad68f47e2  /tmp/fph-package.tar.gz' | sha256sum --check
          tar -xzf /tmp/fph-package.tar.gz

      - name: Validate structured course content
        run: |
          python scripts/validate_generated_units.py
          python scripts/audit_curriculum_completeness.py --strict
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          subject = 'fisiopatologia-humana'
          course = json.loads((root / 'data/generated_courses' / f'{subject}.json').read_text(encoding='utf-8'))
          assert course['schema_version'] == '2.0'
          assert course['subject_id'] == subject
          assert course['status'] == 'review'
          assert len(course['learning_outcomes']) >= 8
          assert sum(item['weight_percent'] for item in course['assessment_plan']) == 100
          assert sum(item['weight_percent'] for item in course['final_project']['rubric']) == 100
          assert course['final_project']['rubric']
          for number in range(1, 7):
              path = root / 'data/generated_units' / subject / f'unit-{number:02d}.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data['schema_version'] == '2.0'
              assert data['subject_id'] == subject
              assert data['unit'] == number
              assert data['status'] == 'review'
          coverage = json.loads((root / 'data/curriculum_coverage' / f'{subject}.json').read_text(encoding='utf-8'))
          assert coverage['courses'][subject]['coverage_state'] == 'implemented'
          assert len(coverage['courses'][subject]['core_domains']) == 6
          print('Programa, seis unidades y matriz de Fisiopatología Humana: OK')
          PY

      - name: Regenerate public course and units
        run: |
          python scripts/generate_site.py --force --with-units
          python scripts/enrich_generated_pages.py
          python scripts/enrich_authored_unit_pages.py

      - name: Validate academic portfolio and public output
        run: |
          python scripts/audit_course_portfolio.py --strict
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_units.py
          python scripts/validate_links.py
          python scripts/audit_course_completion.py --json-output /tmp/course-completion.json
          python - <<'PY'
          import json
          from pathlib import Path

          subject = 'fisiopatologia-humana'
          unit_dir = Path('biologicas-medicas') / subject / 'unidades'
          for number in range(1, 7):
              page = (unit_dir / f'unidad-{number:02d}.html').read_text(encoding='utf-8')
              assert '<!-- advanced-unit-renderer:v1 -->' in page
              assert 'advanced-theory-section' in page
              assert 'answer-panel' in page
          index = (unit_dir / 'index.html').read_text(encoding='utf-8')
          assert all(f'unidad-{number:02d}.html' in index for number in range(1, 7))
          report = json.loads(Path('/tmp/course-completion.json').read_text(encoding='utf-8'))
          row = next(item for item in report['courses'] if item['subject_id'] == subject)
          assert row['fully_developed'] is True
          assert row['advanced_units'] == 6
          assert row['fallback_units'] == 0
          assert row['missing_units'] == 0
          print('Salida pública completa de Fisiopatología Humana: OK')
          PY

      - name: Commit completed course
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated_courses/fisiopatologia-humana.json \
            data/generated_units/fisiopatologia-humana \
            data/curriculum_coverage/fisiopatologia-humana.json \
            biologicas-medicas/fisiopatologia-humana \
            biologicas-medicas/index.html catalogo/index.html
          if git diff --cached --quiet; then
            echo "Fisiopatología Humana ya está sincronizada"
            exit 0
          fi
          git commit -m "Complete Human Pathophysiology course and six advanced units"
          git push origin HEAD:${{ github.head_ref }}
