name: Fix Ingenieria Datos U4 JSON temp

on:
  push:
    branches:
      - codex/ingenieria-datos-biomedicos-u4-calidad-procedencia

permissions:
  contents: write

jobs:
  fix-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: codex/ingenieria-datos-biomedicos-u4-calidad-procedencia
          fetch-depth: 0

      - name: Repair JSON escaping and validate exact mirror
        shell: bash
        run: |
          python - <<'PY'
          import json
          import string
          from pathlib import Path

          source = Path('data/course_redevelopment/ingenieria-datos-biomedicos/units/unit-04.json')
          mirror = Path('data/generated_units/ingenieria-datos-biomedicos/unit-04.json')
          text = source.read_text(encoding='utf-8')
          assert text == mirror.read_text(encoding='utf-8')

          hexdigits = set(string.hexdigits)
          out = []
          i = 0
          repairs = 0
          while i < len(text):
              ch = text[i]
              if ch != '\\':
                  out.append(ch)
                  i += 1
                  continue
              if i + 1 >= len(text):
                  out.append('\\\\')
                  repairs += 1
                  i += 1
                  continue
              nxt = text[i + 1]
              if nxt in {'\\', '"', '/'}:
                  out.append(text[i:i+2])
                  i += 2
                  continue
              if nxt == 'u' and i + 5 < len(text) and all(c in hexdigits for c in text[i+2:i+6]):
                  out.append(text[i:i+6])
                  i += 6
                  continue
              out.append('\\\\' + nxt)
              repairs += 1
              i += 2

          fixed = ''.join(out)
          parsed = json.loads(fixed)
          assert parsed['subject_id'] == 'ingenieria-datos-biomedicos'
          assert parsed['unit'] == 4
          assert parsed['slug'] == 'calidad-y-procedencia'
          assert 'Concepto de la unidad que debe definirse mediante entidades observables' not in fixed
          assert 'PPV=' not in fixed
          source.write_text(fixed, encoding='utf-8')
          mirror.write_text(fixed, encoding='utf-8')
          assert source.read_bytes() == mirror.read_bytes()
          print('Escapes JSON reparados:', repairs)
          PY

      - name: Validate U4 before commit
        shell: bash
        run: |
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python -m unittest tests.test_ingenieria_datos_biomedicos_unit_04_curated

      - name: Remove temporary repair workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-ingenieria-datos-u4-json-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Corregir serialización JSON de Ingeniería de Datos U4"
          git push origin HEAD:codex/ingenieria-datos-biomedicos-u4-calidad-procedencia
