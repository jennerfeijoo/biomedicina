name: Apply legacy activity pedagogy

on:
  push:
    branches:
      - pedagogy-legacy-units

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: pedagogy-legacy-units
          fetch-depth: 0

      - name: Apply legacy activity pedagogy
        run: python scripts/apply_legacy_activity_pedagogy_patch.py

      - name: Check JavaScript syntax
        run: node --check assets/js/generated-units.js

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated units
        run: python scripts/validate_generated_units.py

      - name: Validate links
        run: python scripts/validate_links.py --quiet

      - name: Remove temporary patch machinery
        run: |
          git rm scripts/apply_legacy_activity_pedagogy_patch.py
          git rm .github/workflows/apply-legacy-activity-pedagogy.yml

      - name: Commit final frontend change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/generated-units.js
          git commit -m "Extiende la pedagogía a las unidades heredadas"
          git push origin HEAD:pedagogy-legacy-units
