name: Bioinstrumentation U2 Human Execution Packet

on:
  pull_request:
    paths:
      - 'data/review_packets/bioinstrumentacion-unit-02-human-execution.json'
      - 'data/review_protocols/bioinstrumentacion-unit-02-human-review.json'
      - 'data/review_templates/bioinstrumentacion/unit-02/**'
      - 'scripts/validate_bioinstrumentation_u2_human_execution_packet.py'
      - '.github/workflows/bioinstrumentation-u2-human-execution-packet.yml'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/validate_bioinstrumentation_u2_human_execution_packet.py
