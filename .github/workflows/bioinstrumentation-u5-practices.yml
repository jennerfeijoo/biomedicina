name: Bioinstrumentation U5 Practices

on:
  pull_request:
    paths:
      - 'data/practice_implementations/bioinstrumentacion-unit-05.json'
      - 'data/unit_preparation/bioinstrumentacion-unit-05-blocker-resolution.json'
      - 'docs/pilots/bioinstrumentacion/unit-05/PRACTICES.md'
      - 'scripts/validate_bioinstrumentation_u5_practices.py'
      - '.github/workflows/bioinstrumentation-u5-practices.yml'
  push:
    branches: [main]
    paths:
      - 'data/practice_implementations/bioinstrumentacion-unit-05.json'
      - 'data/unit_preparation/bioinstrumentacion-unit-05-blocker-resolution.json'
      - 'docs/pilots/bioinstrumentacion/unit-05/PRACTICES.md'
      - 'scripts/validate_bioinstrumentation_u5_practices.py'
      - '.github/workflows/bioinstrumentation-u5-practices.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate_bioinstrumentation_u5_practices.py
