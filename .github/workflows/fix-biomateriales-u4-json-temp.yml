name: Temporary Biomateriales U4 JSON repair

on:
  push:
    branches:
      - codex/biomateriales-unit-04-academic-quality-current

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/biomateriales-unit-04-academic-quality-current
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Repair JSON and regression
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('data/course_redevelopment/biomateriales/units/unit-04.json')
          mirror = Path('data/generated_units/biomateriales/unit-04.json')
          test = Path('tests/test_biomateriales_unit_04_curated.py')

          text = source.read_text(encoding='utf-8')
          broken = r'"latex": "f_{rec}=\\frac{m_{productos\ recuperados}}{m_{perdida\ del\ especimen}}"'
          fixed = r'"latex": "f_{rec}=\\frac{m_{recuperada}}{m_{perdida}}"'
          if broken not in text:
              raise SystemExit('Expected malformed recovery equation was not found')
          text = text.replace(broken, fixed, 1)
          json.loads(text)
          source.write_text(text, encoding='utf-8')
          mirror.write_text(text, encoding='utf-8')

          test_text = test.read_text(encoding='utf-8')
          old_test = r'r"f_{rec}=\\frac{m_{productos\\ recuperados}}{m_{perdida\\ del\\ especimen}}"'
          new_test = r'r"f_{rec}=\\frac{m_{recuperada}}{m_{perdida}}"'
          if old_test not in test_text:
              raise SystemExit('Expected regression equation was not found')
          test.write_text(test_text.replace(old_test, new_test, 1), encoding='utf-8')
          PY
      - name: Validate repaired unit
        run: |
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python -m unittest tests.test_biomateriales_unit_04_curated
      - name: Remove temporary workflow and commit repair
        shell: bash
        run: |
          rm .github/workflows/fix-biomateriales-u4-json-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/course_redevelopment/biomateriales/units/unit-04.json data/generated_units/biomateriales/unit-04.json tests/test_biomateriales_unit_04_curated.py .github/workflows/fix-biomateriales-u4-json-temp.yml
          git commit -m "Fix Biomateriales U4 JSON recovery equation"
          git push origin HEAD:codex/biomateriales-unit-04-academic-quality-current
