name: Materialize Interfaces U1
on:
  push:
    branches:
      - codex/interfaces-hombre-maquina-u1-factores-humanos
    paths:
      - .github/workflows/materialize-interfaces-u1.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/interfaces-hombre-maquina-u1-factores-humanos
          fetch-depth: 0
      - name: Decode and validate curated unit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/interfaces-u1
          cat .tmp/interfaces_u1/part*.b64 | tr -d '\n' | base64 -d > /tmp/interfaces-u1/payload.tar.gz
          echo 'b338db1e734b0571664b06d1af3a9496e6c512e9cc581bdfe442e04f18c018e9  /tmp/interfaces-u1/payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/interfaces-u1/payload.tar.gz -C /tmp/interfaces-u1
          python -m json.tool /tmp/interfaces-u1/unit.json >/dev/null
          mkdir -p data/course_redevelopment/interfaces-hombre-maquina/units data/generated_units/interfaces-hombre-maquina tests
          cp /tmp/interfaces-u1/unit.json data/course_redevelopment/interfaces-hombre-maquina/units/unit-01.json
          cp /tmp/interfaces-u1/unit.json data/generated_units/interfaces-hombre-maquina/unit-01.json
          cp /tmp/interfaces-u1/test.py tests/test_interfaces_hombre_maquina_unit_01_curated.py
          cmp data/course_redevelopment/interfaces-hombre-maquina/units/unit-01.json data/generated_units/interfaces-hombre-maquina/unit-01.json
      - name: Commit clean canonical change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -rf .tmp/interfaces_u1
          git rm .github/workflows/materialize-interfaces-u1.yml
          git add data/course_redevelopment/interfaces-hombre-maquina/units/unit-01.json data/generated_units/interfaces-hombre-maquina/unit-01.json tests/test_interfaces_hombre_maquina_unit_01_curated.py
          git commit -m 'Curación académica de Interfaces Hombre-Máquina U1'
          git push
