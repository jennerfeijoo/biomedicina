name: Materialize Analysis Instrumental source

on:
  push:
    branches:
      - agent/rebuild-analisis-instrumental
    paths:
      - '.github/workflows/materialize-analisis-instrumental.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct and validate source package
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import json
          from pathlib import Path

          parts = sorted(Path('.github/materialize/analisis-instrumental').glob('part-*.txt'))
          if len(parts) != 8:
              raise SystemExit(f'Expected 8 payload parts, found {len(parts)}')
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          package = json.loads(gzip.decompress(base64.b64decode(payload)).decode('utf-8'))
          if len(package) != 15:
              raise SystemExit(f'Expected 15 source files, found {len(package)}')
          required_prefixes = (
              'data/course_redevelopment/analisis-instrumental/',
              'data/curriculum_coverage/analisis-instrumental-2026.json',
              'data/curriculum_decisions/analisis-instrumental.json',
              'data/source_registry/analisis-instrumental.json',
          )
          for relative_path, content in package.items():
              if not relative_path.startswith(required_prefixes):
                  raise SystemExit(f'Unexpected package path: {relative_path}')
              path = Path(relative_path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
              if path.suffix == '.json':
                  json.loads(content)
          print('Materialized and validated 15 Analysis Instrumental source files.')
          PY
      - name: Commit source package
        shell: bash
        run: |
          git add data/course_redevelopment/analisis-instrumental \
                  data/curriculum_coverage/analisis-instrumental-2026.json \
                  data/curriculum_decisions/analisis-instrumental.json \
                  data/source_registry/analisis-instrumental.json
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add Análisis Instrumental source package'
          git push origin HEAD:${GITHUB_REF_NAME}
