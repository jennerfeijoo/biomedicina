name: Bioinstrumentation U6 Scientific Editorial Audit

on:
  pull_request:
    paths:
      - "data/editorial_audits/bioinstrumentacion-unit-06.json"
      - "data/unit_preparation/bioinstrumentacion-unit-06*.json"
      - "data/practice_implementations/bioinstrumentacion-unit-06.json"
      - "data/assessment_authorizations/bioinstrumentacion-unit-06.json"
      - "data/assessment_implementations/bioinstrumentacion-unit-06.json"
      - "docs/pilots/bioinstrumentacion/unit-06/**"
      - "scripts/validate_bioinstrumentation_u6_audit.py"
      - ".github/workflows/bioinstrumentation-u6-audit.yml"
  push:
    branches: [main]
    paths:
      - "data/editorial_audits/bioinstrumentacion-unit-06.json"
      - "scripts/validate_bioinstrumentation_u6_audit.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/validate_bioinstrumentation_u6_audit.py
