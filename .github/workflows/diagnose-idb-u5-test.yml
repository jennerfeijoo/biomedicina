name: Diagnose IDB U5 regression

on:
  push:
    branches:
      - codex/ingenieria-datos-biomedicos-u5-orquestacion-observabilidad
    paths:
      - .github/workflows/diagnose-idb-u5-test.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run U5 regression only
        run: python -m unittest tests.test_ingenieria_datos_biomedicos_unit_05_curated -v
