name: Materialize Innovacion U4 v2

on:
  push:
    branches:
      - codex/innovacion-emprendimiento-u4-modelo-negocio-acceso-v2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/innovacion-emprendimiento-u4-modelo-negocio-acceso-v2
          fetch-depth: 0
      - name: Reconstruct verify and materialize U4
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/u4_clean/chunk01.b64 .tmp/u4_clean/chunk02.b64 .tmp/u4_clean/chunk03.b64 .tmp/u4_clean/chunk04.b64 .tmp/u4_clean/chunk05a.b64 .tmp/u4_clean/chunk05b.b64 .tmp/u4_clean/chunk05c.b64 > /tmp/u4.b64
          base64 -d /tmp/u4.b64 | gzip -dc > /tmp/unit-04.json
          echo '8db857f22d28a8395dc3efe3272ebfec97a3a2e21fec8af4e12a668c0a2e93e7  /tmp/unit-04.json' | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/unit-04.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['schema_version'] == '2.0'
          assert d['subject_id'] == 'innovacion-emprendimiento'
          assert d['unit'] == 4
          assert d['title'] == 'Modelo de negocio y acceso'
          assert d['status'] == 'review'
          assert len(d['learning_objectives']) == 6
          assert len(d['theory_sections']) == 5
          assert all(len(s['paragraphs']) >= 5 and len(s['key_points']) >= 5 for s in d['theory_sections'])
          assert len(d['glossary']) >= 40
          assert len(d['worked_examples']) >= 5
          assert len(d['guided_activities']) == 1
          assert len(d['guided_activities'][0]['problems']) >= 20
          assert len(d['common_errors']) >= 18
          assert len(d['self_assessment']) >= 12
          assert len(d['biomedical_connections']) >= 6
          assert len(d['sources']) >= 15
          assert all(s.get('verification_status') == 'verified_directly' for s in d['sources'])
          text = json.dumps(d, ensure_ascii=False).casefold()
          assert 'concepto de la unidad que debe definirse mediante entidades observables' not in text
          assert 'modelo multicriterio transparente para comparar alternativas' not in text
          PY
          cp /tmp/unit-04.json data/course_redevelopment/innovacion-emprendimiento/units/unit-04.json
          cp /tmp/unit-04.json data/generated_units/innovacion-emprendimiento/unit-04.json
          cmp data/course_redevelopment/innovacion-emprendimiento/units/unit-04.json data/generated_units/innovacion-emprendimiento/unit-04.json
          python -m unittest tests.test_innovacion_emprendimiento_unit_04_curated
      - name: Remove transfer scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/u4_clean
          rm -f .github/workflows/materialize-innovacion-u4-v2.yml
      - name: Commit canonical U4
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'JennerFeijoo'
          git config user.email '65651751+jennerfeijoo@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Curación académica de Innovación y Emprendimiento U4'
          git push origin HEAD:codex/innovacion-emprendimiento-u4-modelo-negocio-acceso-v2
