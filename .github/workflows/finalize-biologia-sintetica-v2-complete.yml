name: Finalize Synthetic Biology v2 complete

on:
  pull_request:
    paths:
      - '.github/workflows/finalize-biologia-sintetica-v2-complete.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-biologia-sintetica-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize Synthetic Biology package
        run: python scripts/materialize_biologia_sintetica_v2.py

      - name: Complete formal architecture debt
        run: python scripts/patch_formal_course_readiness.py

      - name: Publish reconstructed courses
        run: |
          python scripts/publish_courses.py \
            --subject biologia-sintetica \
            --subject biologia-desarrollo \
            --subject ecuaciones-diferenciales \
            --manifest publication-manifest.json

      - name: Generate public courses and indexes
        run: |
          python scripts/generate_site.py --force --subject biologia-sintetica --with-units --force-authored-units
          python scripts/generate_site.py --force --subject biologia-desarrollo --with-units --force-authored-units
          python scripts/generate_site.py --force --subject ecuaciones-diferenciales --with-units --force-authored-units
          python scripts/generate_public_indexes.py --manifest publication-manifest.json

      - name: Validate self-paced model
        run: python scripts/validate_self_paced_model.py

      - name: Validate advanced units
        run: python scripts/validate_generated_units.py

      - name: Audit course readiness
        run: python scripts/audit_course_readiness.py --strict

      - name: Audit course portfolio
        run: python scripts/audit_course_portfolio.py --strict

      - name: Audit course redundancy
        run: python scripts/audit_course_redundancy.py --strict

      - name: Audit curriculum completeness
        run: python scripts/audit_curriculum_completeness.py --strict

      - name: Audit curriculum expansions
        run: python scripts/audit_curriculum_expansions.py --strict

      - name: Audit public alignment
        run: python scripts/audit_public_unit_alignment.py --strict

      - name: Validate links
        run: python scripts/validate_links.py

      - name: Verify public promotion
        run: |
          python scripts/publish_courses.py \
            --subject biologia-sintetica \
            --subject biologia-desarrollo \
            --subject ecuaciones-diferenciales \
            --check-public
          python scripts/generate_public_indexes.py --manifest publication-manifest.json --check

      - name: Refresh developed-course audit
        run: |
          python scripts/audit_developed_courses.py \
            --strict \
            --json-output data/course_audits/DEVELOPED_COURSES_AUDIT_2026-07-27.json \
            --markdown-output data/course_audits/DEVELOPED_COURSES_AUDIT_2026-07-27.md

      - name: Remove temporary materializers
        run: |
          git rm -r data/bootstrap/biologia-sintetica-v2
          git rm scripts/materialize_biologia_sintetica_v2.py
          git rm scripts/patch_formal_course_readiness.py
          git rm .github/workflows/materialize-biologia-sintetica-v2.yml
          git rm .github/workflows/materialize-biologia-sintetica-v2-pr.yml
          git rm .github/workflows/diagnose-biologia-sintetica-v2.yml
          git rm .github/workflows/finalize-biologia-sintetica-v2.yml
          git rm .github/workflows/diagnose-synbio-readiness.yml
          git rm .github/workflows/finalize-biologia-sintetica-v2-complete.yml
          rm -f publication-manifest.json readiness.log

      - name: Commit final reconstruction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconstruir Biología Sintética y completar arquitectura formal"
          git push origin HEAD:agent/rebuild-biologia-sintetica-v2
