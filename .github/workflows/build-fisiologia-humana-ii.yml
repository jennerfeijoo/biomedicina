name: Build complete Human Physiology II

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/complete-human-physiology-ii' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout course branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate structured content
        run: |
          python scripts/validate_generated_units.py
          python scripts/audit_curriculum_completeness.py --strict
          python - <<'PY'
          import json
          from pathlib import Path

          course = json.loads(Path('data/generated_courses/fisiologia-humana-ii.json').read_text(encoding='utf-8'))
          assert course['subject_id'] == 'fisiologia-humana-ii'
          assert len(course['learning_outcomes']) >= 8
          assert sum(item['weight_percent'] for item in course['assessment_plan']) == 100
          assert course['final_project']['rubric']
          for number in range(1, 7):
              path = Path(f'data/generated_units/fisiologia-humana-ii/unit-{number:02d}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data['schema_version'] == '2.0'
              assert data['unit'] == number
          print('Programa y seis unidades de Fisiología Humana II: OK')
          PY

      - name: Regenerate public course and units
        run: |
          python scripts/generate_site.py --force --with-units
          python scripts/enrich_generated_pages.py
          python scripts/enrich_authored_unit_pages.py

      - name: Validate public output
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_units.py
          python scripts/validate_links.py
          python scripts/audit_course_completion.py --json-output /tmp/course-completion.json
          python - <<'PY'
          import json
          from pathlib import Path

          unit_dir = Path('biologicas-medicas/fisiologia-humana-ii/unidades')
          for number in range(1, 7):
              page = (unit_dir / f'unidad-{number:02d}.html').read_text(encoding='utf-8')
              assert '<!-- advanced-unit-renderer:v1 -->' in page
              assert 'advanced-theory-section' in page
              assert 'answer-panel' in page
          index = (unit_dir / 'index.html').read_text(encoding='utf-8')
          assert all(f'unidad-{number:02d}.html' in index for number in range(1, 7))
          report = json.loads(Path('/tmp/course-completion.json').read_text(encoding='utf-8'))
          row = next(item for item in report['courses'] if item['subject_id'] == 'fisiologia-humana-ii')
          assert row['fully_developed'] is True
          assert row['advanced_units'] == 6
          assert row['fallback_units'] == 0
          print('Salida pública completa de Fisiología Humana II: OK')
          PY

      - name: Commit completed course
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated_courses/fisiologia-humana-ii.json \
            data/generated_units/fisiologia-humana-ii \
            data/curriculum_coverage/fisiologia-humana-ii.json \
            biologicas-medicas/fisiologia-humana-ii \
            biologicas-medicas/index.html catalogo/index.html
          if git diff --cached --quiet; then
            echo "Fisiología Humana II ya está sincronizada"
            exit 0
          fi
          git commit -m "Complete Human Physiology II course and six advanced units"
          git push origin HEAD:${{ github.head_ref }}
