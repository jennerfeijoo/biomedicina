name: Apply pedagogy patch

on:
  push:
    branches:
      - pedagogy-guided-activities

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: pedagogy-guided-activities
          fetch-depth: 0

      - name: Apply pedagogical progressive enhancement
        run: python scripts/apply_pedagogy_patch.py

      - name: Check JavaScript syntax
        run: node --check assets/js/generated-units.js

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated units
        run: python scripts/validate_generated_units.py

      - name: Remove temporary patch machinery
        run: |
          git rm scripts/apply_pedagogy_patch.py
          git rm .github/workflows/apply-pedagogy-patch.yml

      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/generated-units.js assets/css/generated-units.css
          git commit -m "Mejora la pedagogía de las actividades guiadas"
          git push origin HEAD:pedagogy-guided-activities
