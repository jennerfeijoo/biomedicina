name: Regenerate premium homepage outputs

on:
  push:
    branches:
      - agent/premium-homepage-research-hub
    paths:
      - .github/workflows/regenerate-premium-homepage.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/premium-homepage-research-hub
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate static outputs
        run: python scripts/generate_site.py --force --with-units

      - name: Commit generated files
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerar catálogo con nueve rutas"
          git push origin HEAD:agent/premium-homepage-research-hub
