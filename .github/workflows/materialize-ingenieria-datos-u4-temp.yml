name: Materialize Ingenieria Datos U4 final

on:
  push:
    branches:
      - codex/ingenieria-datos-biomedicos-u4-calidad-procedencia

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ingenieria-datos-biomedicos-u4-calidad-procedencia
          fetch-depth: 0
      - name: Assemble validate and materialize U4
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          root = Path('.tmp/u4_payload')
          unit_parts = [root/'final-unit-01.b64', root/'final-unit-02.b64', root/'final-unit-03-04.b64', root/'final-unit-05-06.b64', root/'final-unit-07-08.b64']
          unit_b64 = ''.join(p.read_text(encoding='utf-8').strip() for p in unit_parts)
          test_b64 = (root/'final-test.b64').read_text(encoding='utf-8').strip()
          assert len(unit_b64) == 23484, len(unit_b64)
          assert len(test_b64) == 3320, len(test_b64)
          unit = zlib.decompress(base64.b64decode(unit_b64))
          test = zlib.decompress(base64.b64decode(test_b64))
          assert hashlib.sha256(unit).hexdigest() == '070d05f36a9f33eda00e4aa0ec351d35f3caac29c2144f6a8535c042bb157572'
          assert hashlib.sha256(test).hexdigest() == 'e9d08e2d3ce9435dacff8f4b088addf9449b4c9c83ff9e11fb113f6e4a3224e8'
          parsed = json.loads(unit.decode('utf-8'))
          assert parsed['subject_id'] == 'ingenieria-datos-biomedicos'
          assert parsed['unit'] == 4 and parsed['slug'] == 'calidad-y-procedencia'
          assert len(parsed['theory_sections']) >= 5 and len(parsed['glossary']) >= 50 and len(parsed['sources']) >= 14
          assert 'PPV=' not in unit.decode('utf-8')
          source = Path('data/course_redevelopment/ingenieria-datos-biomedicos/units/unit-04.json')
          mirror = Path('data/generated_units/ingenieria-datos-biomedicos/unit-04.json')
          regression = Path('tests/test_ingenieria_datos_biomedicos_unit_04_curated.py')
          source.write_bytes(unit); mirror.write_bytes(unit); regression.write_bytes(test)
          assert source.read_bytes() == mirror.read_bytes()
          print('U4 materializada:', len(unit), 'bytes; regresión:', len(test), 'bytes')
          PY
      - name: Remove temporary transfer infrastructure and commit functional U4
        shell: bash
        run: |
          rm -rf .tmp/u4_payload
          rm -f .github/workflows/materialize-ingenieria-datos-u4-temp.yml
          rm -f .github/workflows/trigger-ingenieria-datos-u4-materialization-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Materializar Ingeniería de Datos Biomédicos U4"
          git push origin HEAD:codex/ingenieria-datos-biomedicos-u4-calidad-procedencia
