name: Temporary assemble Ingeniería Neurosensorial U6

on:
  push:
    branches:
      - codex/ingenieria-neurosensorial-u6-validacion-neuroetica
    paths:
      - '.tmp/neuro-u6/**'
      - '.github/workflows/tmp-assemble-neurosensorial-u6.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/ingenieria-neurosensorial-u6-validacion-neuroetica
          fetch-depth: 0
      - name: Decode, validate and materialize U6
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .tmp/neuro-u6/u6.json.gz.b64 | gzip -dc > /tmp/unit-06.json
          test "$(wc -c < /tmp/unit-06.json)" -eq 50531
          python -m json.tool /tmp/unit-06.json >/dev/null
          cp /tmp/unit-06.json data/course_redevelopment/ingenieria-neurosensorial/units/unit-06.json
          cp /tmp/unit-06.json data/generated_units/ingenieria-neurosensorial/unit-06.json
          cmp data/course_redevelopment/ingenieria-neurosensorial/units/unit-06.json data/generated_units/ingenieria-neurosensorial/unit-06.json
          git rm -r .tmp/neuro-u6
          git rm .github/workflows/tmp-assemble-neurosensorial-u6.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/course_redevelopment/ingenieria-neurosensorial/units/unit-06.json data/generated_units/ingenieria-neurosensorial/unit-06.json
          git commit -m 'Materializar Ingeniería Neurosensorial U6'
          git push
