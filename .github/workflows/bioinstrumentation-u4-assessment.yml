name: Bioinstrumentation U4 Assessment

on:
  pull_request:
    paths:
      - 'data/assessment_implementations/bioinstrumentacion-unit-04.json'
      - 'data/assessment_authorizations/bioinstrumentacion-unit-04.json'
      - 'scripts/bioinstrumentation_u4_assessment_engine.py'
      - 'scripts/validate_bioinstrumentation_u4_assessment.py'
      - 'docs/pilots/bioinstrumentacion/unit-04/ASSESSMENT_IMPLEMENTATION.md'
      - '.github/workflows/bioinstrumentation-u4-assessment.yml'
  push:
    branches: [main]
    paths:
      - 'data/assessment_implementations/bioinstrumentacion-unit-04.json'
      - 'scripts/bioinstrumentation_u4_assessment_engine.py'
      - 'scripts/validate_bioinstrumentation_u4_assessment.py'
      - 'docs/pilots/bioinstrumentacion/unit-04/ASSESSMENT_IMPLEMENTATION.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/validate_bioinstrumentation_u4_assessment.py
