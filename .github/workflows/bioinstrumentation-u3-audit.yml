name: Bioinstrumentation U3 Scientific Editorial Audit

on:
  pull_request:
    paths:
      - "data/editorial_audits/bioinstrumentacion-unit-03.json"
      - "data/unit_preparation/bioinstrumentacion-unit-03.json"
      - "data/unit_preparation/bioinstrumentacion-unit-03-blocker-resolution.json"
      - "data/practice_implementations/bioinstrumentacion-unit-03.json"
      - "data/assessment_implementations/bioinstrumentacion-unit-03.json"
      - "docs/pilots/bioinstrumentacion/unit-03/SCIENTIFIC_EDITORIAL_AUDIT.md"
      - "scripts/validate_bioinstrumentation_u3_audit.py"
      - ".github/workflows/bioinstrumentation-u3-audit.yml"
  push:
    branches: [main]
    paths:
      - "data/editorial_audits/bioinstrumentacion-unit-03.json"
      - "data/unit_preparation/bioinstrumentacion-unit-03.json"
      - "data/unit_preparation/bioinstrumentacion-unit-03-blocker-resolution.json"
      - "data/practice_implementations/bioinstrumentacion-unit-03.json"
      - "data/assessment_implementations/bioinstrumentacion-unit-03.json"
      - "docs/pilots/bioinstrumentacion/unit-03/SCIENTIFIC_EDITORIAL_AUDIT.md"
      - "scripts/validate_bioinstrumentation_u3_audit.py"
      - ".github/workflows/bioinstrumentation-u3-audit.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/validate_bioinstrumentation_u3_audit.py
