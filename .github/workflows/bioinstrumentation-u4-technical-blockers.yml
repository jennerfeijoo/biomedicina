name: Bioinstrumentation U4 Technical Blockers

on:
  pull_request:
    paths:
      - 'data/unit_preparation/bioinstrumentacion-unit-04.json'
      - 'data/unit_preparation/bioinstrumentacion-unit-04-blocker-resolution.json'
      - 'docs/pilots/bioinstrumentacion/unit-04/TECHNICAL_BLOCKERS.md'
      - 'scripts/validate_bioinstrumentation_u4_preparation.py'
      - 'scripts/validate_bioinstrumentation_u4_blockers.py'
      - '.github/workflows/bioinstrumentation-u4-technical-blockers.yml'
  push:
    branches: [main]
    paths:
      - 'data/unit_preparation/bioinstrumentacion-unit-04.json'
      - 'data/unit_preparation/bioinstrumentacion-unit-04-blocker-resolution.json'
      - 'docs/pilots/bioinstrumentacion/unit-04/TECHNICAL_BLOCKERS.md'
      - 'scripts/validate_bioinstrumentation_u4_preparation.py'
      - 'scripts/validate_bioinstrumentation_u4_blockers.py'
      - '.github/workflows/bioinstrumentation-u4-technical-blockers.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/validate_bioinstrumentation_u4_preparation.py
      - run: python scripts/validate_bioinstrumentation_u4_blockers.py
