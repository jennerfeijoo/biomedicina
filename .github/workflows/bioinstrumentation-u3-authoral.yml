name: Bioinstrumentation U3 Authoral Unit

on:
  pull_request:
    paths:
      - 'data/course_redevelopment/bioinstrumentacion/units/unit-03.json'
      - 'data/editorial_audits/bioinstrumentacion-unit-03.json'
      - 'data/practice_implementations/bioinstrumentacion-unit-03.json'
      - 'data/assessment_implementations/bioinstrumentacion-unit-03.json'
      - 'scripts/validate_bioinstrumentation_u3_authoral.py'
      - '.github/workflows/bioinstrumentation-u3-authoral.yml'
  push:
    branches: [main]
    paths:
      - 'data/course_redevelopment/bioinstrumentacion/units/unit-03.json'
      - 'scripts/validate_bioinstrumentation_u3_authoral.py'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/validate_bioinstrumentation_u3_authoral.py
