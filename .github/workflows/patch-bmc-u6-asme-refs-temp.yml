name: Patch BMC U6 ASME refs (temporary)

on:
  push:
    branches:
      - codex/biomecanica-medios-continuos-unit-06-academic-quality

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/biomecanica-medios-continuos-unit-06-academic-quality
          fetch-depth: 0

      - name: Patch distinct ASME standard URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('data/course_redevelopment/biomecanica-medios-continuos/units/unit-06.json'),
              Path('data/generated_units/biomecanica-medios-continuos/unit-06.json'),
          ]
          replacements = {
              'asme-vv10': 'https://www.asme.org/codes-standards/find-codes-standards/standard-for-verification-and-validation-in-computational-solid-mechanics/2019/pdf',
              'asme-vvuq10-2': 'https://www.asme.org/codes-standards/find-codes-standards/the-role-of-uncertainty-quantification-in-verification-and-validation-of-computational-solid-mechanics-models',
          }

          for path in paths:
              text = path.read_text(encoding='utf-8')
              for source_id, new_url in replacements.items():
                  pattern = rf'(\{{"id": "{re.escape(source_id)}"[^\n]*?"url": ")[^"]+("[^\n]*\}})'
                  text, count = re.subn(pattern, rf'\g<1>{new_url}\g<2>', text)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one replacement for {source_id}, got {count}')
              path.write_text(text, encoding='utf-8')

          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit('redevelopment/generated mirror mismatch after patch')
          PY

      - name: Commit patch and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-bmc-u6-asme-refs-temp.yml
          git add data/course_redevelopment/biomecanica-medios-continuos/units/unit-06.json data/generated_units/biomecanica-medios-continuos/unit-06.json
          git commit -m "Fix distinct ASME references in BMC U6"
          git pull --rebase origin codex/biomecanica-medios-continuos-unit-06-academic-quality
          git push origin HEAD:codex/biomecanica-medios-continuos-unit-06-academic-quality
