name: Materialize Informatica Biomedica U6

on:
  push:
    branches:
      - codex/informatica-biomedica-u6-gobernanza

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/informatica-biomedica-u6-gobernanza
          fetch-depth: 0

      - name: Materialize canonical unit, mirror and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import json
          import zlib

          root = Path('.')
          parts = sorted((root / '.tmp/informatica_u6').glob('unit*.b64'))
          assert len(parts) == 4, parts
          unit_b64 = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          test_b64 = (root / '.tmp/informatica_u6/test.b64').read_text(encoding='utf-8').strip()
          assert len(unit_b64) == 23520, len(unit_b64)
          assert len(test_b64) == 4276, len(test_b64)

          unit_bytes = zlib.decompress(base64.b64decode(unit_b64))
          test_bytes = zlib.decompress(base64.b64decode(test_b64))
          unit = json.loads(unit_bytes.decode('utf-8'))
          assert unit['subject_id'] == 'informatica-biomedica'
          assert unit['unit'] == 6
          assert unit['slug'] == 'gobernanza-e-implementacion'

          source = root / 'data/course_redevelopment/informatica-biomedica/units/unit-06.json'
          mirror = root / 'data/generated_units/informatica-biomedica/unit-06.json'
          test = root / 'tests/test_informatica_biomedica_unit_06_curated.py'
          source.parent.mkdir(parents=True, exist_ok=True)
          mirror.parent.mkdir(parents=True, exist_ok=True)
          test.parent.mkdir(parents=True, exist_ok=True)
          source.write_bytes(unit_bytes)
          mirror.write_bytes(unit_bytes)
          test.write_bytes(test_bytes)
          assert source.read_bytes() == mirror.read_bytes()
          json.loads(source.read_text(encoding='utf-8'))
          PY

      - name: Commit functional files and remove temporary materializer
        shell: bash
        run: |
          rm -rf .tmp/informatica_u6
          rm -f .github/workflows/materialize-informatica-biomedica-u6.yml
          git config user.name "JennerFeijoo"
          git config user.email "65651751+jennerfeijoo@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Curación académica de Informática Biomédica U6"
          git push origin HEAD:codex/informatica-biomedica-u6-gobernanza
