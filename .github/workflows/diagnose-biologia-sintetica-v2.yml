name: Diagnose Synthetic Biology v2

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-biologia-sintetica-v2.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-biologia-sintetica-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize package
        run: python scripts/materialize_biologia_sintetica_v2.py

      - name: Publish and generate
        run: |
          python scripts/publish_courses.py --subject biologia-sintetica --manifest publication-manifest.json
          python scripts/generate_site.py --force --subject biologia-sintetica --with-units --force-authored-units
          python scripts/generate_public_indexes.py --manifest publication-manifest.json

      - name: Validate self-paced model
        continue-on-error: true
        run: python scripts/validate_self_paced_model.py

      - name: Validate generated units
        continue-on-error: true
        run: python scripts/validate_generated_units.py

      - name: Audit course readiness
        continue-on-error: true
        run: python scripts/audit_course_readiness.py --strict

      - name: Audit course portfolio
        continue-on-error: true
        run: python scripts/audit_course_portfolio.py --strict

      - name: Audit course redundancy
        continue-on-error: true
        run: python scripts/audit_course_redundancy.py --strict

      - name: Audit curriculum completeness
        continue-on-error: true
        run: python scripts/audit_curriculum_completeness.py --strict

      - name: Audit curriculum expansions
        continue-on-error: true
        run: python scripts/audit_curriculum_expansions.py --strict

      - name: Audit public alignment
        continue-on-error: true
        run: python scripts/audit_public_unit_alignment.py --strict

      - name: Validate links
        continue-on-error: true
        run: python scripts/validate_links.py

      - name: Verify publication
        continue-on-error: true
        run: python scripts/publish_courses.py --subject biologia-sintetica --check-public
