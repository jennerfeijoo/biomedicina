name: Materialize differential equations redevelopment

on:
  push:
    branches:
      - agent/rebuild-ecuaciones-diferenciales
    paths:
      - 'data/bootstrap/ecuaciones-diferenciales/**'
      - '.github/workflows/materialize-ecuaciones-diferenciales.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data/bootstrap/ecuaciones-diferenciales/**'
      - '.github/workflows/materialize-ecuaciones-diferenciales.yml'

permissions:
  contents: write

concurrency:
  group: materialize-ecuaciones-diferenciales
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/rebuild-ecuaciones-diferenciales

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemble and verify redevelopment package
        shell: bash
        run: |
          set -euo pipefail
          cat data/bootstrap/ecuaciones-diferenciales/part-*.txt > /tmp/edo.bundle.b64
          echo '3b82a3909345c28eaa93e15689ab385b364630e506046dff1d4522b7ec09543e  /tmp/edo.bundle.b64' | sha256sum -c -
          base64 -d /tmp/edo.bundle.b64 > /tmp/edo.bundle.tar.gz
          echo 'd31f23fbf3f570a879820a89f9c14a4c402af6ac2b22dd3b9098c5ca53b12fd3  /tmp/edo.bundle.tar.gz' | sha256sum -c -
          python - <<'PY'
          from pathlib import PurePosixPath
          import tarfile

          archive = '/tmp/edo.bundle.tar.gz'
          with tarfile.open(archive, 'r:gz') as bundle:
              for member in bundle.getmembers():
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Ruta insegura en el paquete: {member.name}')
              bundle.extractall('.')
          PY

      - name: Normalize canonical curricular area
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('data/course_redevelopment/ecuaciones-diferenciales')
          paths = [root / 'course.json', *sorted((root / 'units').glob('unit-*.json'))]
          for path in paths:
              data = json.loads(path.read_text(encoding='utf-8'))
              data['area_id'] = 'ciencias-basicas'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          assert len(paths) == 11, f'Se esperaban curso y diez unidades; se encontraron {len(paths)} archivos'
          PY

      - name: Promote reconstructed course
        run: |
          python scripts/publish_courses.py \
            --subject ecuaciones-diferenciales \
            --manifest publication-manifest.json

      - name: Validate advanced units
        run: python scripts/validate_generated_units.py

      - name: Generate public course and units
        run: |
          python scripts/generate_site.py \
            --force \
            --subject ecuaciones-diferenciales \
            --with-units \
            --force-authored-units

      - name: Regenerate indexes
        run: python scripts/generate_public_indexes.py --manifest publication-manifest.json

      - name: Validate publication
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py
          python scripts/publish_courses.py --subject ecuaciones-diferenciales --check-public
          python scripts/generate_public_indexes.py --manifest publication-manifest.json --check

      - name: Run developed-course audit
        run: |
          python scripts/audit_developed_courses.py \
            --strict \
            --json-output /tmp/developed-courses.json \
            --markdown-output /tmp/developed-courses.md

      - name: Remove transport files and commit materialized course
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/bootstrap/ecuaciones-diferenciales
          rm -f .github/workflows/materialize-ecuaciones-diferenciales.yml
          rm -f publication-manifest.json publication-args.txt publication-subjects.txt publication-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild Ecuaciones Diferenciales as a ten-unit course'
          git push origin HEAD:agent/rebuild-ecuaciones-diferenciales
