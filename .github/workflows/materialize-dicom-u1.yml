name: Materialize DICOM U1
on:
  push:
    branches:
      - codex/laboratorio-imagenes-biomedicas-u1-dicom-visualizacion
    paths:
      - .github/workflows/materialize-dicom-u1.yml
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/laboratorio-imagenes-biomedicas-u1-dicom-visualizacion
      - name: Assemble and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/course_redevelopment/laboratorio-imagenes-biomedicas/units
          mkdir -p data/generated_units/laboratorio-imagenes-biomedicas
          mkdir -p tests
          cat .tmp/dicom_u1/part01.b64 .tmp/dicom_u1/part02.b64 .tmp/dicom_u1/part03.b64 .tmp/dicom_u1/part04.b64 | base64 -d | gunzip > data/course_redevelopment/laboratorio-imagenes-biomedicas/units/unit-01.json
          cp data/course_redevelopment/laboratorio-imagenes-biomedicas/units/unit-01.json data/generated_units/laboratorio-imagenes-biomedicas/unit-01.json
          base64 -d .tmp/dicom_u1/test.b64 | gunzip > tests/test_laboratorio_imagenes_biomedicas_unit_01_curated.py
          python -m json.tool data/course_redevelopment/laboratorio-imagenes-biomedicas/units/unit-01.json >/dev/null
          cmp data/course_redevelopment/laboratorio-imagenes-biomedicas/units/unit-01.json data/generated_units/laboratorio-imagenes-biomedicas/unit-01.json
          python -m py_compile tests/test_laboratorio_imagenes_biomedicas_unit_01_curated.py
      - name: Remove transfer scaffolding
        run: |
          rm -rf .tmp/dicom_u1
          rm -f .github/workflows/materialize-dicom-u1.yml
      - name: Commit curated unit
        run: |
          git config user.name "JennerFeijoo"
          git config user.email "65651751+jennerfeijoo@users.noreply.github.com"
          git add -A
          git commit -m "Curar Laboratorio de Imágenes Biomédicas U1: DICOM y visualización"
          git push origin HEAD:codex/laboratorio-imagenes-biomedicas-u1-dicom-visualizacion
