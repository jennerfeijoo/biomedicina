name: Temporary Laboratorio Bioinstrumentacion canonical closure

on:
  push:
    branches:
      - codex/laboratorio-bioinstrumentacion-course-closure

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/laboratorio-bioinstrumentacion-course-closure
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build and curate canonical course
        run: python scripts/curate_laboratorio_bioinstrumentacion_course_temp.py

      - name: Validate canonical academic course strictly
        run: python scripts/validate_academic_courses.py --course laboratorio-bioinstrumentacion --strict-content

      - name: Run permanent course regression
        run: python -m unittest tests.test_laboratorio_bioinstrumentacion_canonical_course

      - name: Validate course supplements
        run: python scripts/validate_course_supplements.py

      - name: Validate scientific traceability
        run: python scripts/validate_scientific_traceability.py

      - name: Regenerate public course
        run: python scripts/generate_site.py --force --subject laboratorio-bioinstrumentacion --with-units --force-authored-units

      - name: Validate public alignment
        run: python scripts/audit_public_unit_alignment.py --strict

      - name: Validate internal links
        run: python scripts/validate_links.py

      - name: Remove temporary machinery and commit result
        shell: bash
        run: |
          rm -f scripts/curate_laboratorio_bioinstrumentacion_course_temp.py
          rm -f .github/workflows/temp-laboratorio-bioinstrumentacion-course-closure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/courses/laboratorio-bioinstrumentacion tests/test_laboratorio_bioinstrumentacion_canonical_course.py ingenieria-biomedica/laboratorio-bioinstrumentacion scripts/curate_laboratorio_bioinstrumentacion_course_temp.py .github/workflows/temp-laboratorio-bioinstrumentacion-course-closure.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Close Laboratorio de Bioinstrumentacion canonical course"
          git push origin HEAD:codex/laboratorio-bioinstrumentacion-course-closure
