name: Build complete Genetica course

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/complete-remaining-courses' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout course branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Genetica source package
        run: |
          cat .tmp/genetica/part-*.b64 | base64 --decode > /tmp/genetica-course.zip
          unzip -o /tmp/genetica-course.zip -d .
          test -f data/generated_courses/genetica.json
          for number in 01 02 03 04 05 06; do
            test -f "data/generated_units/genetica/unit-${number}.json"
          done

      - name: Validate structured Genetica content
        run: |
          python scripts/validate_generated_units.py
          python - <<'PY'
          import json
          from pathlib import Path

          course = json.loads(Path('data/generated_courses/genetica.json').read_text(encoding='utf-8'))
          assert course['subject_id'] == 'genetica'
          assert course['status'] in {'review', 'complete'}
          assert len(course['learning_outcomes']) >= 6
          assert len(course['assessment_plan']) >= 3
          assert sum(item['weight_percent'] for item in course['assessment_plan']) == 100
          assert course['final_project']['rubric']
          assert len(course['core_resources']) >= 5
          print('Programa avanzado de Genética: OK')
          PY

      - name: Regenerate public course and units
        run: |
          python scripts/generate_site.py --force --with-units
          python scripts/enrich_generated_pages.py
          python scripts/enrich_authored_unit_pages.py

      - name: Validate public output
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_units.py
          python scripts/validate_links.py
          python - <<'PY'
          from pathlib import Path

          unit_dir = Path('biologicas-medicas/genetica/unidades')
          for number in range(1, 7):
              page = (unit_dir / f'unidad-{number:02d}.html').read_text(encoding='utf-8')
              assert '<!-- advanced-unit-renderer:v1 -->' in page
              assert 'advanced-theory-section' in page
              assert 'answer-panel' in page
          index = (unit_dir / 'index.html').read_text(encoding='utf-8')
          assert all(f'unidad-{number:02d}.html' in index for number in range(1, 7))
          course = Path('biologicas-medicas/genetica/index.html').read_text(encoding='utf-8')
          assert 'assets/js/course.js' in course
          print('Páginas públicas avanzadas de Genética: OK')
          PY

      - name: Commit completed Genetica course
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated_courses/genetica.json data/generated_units/genetica \
            biologicas-medicas/genetica biologicas-medicas/index.html catalogo/index.html
          if git diff --cached --quiet; then
            echo "Genética ya está sincronizada"
            exit 0
          fi
          git commit -m "Complete Genetica course and six advanced units"
          git push origin HEAD:${{ github.head_ref }}
