name: Materialize Imagenes Avanzadas I U5

on:
  push:
    branches:
      - codex/imagenes-biomedicas-avanzadas-i-u5-registro-fusion

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/imagenes-biomedicas-avanzadas-i-u5-registro-fusion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize and validate U5
        run: python .tmp/materialize_imagenes_avanzadas_i_u5.py

      - name: Commit curated U5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Curación académica de Imágenes Biomédicas Avanzadas I U5"
          git push origin HEAD:codex/imagenes-biomedicas-avanzadas-i-u5-registro-fusion
