name: Trigger Ingenieria Datos U4 materialization temp

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize canonical U4 from final chunks
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import zlib
          from pathlib import Path

          payload = Path('.tmp/u4_payload')
          unit_parts = [
              'final-unit-01.b64',
              'final-unit-02.b64',
              'final-unit-03-04.b64',
              'final-unit-05-06.b64',
              'final-unit-07-08.b64',
          ]
          unit_b64 = ''.join((payload / name).read_text(encoding='utf-8').strip() for name in unit_parts)
          test_b64 = (payload / 'final-test.b64').read_text(encoding='utf-8').strip()

          unit_bytes = zlib.decompress(base64.b64decode(unit_b64))
          test_bytes = zlib.decompress(base64.b64decode(test_b64))
          unit = json.loads(unit_bytes.decode('utf-8'))

          assert unit['subject_id'] == 'ingenieria-datos-biomedicos'
          assert unit['unit'] == 4
          assert unit['slug'] == 'calidad-y-procedencia'
          assert len(unit.get('theory_sections', [])) >= 5
          assert len(unit.get('glossary', [])) >= 50
          assert len(unit.get('worked_examples', [])) >= 5
          assert len(unit.get('common_errors', [])) >= 18
          assert len(unit.get('self_assessment', [])) >= 12
          assert len(unit.get('sources', [])) >= 14
          assert 'Concepto de la unidad que debe definirse mediante entidades observables' not in unit_bytes.decode('utf-8')
          assert 'PPV=' not in unit_bytes.decode('utf-8')

          source = Path('data/course_redevelopment/ingenieria-datos-biomedicos/units/unit-04.json')
          mirror = Path('data/generated_units/ingenieria-datos-biomedicos/unit-04.json')
          test_path = Path('tests/test_ingenieria_datos_biomedicos_unit_04_curated.py')
          source.parent.mkdir(parents=True, exist_ok=True)
          mirror.parent.mkdir(parents=True, exist_ok=True)
          test_path.parent.mkdir(parents=True, exist_ok=True)
          source.write_bytes(unit_bytes)
          mirror.write_bytes(unit_bytes)
          test_path.write_bytes(test_bytes)
          assert source.read_bytes() == mirror.read_bytes()
          print(f'U4 materializada: {len(unit_bytes)} bytes; regresión: {len(test_bytes)} bytes')
          PY

      - name: Validate canonical U4 before commit
        shell: bash
        run: |
          python scripts/validate_generated_units.py
          python -m unittest tests.test_ingenieria_datos_biomedicos_unit_04_curated

      - name: Remove temporary transfer infrastructure
        shell: bash
        run: |
          rm -rf .tmp/u4_payload
          rm -f .github/workflows/materialize-ingenieria-datos-u4-temp.yml
          rm -f .github/workflows/trigger-ingenieria-datos-u4-materialization-temp.yml

      - name: Commit canonical U4
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Curar Ingeniería de Datos Biomédicos U4"
          git push origin HEAD:${{ github.head_ref }}
