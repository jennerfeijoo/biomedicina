name: Finalize Biomateriales U5 (temporary)

on:
  push:
    branches:
      - codex/biomateriales-unit-05-academic-quality

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: codex/biomateriales-unit-05-academic-quality

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply academic corrections
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('data/course_redevelopment/biomateriales/units/unit-05.json')
          mirror = Path('data/generated_units/biomateriales/unit-05.json')
          test = Path('tests/test_biomateriales_unit_05_curated.py')
          temp = Path('data/.tmp_biomateriales_u5/unit.part02.b64')

          unit = json.loads(source.read_text(encoding='utf-8'))

          def replace_strings(value, old, new):
              if isinstance(value, str):
                  return value.replace(old, new)
              if isinstance(value, list):
                  return [replace_strings(item, old, new) for item in value]
              if isinstance(value, dict):
                  return {key: replace_strings(item, old, new) for key, item in value.items()}
              return value

          unit = replace_strings(unit, 'ASTM E8/E8M-24', 'ASTM E8/E8M-25')
          unit = replace_strings(unit, 'https://store.astm.org/e0008_e0008m-24.html', 'https://store.astm.org/e0008_e0008m-25.html')
          unit = replace_strings(unit, 'https://store.astm.org/standards/d638/1000', 'https://store.astm.org/d0638-22.html')
          unit = replace_strings(unit, 'https://store.astm.org/standards/d7334', 'https://store.astm.org/d7334-08r22.html')

          # Strengthen the theory rather than weakening the regression.
          chemistry = unit['theory_sections'][3]['paragraphs'][0]
          chemistry = chemistry.replace(
              'La profundidad efectiva, resolución espectral, fondo, calibración y estrategia de ajuste condicionan la interpretación.',
              'La profundidad de análisis efectiva, la resolución espectral, el fondo, la calibración y la estrategia de ajuste condicionan la interpretación.'
          )
          if 'NIST X-ray Photoelectron Spectroscopy Database' not in chemistry:
              chemistry += (' La NIST X-ray Photoelectron Spectroscopy Database aporta posiciones de líneas y desplazamientos químicos críticamente evaluados; '
                            'sirve como referencia para apoyar asignaciones, no como sustituto de la calibración, el ajuste espectral ni el conocimiento de la muestra.')
          unit['theory_sections'][3]['paragraphs'][0] = chemistry

          mechanics = unit['theory_sections'][1]['paragraphs'][2]
          if 'ASTM E384-22' not in mechanics:
              mechanics += (' Para microindentación Knoop/Vickers, ASTM E384-22 explicita fuentes de error, verificación y repetibilidad; '
                            'para indentación instrumentada, ISO 14577-1:2026 exige especial atención a la calibración del instrumento, la geometría real de la punta y la función de área, '
                            'especialmente cuando disminuye la profundidad de indentación. Ninguna de estas mediciones debe convertirse automáticamente en resistencia a tracción o desgaste.')
          unit['theory_sections'][1]['paragraphs'][2] = mechanics

          microscopy = unit['theory_sections'][2]['paragraphs'][2]
          if 'ASTM E1508-12a(2019)' not in microscopy:
              microscopy += (' ASTM E1508-12a(2019), actualmente activa aunque con una revisión en desarrollo, documenta capacidades y limitaciones del análisis cuantitativo por EDS; '
                             'por ello el resultado debe conservar condiciones del haz, geometría, estándares o estrategia de cuantificación y sensibilidad elemental.')
          unit['theory_sections'][2]['paragraphs'][2] = microscopy

          extra_sources = [
              {
                  'title': 'ASTM E384-22 — Standard Test Method for Microindentation Hardness of Materials',
                  'organization': 'ASTM International',
                  'url': 'https://store.astm.org/e0384-22.html',
                  'type': 'método de ensayo',
                  'description': 'Método activo para microindentación Knoop/Vickers; incluye fuentes de error y su efecto sobre precisión, sesgo, repetibilidad y reproducibilidad.',
                  'verification_status': 'verified_directly'
              },
              {
                  'title': 'ISO 14577-1:2026 — Instrumented indentation test for hardness and materials parameters — Part 1: Test method',
                  'organization': 'ISO',
                  'url': 'https://www.iso.org/standard/85223.html',
                  'type': 'norma internacional',
                  'description': 'Edición 3 publicada en junio de 2026 para indentación instrumentada; destaca el efecto de la forma real de la punta y la función de área sobre los parámetros a pequeña escala.',
                  'verification_status': 'verified_directly'
              },
              {
                  'title': 'ASTM E1508-12a(2019) — Standard Guide for Quantitative Analysis by Energy-Dispersive Spectroscopy',
                  'organization': 'ASTM International',
                  'url': 'https://store.astm.org/e1508-12ar19.html',
                  'type': 'guía normalizada',
                  'description': 'Guía activa para análisis cuantitativo EDS en SEM/EPMA, con capacidades, limitaciones y expectativas de precisión según elemento, concentración y volumen analizado.',
                  'verification_status': 'verified_directly'
              },
              {
                  'title': 'NIST Surface Data — X-ray Photoelectron Spectroscopy and surface-analysis databases',
                  'organization': 'National Institute of Standards and Technology',
                  'url': 'https://www.nist.gov/srd/surface-data',
                  'type': 'base de datos de referencia',
                  'description': 'Recursos de referencia para XPS y análisis de superficie, incluidos datos de energías de enlace, desplazamientos químicos y parámetros para interpretación cuantitativa.',
                  'verification_status': 'verified_directly'
              }
          ]
          existing_urls = {item.get('url') for item in unit['sources']}
          for item in extra_sources:
              if item['url'] not in existing_urls:
                  unit['sources'].append(item)
                  existing_urls.add(item['url'])

          rendered = json.dumps(unit, ensure_ascii=False, indent=2) + '\n'
          source.write_text(rendered, encoding='utf-8')
          mirror.write_text(rendered, encoding='utf-8')

          text = test.read_text(encoding='utf-8')
          text = text.replace('astm e8/e8m-24', 'astm e8/e8m-25')
          text = text.replace('https://store.astm.org/e0008_e0008m-24.html', 'https://store.astm.org/e0008_e0008m-25.html')
          text = text.replace('https://store.astm.org/standards/d638/1000', 'https://store.astm.org/d0638-22.html')
          text = text.replace('https://store.astm.org/standards/d7334', 'https://store.astm.org/d7334-08r22.html')
          text = text.replace('"profundidad efectiva",', '"profundidad de análisis",')
          text = text.replace('self.assertGreaterEqual(len(sources), 10)', 'self.assertGreaterEqual(len(sources), 14)')
          marker = '            "https://www.bipm.org/en/doi/10.59161/jcgm100-2008e",\n'
          additions = (
              '            "https://store.astm.org/e0384-22.html",\n'
              '            "https://www.iso.org/standard/85223.html",\n'
              '            "https://store.astm.org/e1508-12ar19.html",\n'
              '            "https://www.nist.gov/srd/surface-data",\n'
          )
          if 'https://www.iso.org/standard/85223.html' not in text:
              text = text.replace(marker, marker + additions)
          test.write_text(text, encoding='utf-8')

          if temp.exists():
              temp.unlink()
          tmp_dir = temp.parent
          if tmp_dir.exists() and not any(tmp_dir.iterdir()):
              tmp_dir.rmdir()
          PY

      - name: Validate corrected unit
        run: |
          python -m unittest tests.test_biomateriales_unit_05_curated -v
          python scripts/validate_generated_units.py
          python scripts/generate_site.py --force --subject biomateriales --with-units
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Commit permanent files and self-clean
        shell: bash
        run: |
          rm -f .github/workflows/biomateriales-u5-finalize-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Finalize Biomateriales U5 academic characterization"
          git push origin HEAD:codex/biomateriales-unit-05-academic-quality
