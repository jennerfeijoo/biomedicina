name: Run Course Unit Navigation on PR

on:
  pull_request:
    branches:
      - agent/audit-critical-fixes

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/standardize-course-unit-navigation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/standardize-course-unit-navigation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract migration program
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-course-unit-navigation.yml').read_text(encoding='utf-8').splitlines()
          start = workflow.index("          python - <<'PY'") + 1
          end = workflow.index('          PY', start)
          program = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[start:end]) + '\n'
          Path('/tmp/migrate_course_navigation.py').write_text(program, encoding='utf-8')
          PY

      - name: Apply migration
        run: python /tmp/migrate_course_navigation.py

      - name: Repair compact renderer source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/generate_site.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def render_units(')
          end = text.index('\ndef pedagogical_frame_for', start)
          return_line = (
              '    return '
              + repr('<div class="unit-index-grid course-unit-overview">\n')
              + ' + '
              + repr('\n')
              + '.join(cards) + '
              + repr('\n      </div>')
          )
          replacement = '\n'.join([
              'def render_units(units: list[dict[str, object]], empty_message: str) -> str:',
              '    """Renderiza una vista compacta; el desarrollo completo vive en cada página de unidad."""',
              '    if not units:',
              '        return f\'<p class="muted">{escape(empty_message)}</p>\'',
              '    cards: list[str] = []',
              '    for unit in units:',
              '        number = int(unit.get("unit", 0))',
              '        title = escape(unit.get("title", "Unidad"))',
              '        description = escape(unit.get("description", ""))',
              '        href = f"unidades/unidad-{number:02d}.html"',
              '        cards.append(',
              '            f\'        <a class="link-card unit-index-card course-unit-summary" href="{href}">\'',
              '            f\'<span class="course-tag">Unidad {number}</span>\'',
              '            f\'<strong>{title}</strong><p>{description}</p>\'',
              '            \'<span class="unit-index-action">Abrir lección →</span></a>\'',
              '        )',
              return_line,
              '',
          ])
          path.write_text(text[:start] + replacement + text[end + 1:], encoding='utf-8')
          PY

      - name: Repair enrichment source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/enrich_generated_pages.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def enrich_unit_page(')
          end = text.index('\ndef catalog_paths', start)
          nl = repr('\n')
          lines = [
              'def enrich_unit_page(original: str, unit: dict[str, Any]) -> str:',
              f'    cleaned = UNIT_MARKER_RE.sub({nl}, original)',
              '    enrichment = render_unit_enrichment(unit)',
              '    enriched, count = THEORY_SECTION_RE.subn(',
              '        lambda match: match.group(1) + enrichment + match.group(2),',
              '        cleaned,',
              '        count=1,',
              '    )',
              '    if count != 1:',
              '        raise ValueError("No se encontró la sección de teoría en la página de unidad")',
              f'    return {nl}.join(line.rstrip() for line in enriched.splitlines()).rstrip() + {nl}',
              '',
              '',
              'def enrich_html(original: str, overlay: dict[str, Any]) -> str:',
              f'    cleaned = UNIT_MARKER_RE.sub({nl}, original)',
              f'    cleaned = SOURCE_MARKER_RE.sub({nl}, cleaned)',
              '    if \'data-unit-overview="compact"\' in cleaned:',
              '        enriched = cleaned',
              '    else:',
              '        units = overlay.get("detailed_units", [])',
              '        article_matches = list(ARTICLE_RE.finditer(cleaned))',
              '        if len(article_matches) != len(units):',
              '            raise ValueError(',
              '                f"El HTML contiene {len(article_matches)} unidades y el overlay {len(units)}"',
              '            )',
              '        pieces: list[str] = []',
              '        cursor = 0',
              '        for match, unit in zip(article_matches, units, strict=True):',
              '            article = match.group(0)',
              '            anchor = "        <h4>Temas</h4>"',
              '            if anchor not in article:',
              '                raise ValueError("No se encontró el ancla <h4>Temas</h4> en una unidad")',
              '            article = article.replace(anchor, render_unit_enrichment(unit) + anchor, 1)',
              '            pieces.append(cleaned[cursor : match.start()])',
              '            pieces.append(article)',
              '            cursor = match.end()',
              '        pieces.append(cleaned[cursor:])',
              '        enriched = "".join(pieces)',
              '',
              '    sources_html = render_sources(overlay.get("sources_used", []))',
              '    if sources_html:',
              '        enriched, count = RESOURCE_SECTION_RE.subn(',
              '            lambda match: match.group(1) + sources_html + match.group(2),',
              '            enriched,',
              '            count=1,',
              '        )',
              '        if count != 1:',
              '            raise ValueError("No se encontró la sección de recursos en el HTML")',
              f'    return {nl}.join(line.rstrip() for line in enriched.splitlines()).rstrip() + {nl}',
              '',
          ]
          replacement = '\n'.join(lines)
          path.write_text(text[:start] + replacement + text[end + 1:], encoding='utf-8')
          PY

      - name: Regenerate all pages
        run: |
          set -o pipefail
          mkdir -p migration-logs
          python scripts/generate_site.py --force --with-units 2>&1 | tee migration-logs/generate-site.log

      - name: Enrich generated pages
        run: |
          set -o pipefail
          mkdir -p migration-logs
          python scripts/enrich_generated_pages.py 2>&1 | tee migration-logs/enrich-generated-pages.log

      - name: Upload migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-unit-navigation-logs
          path: migration-logs/

      - name: Validate migrated architecture
        run: |
          python scripts/validate_curriculum.py
          python scripts/check_generated_preview.py --limit 84
          python scripts/validate_units.py
          python scripts/validate_links.py --quiet
          python scripts/enrich_generated_pages.py --check

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/generated-units.js scripts/generate_site.py scripts/enrich_generated_pages.py templates/asignatura.html templates/unidad.html
          git add ciencias-basicas biologicas-medicas ingenieria-biomedica gestion-etica-comunicacion
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
            exit 0
          fi
          git commit -m "Standardize course unit navigation"
          git push origin HEAD:agent/standardize-course-unit-navigation
