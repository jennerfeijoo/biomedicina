name: Bioinstrumentation U5 Blocker Resolution

on:
  pull_request:
    paths:
      - 'data/unit_preparation/bioinstrumentacion-unit-05-blocker-resolution.json'
      - 'docs/pilots/bioinstrumentacion/unit-05/BLOCKER_RESOLUTION.md'
      - 'scripts/validate_bioinstrumentation_u5_blocker_resolution.py'
      - '.github/workflows/bioinstrumentation-u5-blocker-resolution.yml'
  push:
    branches: [main]
    paths:
      - 'data/unit_preparation/bioinstrumentacion-unit-05-blocker-resolution.json'
      - 'docs/pilots/bioinstrumentacion/unit-05/BLOCKER_RESOLUTION.md'
      - 'scripts/validate_bioinstrumentation_u5_blocker_resolution.py'
      - '.github/workflows/bioinstrumentation-u5-blocker-resolution.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/validate_bioinstrumentation_u5_blocker_resolution.py
