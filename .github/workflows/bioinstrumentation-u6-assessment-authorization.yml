name: Bioinstrumentation U6 Assessment Authorization

on:
  pull_request:
    paths:
      - 'data/assessment_authorizations/bioinstrumentacion-unit-06.json'
      - 'data/unit_preparation/bioinstrumentacion-unit-06.json'
      - 'data/unit_preparation/bioinstrumentacion-unit-06-blocker-resolution.json'
      - 'data/practice_implementations/bioinstrumentacion-unit-06.json'
      - 'docs/pilots/bioinstrumentacion/unit-06/ASSESSMENT_AUTHORIZATION.md'
      - 'scripts/validate_bioinstrumentation_u6_assessment_authorization.py'
      - '.github/workflows/bioinstrumentation-u6-assessment-authorization.yml'
  push:
    branches: [main]
    paths:
      - 'data/assessment_authorizations/bioinstrumentacion-unit-06.json'
      - 'scripts/validate_bioinstrumentation_u6_assessment_authorization.py'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/validate_bioinstrumentation_u6_assessment_authorization.py
