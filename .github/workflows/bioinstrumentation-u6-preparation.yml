name: Bioinstrumentation U6 Preparation

on:
  pull_request:
    paths:
      - "data/unit_preparation/bioinstrumentacion-unit-06.json"
      - "docs/pilots/bioinstrumentacion/unit-06/**"
      - "scripts/validate_bioinstrumentation_u6_preparation.py"
      - ".github/workflows/bioinstrumentation-u6-preparation.yml"
  push:
    branches: [main]
    paths:
      - "data/unit_preparation/bioinstrumentacion-unit-06.json"
      - "docs/pilots/bioinstrumentacion/unit-06/**"
      - "scripts/validate_bioinstrumentation_u6_preparation.py"
      - ".github/workflows/bioinstrumentation-u6-preparation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Unit 6 preparation
        run: python scripts/validate_bioinstrumentation_u6_preparation.py
