name: Materialize reviewed public files
on:
  push:
    branches: [codex/production-readiness-2026-09-26]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - name: Materialize and verify reviewed source changes
        run: |
          python scripts/publish_courses.py --all
          python scripts/sync_catalog_statuses.py
          python scripts/generate_site.py --force --with-units
          python scripts/enrich_authored_unit_pages.py
          python scripts/run_quality.py --report-dir "${RUNNER_TEMP}/citonauta-quality"
      - name: Commit generated outputs and remove this one-time workflow
        run: |
          rm .github/workflows/materialize-public.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize verified static publication and remove temporary workflow"
          git push
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: materialization-quality
          path: ${{ runner.temp }}/citonauta-quality
