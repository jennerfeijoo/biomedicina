name: Validate structured connections rendering

on:
  pull_request:
    paths:
      - assets/js/generated-units.js
      - scripts/advanced_unit_renderer.py
      - scripts/test_structured_connections_rendering.py
      - .github/workflows/validate-structured-connections-rendering.yml
  push:
    branches:
      - main
    paths:
      - assets/js/generated-units.js
      - scripts/advanced_unit_renderer.py
      - scripts/test_structured_connections_rendering.py
      - .github/workflows/validate-structured-connections-rendering.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python renderer behavior
        run: python scripts/test_structured_connections_rendering.py

      - name: Validate JavaScript syntax
        run: node --check assets/js/generated-units.js

      - name: Validate Python syntax
        run: python -m py_compile scripts/advanced_unit_renderer.py
