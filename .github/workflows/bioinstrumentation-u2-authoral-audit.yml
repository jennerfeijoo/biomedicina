name: Bioinstrumentation U2 Authoral Audit

on:
  pull_request:
    paths:
      - 'data/course_redevelopment/bioinstrumentacion/unit-02-source/**'
      - 'data/course_redevelopment/bioinstrumentacion/units/unit-02.json'
      - 'data/course_audits/bioinstrumentacion/UNIT_02_AUTHORAL_SCIENTIFIC_EDITORIAL_AUDIT_2026-07-30.json'
      - 'docs/pilots/bioinstrumentacion/unit-02/**'
      - 'scripts/build_bioinstrumentation_u2_authoral_unit.py'
      - 'scripts/validate_bioinstrumentation_u2_authoral_unit.py'
      - 'scripts/validate_bioinstrumentation_u2_authoral_scientific_editorial_audit.py'
      - '.github/workflows/bioinstrumentation-u2-authoral-audit.yml'
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check deterministic Unit 2 build
        run: python scripts/build_bioinstrumentation_u2_authoral_unit.py --check

      - name: Validate Unit 2 authoral unit
        run: python scripts/validate_bioinstrumentation_u2_authoral_unit.py

      - name: Validate Unit 2 authoral scientific and editorial audit
        run: python scripts/validate_bioinstrumentation_u2_authoral_scientific_editorial_audit.py
