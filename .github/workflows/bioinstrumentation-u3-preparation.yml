name: Bioinstrumentation U3 Preparation

on:
  pull_request:
    paths:
      - 'data/unit_preparation/bioinstrumentacion-unit-03.json'
      - 'data/source_registry/bioinstrumentacion-unit-03.json'
      - 'docs/pilots/bioinstrumentacion/unit-03/**'
      - 'scripts/validate_bioinstrumentation_u3_preparation.py'
      - '.github/workflows/bioinstrumentation-u3-preparation.yml'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/validate_bioinstrumentation_u3_preparation.py
