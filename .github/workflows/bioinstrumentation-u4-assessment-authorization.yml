name: Bioinstrumentation U4 Assessment Authorization

on:
  pull_request:
    paths:
      - "data/assessment_authorizations/bioinstrumentacion-unit-04.json"
      - "data/practice_implementations/bioinstrumentacion-unit-04.json"
      - "data/unit_preparation/bioinstrumentacion-unit-04-blocker-resolution.json"
      - "docs/pilots/bioinstrumentacion/unit-04/ASSESSMENT_AUTHORIZATION.md"
      - "scripts/validate_bioinstrumentation_u4_assessment_authorization.py"
      - ".github/workflows/bioinstrumentation-u4-assessment-authorization.yml"
  push:
    branches: [main]
    paths:
      - "data/assessment_authorizations/bioinstrumentacion-unit-04.json"
      - "data/practice_implementations/bioinstrumentacion-unit-04.json"
      - "data/unit_preparation/bioinstrumentacion-unit-04-blocker-resolution.json"
      - "docs/pilots/bioinstrumentacion/unit-04/ASSESSMENT_AUTHORIZATION.md"
      - "scripts/validate_bioinstrumentation_u4_assessment_authorization.py"
      - ".github/workflows/bioinstrumentation-u4-assessment-authorization.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_bioinstrumentation_u4_assessment_authorization.py
