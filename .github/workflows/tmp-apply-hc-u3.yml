name: Apply Historias Clinicas U3 payload

on:
  push:
    branches:
      - codex/historias-clinicas-u3-terminologias

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/historias-clinicas-u3-terminologias
          fetch-depth: 0
      - name: Decode, validate and materialize U3
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, shutil
          from pathlib import Path

          root = Path('.')
          parts = sorted((root / '.tmp' / 'hc_u3').glob('part*.b64'))
          assert len(parts) == 9, f'expected 9 parts, got {len(parts)}'
          payload = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          assert len(payload) == 56256, len(payload)
          raw = base64.b64decode(payload, validate=True)
          assert hashlib.sha256(raw).hexdigest() == '47e71d05efe88ed5d40aa578fdd8eb2cc1bf596cb5a49191d2493737e4a18a72'
          data = json.loads(raw.decode('utf-8'))
          assert data['unit'] == 3
          assert data['slug'] == 'terminologias-clinicas'
          assert len(data['theory_sections']) == 5
          assert len(data['glossary']) >= 50
          assert len(data['worked_examples']) >= 5
          assert data['guided_activities'][0]['estimated_time_minutes'] >= 300
          assert len(data['guided_activities'][0]['problems']) >= 24
          assert len(data['sources']) >= 18
          assert all(x['verification_status'] == 'verified_directly' for x in data['sources'])
          rendered = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          source = root / 'data/course_redevelopment/historias-clinicas-terminologias-estandares/units/unit-03.json'
          mirror = root / 'data/generated_units/historias-clinicas-terminologias-estandares/unit-03.json'
          source.write_text(rendered, encoding='utf-8')
          mirror.write_text(rendered, encoding='utf-8')
          assert source.read_bytes() == mirror.read_bytes()
          shutil.rmtree(root / '.tmp' / 'hc_u3')
          (root / '.github/workflows/tmp-apply-hc-u3.yml').unlink()
          PY
      - name: Commit canonical U3 and exact mirror
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Curar Historias Clínicas U3"
          git push origin HEAD:codex/historias-clinicas-u3-terminologias
