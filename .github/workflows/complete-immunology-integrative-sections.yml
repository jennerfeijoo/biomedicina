name: Complete immunology integrative sections

on:
  pull_request:
    paths:
      - '.github/workflows/complete-immunology-integrative-sections.yml'

permissions:
  contents: write

jobs:
  complete:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add third integrative paragraphs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('data/course_redevelopment/inmunologia-inmunopatologia/units')
          additions = {
            1: 'La planificación analítica debe distinguir variación intraindividual, interindividual y técnica. Réplicas técnicas estiman parte del error del método, pero no sustituyen donantes independientes. Los efectos de centro pueden confundirse con grupos clínicos si cada grupo se procesa en un laboratorio diferente. Aleatorizar el orden, balancear placas, incluir referencias compartidas y modelar covariables reducen este riesgo. La interpretación final debe mostrar distribuciones y trayectorias, no solo promedios o porcentajes agregados.',
            2: 'Las intervenciones sobre vías innatas deben evaluarse en más de una salida. Reducir una citocina puede no restaurar fagocitosis, barrera o perfusión, y mejorar un marcador puede desplazar el daño hacia otra ruta. Los experimentos de bloqueo y rescate ayudan a ordenar causalidad, pero requieren dosis, controles y ventanas temporales. En humanos, la heterogeneidad de tratamiento y enfermedad limita inferencias directas desde una asociación transversal.',
            3: 'La diversidad HLA exige diseños poblacionales inclusivos. Un conjunto de epítopos seleccionado en pocas variantes puede cubrir de manera desigual a otras poblaciones. La cobertura debe estimarse con frecuencias alélicas apropiadas y validarse experimentalmente, evitando usar ascendencia como sustituto perfecto del genotipo. En aplicaciones terapéuticas, la pérdida de HLA o de procesamiento puede generar escape, por lo que conviene medir más de una etapa de la ruta.',
            4: 'La calidad de una respuesta B también incluye amplitud y resistencia al cambio antigénico. Anticuerpos muy potentes contra un epítopo variable pueden perder función, mientras una respuesta policlonal puede conservar cobertura. Analizar competencia entre clones, epítopos y funciones ayuda a explicar protección. Sin embargo, la amplitud medida con paneles seleccionados depende de qué variantes y antígenos se incluyan, de modo que el panel y su versión forman parte del resultado.',
            5: 'La integración de fenotipo y clonotipo permite preguntar si un mismo clon cambia de estado o migra entre compartimentos. Esta inferencia exige evitar dobles, contaminación y errores de emparejamiento de cadenas. Los modelos de trayectoria de célula única ordenan estados por similitud y no observan necesariamente el tiempo real. La validación longitudinal, espacial y funcional es necesaria antes de afirmar diferenciación o reversión entre poblaciones.',
            6: 'Los estudios de protección pueden usar diseños de desafío, ensayos clínicos, cohortes o vigilancia, cada uno con supuestos distintos. La exposición no controlada dificulta separar menor susceptibilidad de menor contacto. Los desenlaces graves requieren grandes tamaños y seguimiento. Al comunicar resultados deben presentarse riesgos absolutos, intervalos y periodo, además de medidas relativas, y evitar extrapolar una plataforma, variante o población a otra sin validación.',
            7: 'La evaluación funcional debe priorizar preguntas que cambian la clasificación o la comprensión del defecto. Paneles extensos sin hipótesis aumentan hallazgos incidentales y multiplicidad. Una anomalía reproducida puede seguir siendo secundaria a inflamación, infección o fármacos. Repetir después de estabilización, usar controles por edad y documentar tratamiento mejora interpretación. La comunicación genética debe separar variante, evidencia, incertidumbre y consecuencias familiares potenciales.',
            8: 'Los estudios longitudinales de inmunoterapia deben considerar cambios inducidos por tratamiento y por progresión. Comparar solo respondedores y no respondedores después del inicio puede convertir consecuencias de respuesta en supuestos predictores. Las muestras basales, tiempos predefinidos y modelos que preservan el orden temporal ayudan. Para biomarcadores dinámicos se debe especificar si la decisión se toma antes del tratamiento, durante adaptación o para detectar toxicidad, porque cada uso requiere umbrales y validación diferentes.'
          }

          changed = []
          for number, paragraph in additions.items():
              path = root / f'unit-{number:02d}.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              section = data['theory_sections'][4]
              if paragraph not in section['paragraphs']:
                  section['paragraphs'].append(paragraph)
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  changed.append(str(path))
          print('Completed:', changed)
          PY
      - name: Commit completed sections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/course_redevelopment/inmunologia-inmunopatologia/units
          if git diff --cached --quiet; then
            echo "No section completion required."
            exit 0
          fi
          git commit -m "Complete immunology integrative sections"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
