name: One-shot BMC U6 reference fix

on:
  push:
    branches:
      - codex/biomecanica-medios-continuos-unit-06-academic-quality

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/biomecanica-medios-continuos-unit-06-academic-quality
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply precise bibliographic identity fix
        run: python scripts/fix_bmc_u6_reference_temp.py
      - name: Validate curated U6 and portfolio audit
        run: |
          python -m unittest tests.test_biomecanica_medios_continuos_unit_06_curated
          python scripts/validate_generated_units.py
          python scripts/audit_course_portfolio.py --strict
      - name: Remove one-shot helpers and commit result
        run: |
          rm scripts/fix_bmc_u6_reference_temp.py
          rm .github/workflows/fix-bmc-u6-reference-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix BMC U6 bibliographic identity"
          git push origin HEAD:codex/biomecanica-medios-continuos-unit-06-academic-quality
