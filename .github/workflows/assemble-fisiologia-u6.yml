name: Cleanup temporary Fisiologia U6 payload

on:
  push:
    branches:
      - codex/fisiologia-sistemas-u6-modelos-integradores
    paths:
      - '.github/workflows/assemble-fisiologia-u6.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/fisiologia-sistemas-u6-modelos-integradores
      - name: Remove temporary transfer files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/u6_payload
          rm -f .github/workflows/assemble-fisiologia-u6.yml
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .tmp/u6_payload .github/workflows/assemble-fisiologia-u6.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Retirar transferencia temporal de Fisiologia U6'
          git push origin HEAD:codex/fisiologia-sistemas-u6-modelos-integradores
