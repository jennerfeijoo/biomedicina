name: Curate Bioinstrumentation U5 temporary

on:
  push:
    branches:
      - codex/bioinstrumentacion-unit-05-academic-quality
    paths:
      - 'scripts/curate_bioinstrumentation_u5_temp.py'
      - 'tests/test_bioinstrumentacion_unit_05_curated.py'
      - '.github/workflows/curate-bioinstrumentation-u5-temp.yml'

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: codex/bioinstrumentacion-unit-05-academic-quality

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Curate canonical unit 5
        run: python scripts/curate_bioinstrumentation_u5_temp.py

      - name: Regenerate public site
        run: python scripts/generate_site.py --force --with-units

      - name: Validate academic courses
        run: python scripts/validate_academic_courses.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated units
        run: python scripts/validate_generated_units.py

      - name: Validate previews
        run: python scripts/check_generated_preview.py --limit 8

      - name: Audit public alignment
        run: python scripts/audit_public_unit_alignment.py --strict

      - name: Validate links
        run: python scripts/validate_links.py

      - name: Remove temporary curator
        run: |
          rm scripts/curate_bioinstrumentation_u5_temp.py
          rm .github/workflows/curate-bioinstrumentation-u5-temp.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Curate canonical Bioinstrumentation U5"
          git push origin HEAD:codex/bioinstrumentacion-unit-05-academic-quality

# Retriggered after PR #247 was opened so the validated head is produced synchronously.
