name: Bioinstrumentation U3 Assessment

on:
  pull_request:
    paths:
      - 'data/assessment_implementations/bioinstrumentacion-unit-03.json'
      - 'scripts/bioinstrumentation_u3_assessment.py'
      - 'scripts/validate_bioinstrumentation_u3_assessment.py'
      - '.github/workflows/bioinstrumentation-u3-assessment.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/validate_bioinstrumentation_u3_assessment.py
