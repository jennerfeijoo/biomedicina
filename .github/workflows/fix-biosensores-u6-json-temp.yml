name: One-shot Biosensores U6 JSON repair

on:
  push:
    branches:
      - codex/biosensores-unit-06-academic-quality

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/biosensores-unit-06-academic-quality
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Repair glossary closure and validate unit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('data/course_redevelopment/biosensores/units/unit-06.json'),
              Path('data/generated_units/biosensores/unit-06.json'),
          ]
          needle = '"term": "Conformidad regulatoria"'
          for path in paths:
              lines = path.read_text(encoding='utf-8').splitlines()
              matches = [i for i, line in enumerate(lines) if needle in line]
              assert len(matches) == 1, (path, matches)
              i = matches[0]
              if i + 2 < len(lines) and lines[i + 1].strip() == '}' and lines[i + 2].strip() == '],':
                  del lines[i + 1]
              text = '\n'.join(lines) + '\n'
              data = json.loads(text)
              assert data['unit'] == 6
              path.write_text(text, encoding='utf-8')

          assert paths[0].read_bytes() == paths[1].read_bytes()
          PY
          python tests/test_biosensores_unit_06_curated.py
      - name: Commit repair and self-clean
        run: |
          rm .github/workflows/fix-biosensores-u6-json-temp.yml
          git config user.name "JennerFeijoo"
          git config user.email "65651751+jennerfeijoo@users.noreply.github.com"
          git add -A
          git commit -m "Curate Biosensores U6 content"
          git push origin HEAD:codex/biosensores-unit-06-academic-quality
