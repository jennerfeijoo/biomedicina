name: Temporary isolate Biología del Desarrollo redevelopment

on:
  push:
    branches:
      - agent/biologia-desarrollo-evidence-based

permissions:
  contents: write

jobs:
  isolate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/biologia-desarrollo-evidence-based
          fetch-depth: 0

      - name: Isolate work in progress
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p data/course_redevelopment/biologia-desarrollo/units
          cp data/subjects/biologicas-medicas/biologia-desarrollo.json \
             data/course_redevelopment/biologia-desarrollo/course.json
          cp data/generated_units/biologia-desarrollo/unit-01.json \
             data/course_redevelopment/biologia-desarrollo/units/unit-01.json
          cp data/generated_units/biologia-desarrollo/unit-02.json \
             data/course_redevelopment/biologia-desarrollo/units/unit-02.json
          git checkout origin/main -- \
             data/generated_units/biologia-desarrollo/unit-01.json \
             data/generated_units/biologia-desarrollo/unit-02.json
          rm data/subjects/biologicas-medicas/biologia-desarrollo.json

      - name: Commit isolated redevelopment files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/course_redevelopment/biologia-desarrollo \
                  data/generated_units/biologia-desarrollo/unit-01.json \
                  data/generated_units/biologia-desarrollo/unit-02.json \
                  data/subjects/biologicas-medicas/biologia-desarrollo.json
          git commit -m 'Aislar reconstrucción de Biología del Desarrollo'
          git push
