name: Materialize Synthetic Biology v2

on:
  push:
    branches:
      - agent/rebuild-biologia-sintetica-v2
    paths:
      - 'data/bootstrap/biologia-sintetica-v2/**'
      - '.github/workflows/materialize-biologia-sintetica-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-biologia-sintetica-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-biologia-sintetica-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify and extract academic package
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import io
          import json
          import lzma
          import tarfile
          from pathlib import Path, PurePosixPath

          root = Path.cwd()
          bootstrap = root / 'data' / 'bootstrap' / 'biologia-sintetica-v2'
          manifest = json.loads((bootstrap / 'manifest.json').read_text(encoding='utf-8'))
          parts = sorted(bootstrap.glob('part-*.txt'))

          if len(parts) != int(manifest['chunks']):
              raise RuntimeError(
                  f"Número de fragmentos inválido: {len(parts)}; se esperaban {manifest['chunks']}"
              )

          chunks: list[str] = []
          for index, path in enumerate(parts):
              text = ''.join(path.read_text(encoding='utf-8').split())
              expected_length = int(manifest['chunk_lengths'][index])
              expected_sha = str(manifest['chunk_sha256'][index])
              actual_sha = hashlib.sha256(text.encode('ascii')).hexdigest()
              if len(text) != expected_length:
                  raise RuntimeError(
                      f"{path.name}: longitud {len(text)}; se esperaba {expected_length}"
                  )
              if actual_sha != expected_sha:
                  raise RuntimeError(
                      f"{path.name}: SHA-256 {actual_sha}; se esperaba {expected_sha}"
                  )
              chunks.append(text)
              print(f"[ok] {path.name}: {len(text)} caracteres; sha256={actual_sha}")

          encoded = ''.join(chunks)
          if len(encoded) != int(manifest['base64_chars']):
              raise RuntimeError('Longitud Base64 agregada inválida')
          encoded_sha = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          if encoded_sha != manifest['base64_sha256']:
              raise RuntimeError('SHA-256 Base64 agregado inválido')

          compressed = base64.b64decode(encoded, validate=True)
          if len(compressed) != int(manifest['xz_bytes']):
              raise RuntimeError('Longitud XZ inválida')
          compressed_sha = hashlib.sha256(compressed).hexdigest()
          if compressed_sha != manifest['xz_sha256']:
              raise RuntimeError('SHA-256 XZ inválido')
          if not compressed.startswith(b'\xfd7zXZ\x00'):
              raise RuntimeError('Cabecera XZ inválida')

          raw = lzma.decompress(compressed)
          if len(raw) != int(manifest['tar_bytes']):
              raise RuntimeError('Longitud tar inválida')
          raw_sha = hashlib.sha256(raw).hexdigest()
          if raw_sha != manifest['tar_sha256']:
              raise RuntimeError('SHA-256 tar inválido')

          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:') as archive:
              members = archive.getmembers()
              for member in members:
                  relative = PurePosixPath(member.name)
                  if relative.is_absolute() or '..' in relative.parts:
                      raise RuntimeError(f"Ruta insegura en el paquete: {member.name}")
                  if not (member.isfile() or member.isdir()):
                      raise RuntimeError(f"Tipo de miembro no permitido: {member.name}")
              archive.extractall(root, filter='data')

          print(
              f"[ok] paquete académico: {len(members)} entradas; "
              f"tar_sha256={raw_sha}"
          )
          PY

      - name: Promote coverage from partial to implemented
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path.cwd()
          patch_path = root / 'coverage_patch.json'
          coverage_path = root / 'data' / 'curriculum_coverage' / 'biological-medical.json'
          patch = json.loads(patch_path.read_text(encoding='utf-8'))
          coverage = json.loads(coverage_path.read_text(encoding='utf-8'))

          subject_id = patch['subject_id']
          specification = coverage['courses'].get(subject_id)
          if not isinstance(specification, dict):
              raise RuntimeError(f"No existe matriz curricular para {subject_id}")

          expected_domain_ids = [f'BS-{number:02d}' for number in range(1, 9)]
          actual_domain_ids = [str(item.get('id')) for item in specification.get('core_domains', [])]
          if actual_domain_ids != expected_domain_ids:
              raise RuntimeError(
                  f"Dominios inesperados: {actual_domain_ids}; se esperaban {expected_domain_ids}"
              )

          specification['title'] = patch['title']
          specification['coverage_state'] = patch['coverage_state']
          for key in ('practical_requirements', 'visual_requirements', 'expansion_priorities'):
              specification[key] = patch[key]

          coverage_path.write_text(
              json.dumps(coverage, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          patch_path.unlink()
          print(f"[ok] {subject_id}: cobertura curricular actualizada a implemented")
          PY

      - name: Publish reconstructed course
        run: |
          python scripts/publish_courses.py \
            --subject biologia-sintetica \
            --manifest publication-manifest.json

      - name: Generate public course and indexes
        run: |
          python scripts/generate_site.py \
            --force \
            --subject biologia-sintetica \
            --with-units \
            --force-authored-units
          python scripts/generate_public_indexes.py \
            --manifest publication-manifest.json

      - name: Validate academic structure
        run: |
          python scripts/validate_self_paced_model.py
          python scripts/validate_generated_units.py
          python scripts/audit_course_readiness.py --strict
          python scripts/audit_course_portfolio.py --strict
          python scripts/audit_course_redundancy.py --strict
          python scripts/audit_curriculum_completeness.py --strict
          python scripts/audit_curriculum_expansions.py --strict

      - name: Validate publication contract
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py
          python scripts/publish_courses.py \
            --subject biologia-sintetica \
            --check-public
          python scripts/generate_public_indexes.py \
            --manifest publication-manifest.json \
            --check

      - name: Refresh developed-course audit
        run: |
          python scripts/audit_developed_courses.py \
            --strict \
            --json-output data/course_audits/DEVELOPED_COURSES_AUDIT_2026-07-27.json \
            --markdown-output data/course_audits/DEVELOPED_COURSES_AUDIT_2026-07-27.md

      - name: Remove bootstrap materializer
        run: |
          git rm -r data/bootstrap/biologia-sintetica-v2
          git rm .github/workflows/materialize-biologia-sintetica-v2.yml
          rm -f publication-manifest.json

      - name: Commit final reconstruction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que registrar."
            exit 0
          fi
          git commit -m "Reconstruir Biología Sintética en ocho unidades"
          git push origin HEAD:agent/rebuild-biologia-sintetica-v2
