name: Build advanced unit pages

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  build:
    if: github.event.pull_request.head.ref == 'agent/advanced-unit-renderer' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Complete permanent renderer integration
        run: |
          python scripts/patch_advanced_unit_index.py
          python scripts/patch_authored_unit_audit.py
          python -m py_compile scripts/advanced_unit_renderer.py scripts/generate_site.py \
            scripts/audit_public_unit_alignment.py scripts/enrich_authored_unit_pages.py

      - name: Validate advanced unit sources
        run: python scripts/validate_generated_units.py

      - name: Regenerate public unit pages
        id: generate
        run: |
          python scripts/generate_site.py --force --with-units
          python scripts/enrich_generated_pages.py
          python scripts/enrich_authored_unit_pages.py

      - name: Audit advanced publication
        id: alignment
        continue-on-error: true
        run: |
          mkdir -p audit-artifacts
          python scripts/audit_public_unit_alignment.py \
            --strict \
            --json-output audit-artifacts/public-unit-alignment.json \
            | tee audit-artifacts/public-unit-alignment.txt

      - name: Validate generated links
        id: links
        continue-on-error: true
        run: python scripts/validate_links.py | tee audit-artifacts/link-validation.txt

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-unit-build-diagnostics
          path: audit-artifacts/

      - name: Commit renderer and generated pages
        if: always() && steps.generate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/advanced_unit_renderer.py scripts/generate_site.py \
            scripts/audit_public_unit_alignment.py \
            ciencias-basicas biologicas-medicas ingenieria-biomedica gestion-etica-comunicacion \
            catalogo
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Complete advanced unit publication alignment"
          git push origin HEAD:${{ github.head_ref }}
