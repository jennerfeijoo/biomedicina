name: Publish Biología del Desarrollo

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/publish_biologia_desarrollo.py'
      - 'scripts/validate_generated_units.py'
      - '.github/workflows/publish-biologia-desarrollo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-biologia-desarrollo
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Promote reconstructed course
        run: python scripts/publish_biologia_desarrollo.py

      - name: Validate advanced units
        run: python scripts/validate_generated_units.py

      - name: Generate public course and fourteen unit pages
        run: |
          python scripts/generate_site.py \
            --force \
            --subject biologia-desarrollo \
            --with-units \
            --force-authored-units

      - name: Validate public alignment
        run: python scripts/audit_public_unit_alignment.py --strict

      - name: Validate internal links
        run: python scripts/validate_links.py

      - name: Verify publication contract
        run: python scripts/publish_biologia_desarrollo.py --check-public

      - name: Commit public publication
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/subjects/biologicas-medicas/biologia-desarrollo.json \
            data/generated_courses/biologia-desarrollo.json \
            data/generated_units/biologia-desarrollo \
            biologicas-medicas/biologia-desarrollo
          if git diff --cached --quiet; then
            echo "No hay cambios de publicación."
            exit 0
          fi
          git commit -m "Publish Biología del Desarrollo with 14 units"
          git push origin HEAD:main
