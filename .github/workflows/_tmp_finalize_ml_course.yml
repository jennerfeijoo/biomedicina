name: Finalize ML biomedical course temporary

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          ref: codex/ml-biomedico-course-assessment-integration
          fetch-depth: 0

      - name: Finalize canonical course
        run: python scripts/_tmp_finalize_ml_course.py

      - name: Regenerate public site
        run: python scripts/generate_site.py --force --with-units

      - name: Validate academic course
        run: python scripts/validate_academic_courses.py --course machine-learning-biomedico-validacion-clinica

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated units
        run: python scripts/validate_generated_units.py

      - name: Validate previews
        run: python scripts/check_generated_preview.py --all

      - name: Audit public alignment
        run: python scripts/audit_public_unit_alignment.py --strict

      - name: Validate links
        run: python scripts/validate_links.py --quiet

      - name: Remove temporary finalizer
        run: rm -f scripts/_tmp_finalize_ml_course.py .github/workflows/_tmp_finalize_ml_course.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Integra la evaluación final del curso de ML biomédico"
          for attempt in 1 2 3 4 5; do
            git fetch origin codex/ml-biomedico-course-assessment-integration
            git rebase origin/codex/ml-biomedico-course-assessment-integration || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:codex/ml-biomedico-course-assessment-integration; then
              exit 0
            fi
            sleep 2
          done
          exit 1
