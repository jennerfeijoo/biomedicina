name: Sync Bioinformatics Pages

on:
  push:
    branches:
      - agent/audit-critical-fixes

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/audit-critical-fixes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate Bioinformatics pages
        run: python scripts/generate_site.py --force --with-units

      - name: Commit generated Bioinformatics HTML
        run: |
          files=(
            ingenieria-biomedica/bioinformatica/index.html
            ingenieria-biomedica/bioinformatica/unidades/unidad-02.html
            ingenieria-biomedica/bioinformatica/unidades/unidad-03.html
            ingenieria-biomedica/bioinformatica/unidades/unidad-04.html
            ingenieria-biomedica/bioinformatica/unidades/unidad-05.html
            ingenieria-biomedica/bioinformatica/unidades/unidad-06.html
          )
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate Bioinformatics pages"
          git push origin HEAD:agent/audit-critical-fixes
