name: Bioinstrumentation U4 Audit

on:
  pull_request:
    paths:
      - 'data/editorial_audits/bioinstrumentacion-unit-04.json'
      - 'data/unit_preparation/bioinstrumentacion-unit-04.json'
      - 'data/unit_preparation/bioinstrumentacion-unit-04-blocker-resolution.json'
      - 'data/practice_implementations/bioinstrumentacion-unit-04.json'
      - 'data/assessment_authorizations/bioinstrumentacion-unit-04.json'
      - 'data/assessment_implementations/bioinstrumentacion-unit-04.json'
      - 'docs/pilots/bioinstrumentacion/unit-04/SCIENTIFIC_EDITORIAL_AUDIT.md'
      - 'scripts/validate_bioinstrumentation_u4_audit.py'
      - '.github/workflows/bioinstrumentation-u4-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate Unit 4 audit
        run: python scripts/validate_bioinstrumentation_u4_audit.py
