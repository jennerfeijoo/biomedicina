name: Close canonical Device Development corpus

on:
  push:
    branches:
      - codex/desarrollo-dispositivos-medicos-canonical-closure

permissions:
  contents: write

concurrency:
  group: canonicalize-desarrollo-dispositivos
  cancel-in-progress: false

jobs:
  canonicalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/desarrollo-dispositivos-medicos-canonical-closure
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build and finalize canonical corpus
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f data/courses/desarrollo-dispositivos-medicos/course.json ]]; then
            python scripts/migrate_course_to_canonical.py \
              --subject desarrollo-dispositivos-medicos \
              --course-code DDM
          fi
          python scripts/finalize_desarrollo_dispositivos_canonical_temp.py

      - name: Validate canonical academic content
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_academic_courses.py \
            --course desarrollo-dispositivos-medicos \
            --strict-content
          python -m unittest tests.test_desarrollo_dispositivos_medicos_canonical_course
          python scripts/validate_generated_units.py
          python scripts/validate_curriculum.py
          python scripts/audit_curriculum_completeness.py

      - name: Regenerate public course
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_site.py \
            --force \
            --subject desarrollo-dispositivos-medicos \
            --with-units \
            --force-authored-units
          python scripts/sync_catalog_statuses.py
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Commit canonical course and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/synchronize-generated-site.yml
          git rm -f .github/workflows/canonicalize-desarrollo-dispositivos-temp.yml
          git rm -f scripts/finalize_desarrollo_dispositivos_canonical_temp.py
          git add -A -- \
            .github/workflows/synchronize-generated-site.yml \
            data/courses/desarrollo-dispositivos-medicos \
            data/catalog_statuses.json \
            ingenieria-biomedica/desarrollo-dispositivos-medicos \
            ingenieria-biomedica/index.html \
            catalogo/index.html \
            tests/test_desarrollo_dispositivos_medicos_canonical_course.py
          if git diff --cached --quiet; then
            echo "No canonical DDM changes remain to commit."
            exit 0
          fi
          git commit -m "Close canonical Desarrollo de Dispositivos Médicos course"
          git push origin HEAD:codex/desarrollo-dispositivos-medicos-canonical-closure
