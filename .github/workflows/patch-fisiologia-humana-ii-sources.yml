name: Patch Human Physiology II sources

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/complete-human-physiology-ii' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout course branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diversify sources and regenerate
        run: |
          python scripts/patch_fisiologia_humana_ii_sources.py
          python scripts/generate_site.py --force --with-units
          python scripts/enrich_generated_pages.py
          python scripts/enrich_authored_unit_pages.py

      - name: Validate portfolio and public output
        run: |
          python scripts/validate_generated_units.py
          python scripts/audit_course_portfolio.py --strict
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_units.py
          python scripts/validate_links.py

      - name: Commit source corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated_courses/fisiologia-humana-ii.json \
            data/generated_units/fisiologia-humana-ii/unit-04.json \
            data/generated_units/fisiologia-humana-ii/unit-05.json \
            biologicas-medicas/fisiologia-humana-ii
          if git diff --cached --quiet; then
            echo "Bibliografía ya sincronizada"
            exit 0
          fi
          git commit -m "Diversify Human Physiology II sources"
          git push origin HEAD:${{ github.head_ref }}
