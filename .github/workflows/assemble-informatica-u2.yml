name: Assemble Informatica U2

on:
  push:
    branches:
      - codex/informatica-biomedica-u2-sistemas-clinicos
    paths:
      - '.tmp/informatica_u2_payload/**'
      - '.github/workflows/assemble-informatica-u2.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/informatica-biomedica-u2-sistemas-clinicos
          fetch-depth: 0

      - name: Materialize canonical unit, mirror and regression
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/informatica_u2_payload/part01.txt \
              .tmp/informatica_u2_payload/part02.txt \
              .tmp/informatica_u2_payload/part03.txt \
              .tmp/informatica_u2_payload/part04.txt > /tmp/u2_payload.b64
          test "$(wc -c < /tmp/u2_payload.b64)" -eq 20972
          base64 -d /tmp/u2_payload.b64 > /tmp/u2_payload.tar.gz
          mkdir -p /tmp/u2_payload
          tar -xzf /tmp/u2_payload.tar.gz -C /tmp/u2_payload
          test "$(sha256sum /tmp/u2_payload/unit-02.json | awk '{print $1}')" = "bec7dd1e5a14c7a92ce39ad0ff90954bd3c32b2314e2c39a0d2f62419956c480"
          python -m json.tool /tmp/u2_payload/unit-02.json >/dev/null
          mkdir -p data/course_redevelopment/informatica-biomedica/units
          mkdir -p data/generated_units/informatica-biomedica
          cp /tmp/u2_payload/unit-02.json data/course_redevelopment/informatica-biomedica/units/unit-02.json
          cp /tmp/u2_payload/unit-02.json data/generated_units/informatica-biomedica/unit-02.json
          cp /tmp/u2_payload/test_informatica_biomedica_unit_02_curated.py tests/test_informatica_biomedica_unit_02_curated.py
          cmp data/course_redevelopment/informatica-biomedica/units/unit-02.json data/generated_units/informatica-biomedica/unit-02.json

      - name: Remove transfer artifacts and commit only functional changes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/informatica_u2_payload
          rm -f .github/workflows/assemble-informatica-u2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Curar Informática Biomédica U2"
          git push origin HEAD:codex/informatica-biomedica-u2-sistemas-clinicos
