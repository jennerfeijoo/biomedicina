name: Deduplicate Bioinstrumentation Sources

on:
  pull_request:
    paths:
      - 'data/generated_units/bioinstrumentacion/**'
      - 'scripts/deduplicate_bioinstrumentation_sources.py'
      - '.github/workflows/deduplicate-bioinstrumentation-sources.yml'

permissions:
  contents: write

concurrency:
  group: deduplicate-bioinstrumentation-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deduplicate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove duplicate source URLs
        run: python scripts/deduplicate_bioinstrumentation_sources.py
      - name: Validate portfolio after correction
        run: python scripts/audit_course_portfolio.py --strict
      - name: Commit corrected generated units
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/generated_units/bioinstrumentacion
          if git diff --cached --quiet; then
            echo "No se encontraron fuentes duplicadas."
            exit 0
          fi
          git commit -m "Deduplicate Bioinstrumentation source references"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
