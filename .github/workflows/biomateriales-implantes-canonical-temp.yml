name: Biomateriales e Implantes canonical temp

on:
  push:
    branches:
      - codex/biomateriales-implantes-canonical-closure

permissions:
  contents: write

jobs:
  migrate-close-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: codex/biomateriales-implantes-canonical-closure
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Bootstrap canonical corpus
        run: python scripts/migrate_course_to_canonical.py --subject biomateriales-implantes --course-code BIMPL

      - name: Curate course closure
        run: python scripts/close_biomateriales_implantes_temp.py

      - name: Validate canonical corpus and source architecture
        run: |
          python scripts/validate_academic_courses.py
          python scripts/validate_scientific_traceability.py
          python scripts/validate_generated_units.py
          python scripts/validate_curriculum.py
          python scripts/audit_generic_content.py
          python scripts/audit_curriculum_completeness.py
          python -m unittest tests.test_biomateriales_implantes_canonical

      - name: Regenerate public Biomateriales e Implantes
        run: python scripts/generate_site.py --force --subject biomateriales-implantes --with-units --force-authored-units

      - name: Validate public site
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Remove temporary migration machinery
        run: |
          rm scripts/close_biomateriales_implantes_temp.py
          rm .github/workflows/biomateriales-implantes-canonical-temp.yml
          rm -f global-generation.txt

      - name: Commit canonical closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Close Biomateriales e Implantes canonical course"
          git push origin HEAD:codex/biomateriales-implantes-canonical-closure
