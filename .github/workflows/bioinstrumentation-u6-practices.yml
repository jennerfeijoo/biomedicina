name: Bioinstrumentation U6 Practices

on:
  pull_request:
    paths:
      - "data/practice_implementations/bioinstrumentacion-unit-06.json"
      - "docs/pilots/bioinstrumentacion/unit-06/PRACTICE_IMPLEMENTATION.md"
      - "scripts/validate_bioinstrumentation_u6_practices.py"
      - ".github/workflows/bioinstrumentation-u6-practices.yml"
  push:
    branches: [main]
    paths:
      - "data/practice_implementations/bioinstrumentacion-unit-06.json"
      - "docs/pilots/bioinstrumentacion/unit-06/PRACTICE_IMPLEMENTATION.md"
      - "scripts/validate_bioinstrumentation_u6_practices.py"
      - ".github/workflows/bioinstrumentation-u6-practices.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate synthetic practice contract
        run: python scripts/validate_bioinstrumentation_u6_practices.py
