name: Patch IDB U5 curricular boundary

on:
  push:
    branches:
      - codex/ingenieria-datos-biomedicos-u5-orquestacion-observabilidad
    paths:
      - .github/workflows/patch-idb-u5-boundary.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ingenieria-datos-biomedicos-u5-orquestacion-observabilidad
          fetch-depth: 0
      - name: Correct U5 editorial boundary to U6
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('data/course_redevelopment/ingenieria-datos-biomedicos/units/unit-05.json'),
              Path('data/generated_units/ingenieria-datos-biomedicos/unit-05.json'),
          ]
          old = 'La validación de interoperabilidad, FHIR, terminologías y mappings se reserva para U6.'
          new = 'La seudonimización, minimización, autorización, controles de acceso, documentación contractual y entrega responsable de productos de datos se reservan para U6.'
          for p in paths:
              text = p.read_text(encoding='utf-8')
              assert text.count(old) == 1, (p, text.count(old))
              text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')
          assert paths[0].read_bytes() == paths[1].read_bytes()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/course_redevelopment/ingenieria-datos-biomedicos/units/unit-05.json data/generated_units/ingenieria-datos-biomedicos/unit-05.json
          git diff --cached --exit-code && exit 0 || true
          git commit -m "Alinear aviso editorial de Ingeniería de Datos U5"
          git push origin HEAD:codex/ingenieria-datos-biomedicos-u5-orquestacion-observabilidad
