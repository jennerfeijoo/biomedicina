name: Repair multivariate course source

on:
  push:
    branches:
      - agent/rebuild-analisis-estadistico-multivariado
    paths:
      - 'data/course_redevelopment/analisis-estadistico-multivariado/**'
      - 'scripts/repair_multivariate_course.py'
      - '.github/workflows/repair-multivariate-course.yml'

permissions:
  contents: write

concurrency:
  group: repair-multivariate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic corrections
        run: python scripts/repair_multivariate_course.py
      - name: Commit corrected source
        shell: bash
        run: |
          git add data/course_redevelopment/analisis-estadistico-multivariado/units
          if git diff --cached --quiet; then
            echo 'No hay correcciones pendientes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair multivariate unit density'
          git push origin HEAD:${GITHUB_REF_NAME}
