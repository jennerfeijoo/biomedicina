name: Regenerate Standardized Course Pages

on:
  pull_request:
    branches:
      - agent/audit-critical-fixes

permissions:
  contents: write

jobs:
  regenerate:
    if: github.head_ref == 'agent/standardize-course-unit-navigation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: agent/standardize-course-unit-navigation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate all course and unit pages
        run: |
          python scripts/generate_site.py --force --with-units
          python scripts/enrich_generated_pages.py

      - name: Validate regenerated site
        run: |
          python scripts/validate_curriculum.py
          python scripts/check_generated_preview.py --limit 84
          python scripts/validate_units.py
          python scripts/validate_links.py --quiet
          python scripts/enrich_generated_pages.py --check
          git diff --check

      - name: Commit regenerated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ciencias-basicas biologicas-medicas ingenieria-biomedica gestion-etica-comunicacion
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Regenerate standardized course pages"
          git push origin HEAD:agent/standardize-course-unit-navigation
