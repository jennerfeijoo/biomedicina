name: Temporary ICG canonical course completion

on:
  push:
    branches:
      - codex/ingenieria-clinica-gestion-course-completion

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build canonical course
        run: python scripts/curate_ingenieria_clinica_course_temp.py
      - name: Validate canonical academic corpus
        run: |
          python scripts/validate_academic_courses.py
          python scripts/validate_generated_units.py
          python -m unittest tests.test_ingenieria_clinica_gestion_canonical_course -v
      - name: Generate public course from canonical source
        run: |
          python scripts/generate_site.py --force --subject ingenieria-clinica-gestion --with-units
          python scripts/sync_catalog_statuses.py
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py
      - name: Validate full repository after canonical promotion
        run: |
          python scripts/validate_curriculum.py
          python scripts/audit_curriculum_completeness.py --strict
          python scripts/audit_course_readiness.py --strict
          python scripts/audit_course_bibliography.py --strict
      - name: Remove temporary curator and workflow
        run: |
          rm scripts/curate_ingenieria_clinica_course_temp.py
          rm .github/workflows/temp-icg-course-completion.yml
      - name: Commit canonical course and synchronized public output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Complete canonical Clinical Engineering course"
          git push origin HEAD:codex/ingenieria-clinica-gestion-course-completion
