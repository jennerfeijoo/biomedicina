name: Materialize Neurosensorial U6

on:
  push:
    branches:
      - codex/ingenieria-neurosensorial-u6-validacion-neuroetica
    paths:
      - '.tmp/neurosensorial-u6/**'
      - '.github/workflows/materialize-neurosensorial-u6.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ingenieria-neurosensorial-u6-validacion-neuroetica
          fetch-depth: 0
      - name: Decode and validate canonical unit
        shell: python
        run: |
          import base64, gzip, json
          from pathlib import Path
          parts = sorted(Path('.tmp/neurosensorial-u6').glob('payload*.b64'))
          assert len(parts) == 4, parts
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw = gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          unit = json.loads(raw)
          assert unit['subject_id'] == 'ingenieria-neurosensorial'
          assert unit['unit'] == 6
          assert unit['slug'] == 'validacion-y-neuroetica'
          assert len(unit['theory_sections']) == 5
          assert len(unit['glossary']) >= 50
          assert len(unit['sources']) >= 17
          src = Path('data/course_redevelopment/ingenieria-neurosensorial/units/unit-06.json')
          mirror = Path('data/generated_units/ingenieria-neurosensorial/unit-06.json')
          src.parent.mkdir(parents=True, exist_ok=True)
          mirror.parent.mkdir(parents=True, exist_ok=True)
          src.write_text(raw, encoding='utf-8')
          mirror.write_text(raw, encoding='utf-8')
          assert src.read_bytes() == mirror.read_bytes()
      - name: Remove temporary materializer
        run: |
          rm -rf .tmp/neurosensorial-u6
          rm -f .github/workflows/materialize-neurosensorial-u6.yml
      - name: Commit canonical U6
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m 'Curar Ingeniería Neurosensorial U6'
          git push origin HEAD:codex/ingenieria-neurosensorial-u6-validacion-neuroetica
