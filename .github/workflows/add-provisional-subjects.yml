name: Add provisional biomedical subjects

on:
  push:
    branches:
      - agent/add-provisional-biomedicine-subjects
    paths:
      - .github/workflows/add-provisional-subjects.yml

permissions:
  contents: write

jobs:
  update-curriculum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-provisional-biomedicine-subjects
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add provisional subjects and update homepage
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          curriculum_path = Path('data/citonauta_curriculum.json')
          curriculum = json.loads(curriculum_path.read_text(encoding='utf-8'))

          additions = {
              'ciencias-basicas': [
                  {
                      'id': 'epidemiologia-metodos-investigacion-clinica',
                      'title': 'Epidemiología y Métodos de Investigación Clínica',
                      'path': 'ciencias-basicas/epidemiologia-metodos-investigacion-clinica/index.html',
                      'description': 'Diseños epidemiológicos y métodos de investigación clínica para estudiar frecuencia, asociación, causalidad y validez de evidencia en salud.',
                      'status': 'placeholder',
                      'learning_objectives': [],
                      'modules': [],
                      'key_concepts': [],
                      'biomedical_connection': 'Conecta bioestadística, evidencia clínica, evaluación de intervenciones y validación de tecnologías sanitarias.'
                  }
              ],
              'biologicas-medicas': [
                  {
                      'id': 'inmunologia-inmunopatologia',
                      'title': 'Inmunología e Inmunopatología',
                      'path': 'biologicas-medicas/inmunologia-inmunopatologia/index.html',
                      'description': 'Fundamentos de la respuesta inmunitaria y de sus alteraciones en inflamación, autoinmunidad, inmunodeficiencia, cáncer e infección.',
                      'status': 'placeholder',
                      'learning_objectives': [],
                      'modules': [],
                      'key_concepts': [],
                      'biomedical_connection': 'Integra mecanismos inmunitarios con fisiopatología, diagnóstico, vacunas, inmunoterapia y biomateriales.'
                  },
                  {
                      'id': 'microbiologia-medica-enfermedades-infecciosas',
                      'title': 'Microbiología Médica y Enfermedades Infecciosas',
                      'path': 'biologicas-medicas/microbiologia-medica-enfermedades-infecciosas/index.html',
                      'description': 'Biología de microorganismos de relevancia médica, interacción huésped-patógeno, diagnóstico, resistencia antimicrobiana y vigilancia.',
                      'status': 'placeholder',
                      'learning_objectives': [],
                      'modules': [],
                      'key_concepts': [],
                      'biomedical_connection': 'Conecta microbiología, inmunología, diagnóstico molecular, epidemiología genómica y salud pública.'
                  },
                  {
                      'id': 'farmacologia-farmacocinetica-farmacodinamica',
                      'title': 'Farmacología, Farmacocinética y Farmacodinámica',
                      'path': 'biologicas-medicas/farmacologia-farmacocinetica-farmacodinamica/index.html',
                      'description': 'Mecanismos de acción farmacológica y relaciones entre dosis, exposición, respuesta, variabilidad y seguridad.',
                      'status': 'placeholder',
                      'learning_objectives': [],
                      'modules': [],
                      'key_concepts': [],
                      'biomedical_connection': 'Vincula fisiología, bioquímica, química medicinal, modelado PK/PD y medicina personalizada.'
                  },
                  {
                      'id': 'biomarcadores-diagnostico-molecular',
                      'title': 'Biomarcadores y Diagnóstico Molecular',
                      'path': 'biologicas-medicas/biomarcadores-diagnostico-molecular/index.html',
                      'description': 'Principios de descubrimiento, medición y validación analítica y clínica de biomarcadores y pruebas moleculares.',
                      'status': 'placeholder',
                      'learning_objectives': [],
                      'modules': [],
                      'key_concepts': [],
                      'biomedical_connection': 'Integra muestras biológicas, ómicas, biosensores, utilidad clínica y medicina de precisión.'
                  },
                  {
                      'id': 'omicas-celula-unica-biologia-espacial',
                      'title': 'Ómicas de Célula Única y Biología Espacial',
                      'path': 'biologicas-medicas/omicas-celula-unica-biologia-espacial/index.html',
                      'description': 'Métodos de célula única y análisis espacial para estudiar heterogeneidad, estados celulares y organización tisular.',
                      'status': 'placeholder',
                      'learning_objectives': [],
                      'modules': [],
                      'key_concepts': [],
                      'biomedical_connection': 'Conecta transcriptómica, epigenómica, proteómica espacial, bioinformática y patología molecular.'
                  }
              ],
              'ingenieria-biomedica': [
                  {
                      'id': 'machine-learning-biomedico-validacion-clinica',
                      'title': 'Machine Learning Biomédico y Validación de Modelos Clínicos',
                      'path': 'ingenieria-biomedica/machine-learning-biomedico-validacion-clinica/index.html',
                      'description': 'Desarrollo y evaluación responsable de modelos predictivos biomédicos, con énfasis en validación externa y utilidad clínica.',
                      'status': 'placeholder',
                      'learning_objectives': [],
                      'modules': [],
                      'key_concepts': [],
                      'biomedical_connection': 'Integra datos clínicos, discriminación, calibración, subgrupos, sesgo, seguridad y flujo asistencial.'
                  },
                  {
                      'id': 'biologia-sistemas-modelado-cuantitativo',
                      'title': 'Biología de Sistemas y Modelado Cuantitativo',
                      'path': 'ingenieria-biomedica/biologia-sistemas-modelado-cuantitativo/index.html',
                      'description': 'Modelado mecanístico y computacional de redes moleculares, celulares y fisiológicas como sistemas dinámicos.',
                      'status': 'placeholder',
                      'learning_objectives': [],
                      'modules': [],
                      'key_concepts': [],
                      'biomedical_connection': 'Conecta biología molecular, ecuaciones diferenciales, redes, simulación y validación experimental.'
                  },
                  {
                      'id': 'descubrimiento-computacional-farmacos',
                      'title': 'Descubrimiento Computacional de Fármacos',
                      'path': 'ingenieria-biomedica/descubrimiento-computacional-farmacos/index.html',
                      'description': 'Métodos computacionales para identificar, priorizar y optimizar candidatos terapéuticos y evaluar sus limitaciones.',
                      'status': 'placeholder',
                      'learning_objectives': [],
                      'modules': [],
                      'key_concepts': [],
                      'biomedical_connection': 'Integra química medicinal, estructuras biomoleculares, docking, dinámica, QSAR, ADMET y validación experimental.'
                  }
              ],
              'gestion-etica-comunicacion': [
                  {
                      'id': 'ciencia-regulatoria-calidad-seguridad-tecnologias-medicas',
                      'title': 'Ciencia Regulatoria, Calidad y Seguridad de Tecnologías Médicas',
                      'path': 'gestion-etica-comunicacion/ciencia-regulatoria-calidad-seguridad-tecnologias-medicas/index.html',
                      'description': 'Principios de regulación, calidad, gestión de riesgos, evidencia y vigilancia durante el ciclo de vida de tecnologías médicas.',
                      'status': 'placeholder',
                      'learning_objectives': [],
                      'modules': [],
                      'key_concepts': [],
                      'biomedical_connection': 'Conecta dispositivos, software clínico, validación, seguridad del paciente, gobernanza y seguimiento poscomercialización.'
                  }
              ]
          }

          area_map = {area['id']: area for area in curriculum['areas']}
          for area_id, subjects in additions.items():
              area = area_map[area_id]
              existing = {subject['id'] for subject in area['subjects']}
              for subject in subjects:
                  if subject['id'] not in existing:
                      area['subjects'].append(subject)
              area['subjects'].sort(key=lambda item: item['title'].casefold())

          curriculum_path.write_text(
              json.dumps(curriculum, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )

          homepage_path = Path('index.html')
          homepage = homepage_path.read_text(encoding='utf-8')
          replacements = {
              '84 cursos abiertos de ciencia, tecnología y salud': '94 cursos abiertos de ciencia, tecnología y salud',
              '84 asignaturas abiertas con objetivos, unidades, prácticas, evaluación y recursos.': '94 asignaturas catalogadas en distintos estados de desarrollo, desde contenido pendiente hasta material sujeto a revisión experta.',
              'Explorar las 84 asignaturas': 'Explorar las 94 asignaturas',
              '<li>Biología celular y tisular</li>\n            <li>Genética y bioquímica</li>\n            <li>Fisiología y anatomía</li>': '<li>Biología celular, genética y bioquímica</li>\n            <li>Fisiología, inmunología y fisiopatología</li>\n            <li>Microbiología, farmacología y diagnóstico molecular</li>',
              '<li>Biomecánica y rehabilitación</li>\n            <li>Bioinstrumentación y neurotecnología</li>\n            <li>Modelado, imágenes y salud digital</li>': '<li>Biomecánica, bioinstrumentación y neurotecnología</li>\n            <li>Modelado, imágenes e IA biomédica</li>\n            <li>Biología de sistemas y descubrimiento de fármacos</li>',
              '<li>Gestión y emprendimiento científico</li>\n            <li>Bioética y políticas públicas</li>\n            <li>Comunicación científica y cultura</li>': '<li>Gestión, emprendimiento y comunicación científica</li>\n            <li>Bioética, políticas públicas y ciencia regulatoria</li>\n            <li>Calidad, seguridad e innovación responsable</li>',
              '<li>Matemáticas y estadística aplicada</li>\n            <li>Física, química y biofísica</li>\n            <li>Computación y redes en salud</li>': '<li>Matemáticas, estadística y epidemiología</li>\n            <li>Física, química y biofísica</li>\n            <li>Computación y redes en salud</li>'
          }
          for old, new in replacements.items():
              if old not in homepage:
                  raise SystemExit(f'Homepage pattern not found: {old}')
              homepage = homepage.replace(old, new)
          homepage_path.write_text(homepage, encoding='utf-8')
          PY

      - name: Generate public pages
        run: python scripts/generate_site.py --force

      - name: Validate generated site
        shell: bash
        run: |
          python -m json.tool data/citonauta_curriculum.json >/dev/null
          python scripts/validate_links.py
          python - <<'PY'
          import json
          from pathlib import Path

          curriculum = json.loads(Path('data/citonauta_curriculum.json').read_text(encoding='utf-8'))
          subjects = [subject for area in curriculum['areas'] for subject in area['subjects']]
          assert len(subjects) == 94, len(subjects)
          expected = {
              'inmunologia-inmunopatologia',
              'microbiologia-medica-enfermedades-infecciosas',
              'farmacologia-farmacocinetica-farmacodinamica',
              'epidemiologia-metodos-investigacion-clinica',
              'machine-learning-biomedico-validacion-clinica',
              'biologia-sistemas-modelado-cuantitativo',
              'biomarcadores-diagnostico-molecular',
              'omicas-celula-unica-biologia-espacial',
              'descubrimiento-computacional-farmacos',
              'ciencia-regulatoria-calidad-seguridad-tecnologias-medicas',
          }
          indexed = {subject['id']: subject for subject in subjects}
          assert expected <= indexed.keys()
          for subject_id in expected:
              subject = indexed[subject_id]
              assert subject['status'] == 'placeholder'
              assert Path(subject['path']).is_file(), subject['path']
          assert '94 cursos abiertos' in Path('index.html').read_text(encoding='utf-8')
          PY

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/citonauta_curriculum.json index.html catalogo/index.html ciencias-basicas biologicas-medicas ingenieria-biomedica gestion-etica-comunicacion
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Añadir diez asignaturas provisionales al currículo'
            git push origin HEAD:agent/add-provisional-biomedicine-subjects
          fi