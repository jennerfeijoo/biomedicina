name: Apply editorial truth once

on:
  push:
    branches:
      - agent/bioinstrumentacion-excellence-foundation
    paths:
      - 'scripts/_apply_editorial_truth_patch.py'
      - '.github/workflows/apply-editorial-truth-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/bioinstrumentacion-excellence-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply authoritative editorial-state migration
        run: python scripts/_apply_editorial_truth_patch.py

      - name: Validate permanent sources
        run: |
          python -m py_compile scripts/generate_site.py scripts/validate_pilot_foundations.py
          python scripts/validate_course_plan_packages.py
          python scripts/validate_pilot_foundations.py

      - name: Remove one-time migration helpers
        run: |
          rm scripts/_apply_editorial_truth_patch.py
          rm .github/workflows/apply-editorial-truth-once.yml

      - name: Commit permanent migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce authoritative editorial states"
          git push origin HEAD:agent/bioinstrumentacion-excellence-foundation
