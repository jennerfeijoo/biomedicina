name: Temporary ICG bibliography registry

on:
  push:
    branches:
      - codex/ingenieria-clinica-gestion-course-completion

permissions:
  contents: write

jobs:
  registry:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build bibliography registry from canonical verified sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          src = root / 'data/courses/ingenieria-clinica-gestion/sources.json'
          data = json.loads(src.read_text(encoding='utf-8'))
          out = []
          for source in data['sources']:
              url = str(source.get('url') or '').strip()
              if not url:
                  raise SystemExit(f"Canonical source without stable URL: {source.get('title')}")
              verification = source.get('verification_status')
              if verification != 'verified_directly':
                  raise SystemExit(f"Source is not directly verified: {source.get('title')} -> {verification}")
              organization = source.get('organization') or source.get('authors') or source.get('authors_or_organization')
              if not organization:
                  raise SystemExit(f"Canonical source without author/organization: {source.get('title')}")
              record = {
                  'id': source['id'],
                  'title': source['title'],
                  'authors_or_organization': organization,
                  'organization': organization,
                  'year': source.get('year'),
                  'url': url,
                  'type': source.get('type') or 'fuente académica, técnica o institucional',
                  'verification_status': verification,
                  'locator': source.get('locator') or source.get('why_relevant') or 'Recurso identificado por título y URL estable.',
                  'curricular_function': source.get('why_relevant') or 'Respaldar conceptos, métodos y límites del curso.',
                  'limitations': 'El registro confirma trazabilidad bibliográfica y procedencia; no sustituye revisión disciplinaria humana ni amplía el alcance declarado por la fuente.'
              }
              for key in ('doi', 'pmid'):
                  if source.get(key):
                      record[key] = source[key]
              out.append(record)

          registry = {
              'schema_version': '1.1',
              'subject_id': 'ingenieria-clinica-gestion',
              'title': 'Ingeniería Clínica y Gestión',
              'source_policy': 'Las referencias de U1–U6 se resuelven contra fuentes canónicas verificadas directamente durante la curación disciplinar. El registro deduplica usos repetidos por identificador estable y conserva la separación entre trazabilidad bibliográfica, revisión académica interna y validación humana externa.',
              'consulted_on': '2026-08-24',
              'sources': out,
              'coverage_gaps': []
          }
          target = root / 'data/source_registry/ingenieria-clinica-gestion.json'
          target.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f"Wrote {len(out)} canonical bibliography records")
          PY
      - name: Enforce bibliography resolution and canonical course regression
        run: |
          python scripts/audit_course_bibliography.py --subject-id ingenieria-clinica-gestion --fail-on-exact-duplicates --fail-on-incomplete --fail-on-ambiguous
          python scripts/validate_academic_courses.py
          python -m unittest tests.test_ingenieria_clinica_gestion_course_completion -v
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-icg-bibliography-registry.yml
      - name: Commit permanent bibliography registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/source_registry/ingenieria-clinica-gestion.json .github/workflows/temp-icg-bibliography-registry.yml
          git commit -m "Add canonical Clinical Engineering bibliography registry"
          git push origin HEAD:codex/ingenieria-clinica-gestion-course-completion
