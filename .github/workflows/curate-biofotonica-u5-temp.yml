name: Curate Biofotonica U5 temporary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  curate:
    if: github.head_ref == 'curacion/biofotonica-u5-fototerapia-dosimetria'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Curate source and exact mirror
        run: python scripts/curate_biofotonica_u5_temp.py

      - name: Validate structured curriculum
        run: |
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python -m unittest tests.test_biofotonica_unit_05_curated
          python scripts/validate_curriculum_completeness.py
          python scripts/validate_course_readiness.py

      - name: Regenerate Biofotonica public pages
        run: python scripts/generate_site.py --force --subject biofotonica --with-units --force-authored-units

      - name: Validate public output
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Remove temporary curator machinery
        run: |
          rm -f scripts/curate_biofotonica_u5_temp.py
          rm -f .github/workflows/curate-biofotonica-u5-temp.yml

      - name: Commit curated unit and generated pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Curate Biofotónica U5 academic content"
          git fetch origin "${GITHUB_HEAD_REF}"
          git rebase "origin/${GITHUB_HEAD_REF}"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
