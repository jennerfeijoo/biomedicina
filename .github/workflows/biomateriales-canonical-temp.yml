name: Temporary Biomateriales canonical closure

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  curate:
    if: github.head_ref == 'codex/biomateriales-canonical-closure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build canonical Biomateriales corpus
        run: python scripts/curate_biomateriales_canonical_temp.py

      - name: Complete worked examples from curated self-assessment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          source_dir = root / 'data' / 'course_redevelopment' / 'biomateriales' / 'units'
          canonical_dir = root / 'data' / 'courses' / 'biomateriales' / 'units'
          for number in range(1, 7):
              source = json.loads((source_dir / f'unit-{number:02d}.json').read_text(encoding='utf-8'))
              target_path = canonical_dir / f'unit-{number:02d}.json'
              target = json.loads(target_path.read_text(encoding='utf-8'))
              candidates = source.get('self_assessment', [])
              cursor = 0
              while len(target['examples']) < 5 and cursor < len(candidates):
                  raw = candidates[cursor]
                  cursor += 1
                  question = str(raw.get('question') or '').strip()
                  answer = str(raw.get('answer') or '').strip()
                  reasoning = str(raw.get('reasoning') or '').strip()
                  common_error = str(raw.get('common_error') or '').strip()
                  if not question or not answer:
                      continue
                  index = len(target['examples']) + 1
                  target['examples'].append({
                      'id': f"BIOMAT-U{number:02d}-EX{index:02d}",
                      'title': f"Ejemplo de transferencia {index}",
                      'scenario': question,
                      'reasoning_steps': [reasoning or 'Identificar el concepto y contrastar la afirmación con las condiciones y límites de la unidad.'],
                      'interpretation': answer,
                      'limitations': common_error or 'No extrapolar la respuesta fuera del alcance y las condiciones declaradas en la unidad.'
                  })
              target_path.write_text(json.dumps(target, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Run canonical regression
        run: python -m unittest tests.test_biomateriales_canonical_course -v

      - name: Validate canonical course strictly
        run: python scripts/validate_academic_courses.py --course biomateriales --strict-content

      - name: Validate curriculum and generated units
        run: |
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python scripts/audit_curriculum_completeness.py
          python scripts/audit_course_readiness.py --strict

      - name: Regenerate Biomateriales public site
        run: python scripts/generate_site.py --force --subject biomateriales --with-units

      - name: Synchronize catalog statuses
        run: python scripts/sync_catalog_statuses.py

      - name: Validate public output
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Remove temporary curator
        run: |
          rm scripts/curate_biomateriales_canonical_temp.py
          rm .github/workflows/biomateriales-canonical-temp.yml

      - name: Commit canonical closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build canonical Biomateriales course"
          git push origin HEAD:${{ github.head_ref }}
