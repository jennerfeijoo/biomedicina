name: Bioinstrumentation U6 Assessments

on:
  pull_request:
    paths:
      - 'data/assessment_implementations/bioinstrumentacion-unit-06.json'
      - 'data/assessment_authorizations/bioinstrumentacion-unit-06.json'
      - 'data/practice_implementations/bioinstrumentacion-unit-06.json'
      - 'docs/pilots/bioinstrumentacion/unit-06/ASSESSMENT_IMPLEMENTATION.md'
      - 'scripts/validate_bioinstrumentation_u6_assessments.py'
      - '.github/workflows/bioinstrumentation-u6-assessments.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_bioinstrumentation_u6_assessments.py
