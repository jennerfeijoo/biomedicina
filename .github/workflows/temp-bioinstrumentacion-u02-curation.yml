name: Curate Bioinstrumentation Unit 02 temporary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  curate:
    if: github.head_ref == 'codex/bioinstrumentacion-unit-02-academic-quality'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Integrate authoral Unit 2 into canonical course
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import math
          from pathlib import Path

          ROOT = Path('.')
          COURSE = ROOT / 'data/courses/bioinstrumentacion'
          UNIT_PATH = COURSE / 'units/unit-02.json'
          ASSESSMENT_PATH = COURSE / 'assessments/unit-02.json'
          GLOSSARY_PATH = COURSE / 'glossary.json'
          SOURCES_PATH = COURSE / 'sources.json'
          CLAIMS_PATH = COURSE / 'claims.json'
          AUTHORAL_PATH = ROOT / 'data/course_redevelopment/bioinstrumentacion/units/unit-02.json'
          SOURCE_REGISTRY_PATH = ROOT / 'data/source_registry/bioinstrumentacion-unit-02.json'
          BLOCKER_SOURCES_PATH = ROOT / 'data/source_registry/bioinstrumentacion-unit-02-blockers.json'

          def load(path: Path):
              return json.loads(path.read_text(encoding='utf-8'))

          def dump(path: Path, payload):
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          unit = load(UNIT_PATH)
          authoral = load(AUTHORAL_PATH)

          topics = []
          for ti, section in enumerate(authoral['theory_sections'], start=1):
              topic_id = f'BIOINST-U02-T{ti:02d}'
              equations = []
              for ei, equation in enumerate(section.get('equations', []), start=1):
                  equations.append({
                      'id': f'{topic_id}-B{ei:02d}',
                      'type': 'equation',
                      'latex': equation['latex'],
                      'label': equation.get('meaning', ''),
                      'variables': {str(k): str(v) for k, v in (equation.get('variables') or {}).items()},
                  })
              paragraphs = section.get('paragraphs', [])
              key_points = section.get('key_points', [])
              if len(paragraphs) != len(key_points):
                  raise SystemExit(f'U2 section {ti}: expected one key point per paragraph, got {len(paragraphs)} vs {len(key_points)}')
              subtopics = []
              for si, (paragraph, key_point) in enumerate(zip(paragraphs, key_points), start=1):
                  st_id = f'{topic_id}-ST{si:02d}'
                  subtopics.append({
                      'id': st_id,
                      'title': key_point,
                      'blocks': [{'id': f'{st_id}-B01', 'type': 'paragraph', 'text': paragraph}],
                  })
              topics.append({
                  'id': topic_id,
                  'title': section['heading'],
                  'blocks': equations,
                  'key_points': key_points,
                  'subtopics': subtopics,
              })

          unit['purpose'] = authoral['purpose']
          unit['topics'] = topics
          unit['examples'] = []
          for idx, example in enumerate(authoral.get('worked_examples', []), start=1):
              unit['examples'].append({
                  'id': f'BIOINST-U02-EJ{idx:02d}',
                  'title': example['title'].replace(f'Ejemplo {idx} — ', ''),
                  'scenario': example['scenario'],
                  'reasoning_steps': example['reasoning_steps'],
                  'interpretation': example['interpretation'],
                  'limitations': example['limitations'],
              })

          unit['activities'] = [{
              'id': 'BIOINST-U02-ACT01',
              'title': 'Caracterización y selección de un transductor con controles negativos',
              'purpose': (
                  'Caracterizar una cadena de transducción desde su frontera funcional hasta sus límites estáticos, dinámicos y de carga, '
                  'y seleccionar una alternativa contra requisitos explícitos usando evidencia reproducible en lugar de una única especificación atractiva.'
              ),
              'prerequisite_unit_ids': ['BIOINST-U01'],
              'instructions': [
                  'Define el mensurando, el uso educativo, la frontera funcional y las cantidades de entrada/salida antes de comparar componentes. Separa sensor, transductor, interfaz y acondicionamiento y escribe requisitos de rango, sensibilidad, carga, dinámica, ambiente y evidencia.',
                  'Ejecuta o inspecciona U2-P1 (`generate_bioinstrumentation_u2_static_dataset.py`). Analiza las curvas sintéticas con unidades, intervalo y dirección; identifica patrón dominante y una prueba que podría refutar tu diagnóstico.',
                  'Ejecuta o inspecciona U2-P2 (`generate_bioinstrumentation_u2_dynamic_dataset.py`). Estima `tau` únicamente en el control compatible con primer orden y demuestra por qué retardo puro, sobreimpulso o ausencia de eje temporal invalidan el modelo simple declarado.',
                  'Usa U2-P3 (`audit_bioinstrumentation_u2_datasheets.py`) para comparar NTC, galga y fotodiodo. Mantén separados valores nominales, típicos, máximos, tolerancias y campos no resueltos; añade una ruta de carga eléctrica, térmica, mecánica u óptica.',
                  'Construye una matriz final contra requisitos y formula una recomendación limitada. La selección es una hipótesis de diseño que todavía necesita verificación dentro de la interfaz y cadena integradas; no transfieras especificaciones del componente a seguridad, conformidad o utilidad clínica.'
              ],
              'tasks': [
                  'Clasificar una cadena en sensor, transductor, interfaz, acondicionamiento y salida, proponiendo una frontera alternativa y explicando qué cambia.',
                  'Estimar sensibilidad local y offset de una curva estática con unidades, intervalo y condiciones; explicar dónde la aproximación deja de ser representativa.',
                  'Distinguir linealidad local, saturación, zona muerta e histéresis a partir de evidencia observable, sin usar una sola cifra de ajuste como prueba suficiente.',
                  'Diseñar para cada patrón estático una comprobación que pueda refutar la interpretación inicial y distinguir histéresis de deriva temporal.',
                  'Analizar una respuesta al escalón de primer orden, calcular la fracción de cambio a `tau`, estimar `tau` y vincularla con error dinámico bajo el modelo declarado.',
                  'Rechazar el primer orden simple cuando exista retardo no modelado, sobreimpulso/oscilación o solo datos estáticos; explicar por qué tiempo de respuesta no es sinónimo universal de `tau`.',
                  'Analizar al menos una ruta de carga —divisor por impedancia, autocalentamiento, montaje mecánico o geometría óptica— e identificar la cantidad perturbada y la evidencia faltante.',
                  'Comparar al menos dos candidatos mediante una matriz de requisitos/evidencia y justificar la selección, las compensaciones y las pruebas integradas que aún serían necesarias.'
              ],
              'deliverables': [
                  'Ficha de requisitos y frontera funcional con mensurando, entrada, salida, interfaz y etapas excluidas.',
                  'Informe de U2-P1 con curva, sensibilidad/offset, clasificación de no idealidades, evidencia y pruebas de refutación.',
                  'Informe de U2-P2 con estimación de `tau` solo donde procede, controles negativos y límites del vínculo tiempo-frecuencia.',
                  'Mapa de carga que identifique mecanismo, cantidad perturbada, evidencia necesaria y mitigación propuesta sin presentarla como garantía.',
                  'Auditoría U2-P3 con fuente, versión, condiciones, unidad/categoría de cada especificación y campos no resueltos conservados.',
                  'Matriz final de selección con requisitos priorizados, compensaciones, conclusión limitada y plan de verificación del componente integrado.'
              ],
              'checking_criteria': [
                  'La clasificación funcional se apoya en entrada, salida, interacción y frontera, no en el nombre comercial.',
                  'Toda sensibilidad incluye unidades, intervalo, referencia y condiciones; no se equipara con resolución, exactitud o selectividad.',
                  'Saturación, zona muerta, histéresis, deriva y no linealidad se distinguen mediante patrones y diseños de prueba diferentes.',
                  'Las interpretaciones estáticas incluyen al menos una prueba que podría refutarlas.',
                  '`tau` se estima solo cuando la evidencia es compatible con el modelo simple de primer orden y se declaran condiciones iniciales y dominio.',
                  'El tiempo de respuesta al escalón no se usa como sinónimo universal de `tau` y `f_c=1/(2πtau)` se limita al primer orden lineal y criterio −3 dB.',
                  'La carga se trata como interacción de la cadena y se identifica la cantidad que puede quedar perturbada.',
                  'La auditoría documental distingue nominal, típico, máximo, tolerancia y no resuelto sin convertir una cifra típica en garantía.',
                  'La frecuencia de corte o respuesta de un componente no se presenta automáticamente como ancho de banda de toda la cadena.',
                  'La selección final compara requisitos y evidencia, declara lo que falta y no se presenta como prueba de seguridad, conformidad o utilidad clínica.'
              ],
              'estimated_duration_minutes': 240,
              'status': 'curated_pending_expert_review',
          }]

          # Merge verified U2 source dossiers into the canonical registry.
          canonical_sources = load(SOURCES_PATH)
          source_by_id = {s['id']: s for s in canonical_sources['sources']}
          source_ids_u2 = []
          for registry_path in (SOURCE_REGISTRY_PATH, BLOCKER_SOURCES_PATH):
              registry = load(registry_path)
              for src in registry['sources']:
                  # Do not duplicate the alternate blocker IDs for sources already represented by U2's main registry.
                  if src['id'] in {'vim3-step-response-4-23-u2-blocker', 'jcgm-gum-6-u2-blocker'}:
                      continue
                  sid = src['id']
                  record = source_by_id.get(sid, {})
                  record.update({
                      'id': sid,
                      'title': src['title'],
                      'organization': src.get('organization'),
                      'url': src.get('url'),
                      'type': record.get('type') or 'fuente técnica o metrológica',
                      'verification_status': src.get('verification_status', 'verified_directly'),
                      'locator': src.get('locator'),
                      'curricular_function': record.get('curricular_function') or 'Sustentar definiciones, límites de modelo, caracterización o comparación documental de la Unidad 2.',
                      'limitations': src.get('limitations'),
                      'used_by_unit_ids': sorted(set((record.get('used_by_unit_ids') or []) + ['BIOINST-U02'])),
                  })
                  source_by_id[sid] = record
                  source_ids_u2.append(sid)
          original_order = [s['id'] for s in canonical_sources['sources']]
          canonical_sources['sources'] = [source_by_id[sid] for sid in original_order]
          for sid in source_ids_u2:
              if sid not in original_order:
                  canonical_sources['sources'].append(source_by_id[sid])
          canonical_sources['consulted_on'] = '2026-08-23'
          dump(SOURCES_PATH, canonical_sources)
          source_ids_u2 = list(dict.fromkeys(source_ids_u2))
          unit['source_ids'] = source_ids_u2
          unit['status']['sources'] = 'traceable'

          # Verify the 12 canonical glossary entries for U2 from the historical glossary and source dossier.
          glossary = load(GLOSSARY_PATH)
          entries = {entry['id']: entry for entry in glossary['entries']}
          authoral_glossary = {entry['term'].casefold(): entry['definition'] for entry in authoral['glossary']}
          glossary_specs = {
              'BIOINST-GLO-013': ('sensor', ['vim3-sensor-3-8'], [('vim3-sensor-3-8', 'VIM3 entry 3.8 and examples')], 'verified_directly'),
              'BIOINST-GLO-014': ('transductor de medición', ['vim3-transducer-3-7'], [('vim3-transducer-3-7', 'VIM3 entry 3.7 and examples')], 'verified_directly'),
              'BIOINST-GLO-015': ('interfaz', ['jcgm-gum-6-2020-u2'], [('jcgm-gum-6-2020-u2', 'Clauses 5.3, 5.6–5.8 and 6.1–6.6; model boundary context')], 'verified_contextually'),
              'BIOINST-GLO-016': ('sensibilidad', ['vim3-sensitivity-4-12'], [('vim3-sensitivity-4-12', 'VIM3 entry 4.12 and notes 1–2')], 'verified_directly'),
              'BIOINST-GLO-017': ('offset', ['jcgm-gum-6-2020-u2'], [('jcgm-gum-6-2020-u2', 'Clauses on model terms, corrections and reference conditions')], 'verified_contextually'),
              'BIOINST-GLO-018': ('saturación', ['jcgm-gum-6-2020-u2'], [('jcgm-gum-6-2020-u2', 'Clauses on model adequacy, omitted effects and domain')], 'verified_contextually'),
              'BIOINST-GLO-019': ('histéresis', ['jcgm-gum-6-2020-u2'], [('jcgm-gum-6-2020-u2', 'Clauses on model adequacy and relevant effects')], 'verified_contextually'),
              'BIOINST-GLO-020': ('zona muerta', ['jcgm-gum-6-2020-u2'], [('jcgm-gum-6-2020-u2', 'Clauses on model adequacy and domain of use')], 'verified_contextually'),
              'BIOINST-GLO-021': ('deriva', ['jcgm-gum-6-2020-u2'], [('jcgm-gum-6-2020-u2', 'Clauses on conditions, model effects and adequacy')], 'verified_contextually'),
              'BIOINST-GLO-022': ('carga', ['ni-strain-gage-loading-u2', 'vishay-ntclg100e2103jb-datasheet', 'hamamatsu-s5821-03-product'], [('ni-strain-gage-loading-u2', 'Sections on bridge, conductors and signal conditioning'), ('vishay-ntclg100e2103jb-datasheet', 'response time, thermal time constant and dissipation factor'), ('hamamatsu-s5821-03-product', 'measurement conditions, capacitance and cutoff frequency')], 'verified_contextually'),
              'BIOINST-GLO-023': ('constante de tiempo', ['vim3-step-response-4-23', 'jcgm-gum-6-2020-u2'], [('vim3-step-response-4-23', 'VIM3 entry 4.23; distinction from response-time criterion'), ('jcgm-gum-6-2020-u2', 'model assumptions and domain')], 'verified_contextually'),
              'BIOINST-GLO-024': ('rango', ['jcgm-gum-6-2020-u2'], [('jcgm-gum-6-2020-u2', 'Clauses on model domain and adequacy')], 'verified_contextually'),
          }
          for gid, (term_key, sids, locators, status) in glossary_specs.items():
              entry = entries[gid]
              if term_key not in authoral_glossary:
                  raise SystemExit(f'Missing authoral glossary term: {term_key}')
              entry['definition'] = authoral_glossary[term_key]
              entry['source_ids'] = sids
              entry['verification_status'] = status
              entry['source_locators'] = [{'source_id': sid, 'locator': locator} for sid, locator in locators]
          dump(GLOSSARY_PATH, glossary)

          # Case-based assessment derived from the already implemented U2 assessment contracts.
          assessment = {
              '$schema': '../../../../schemas/academic/assessment-v1.schema.json',
              'schema_version': '1.0',
              'id': 'BIOINST-U02-EVAL',
              'course_id': 'bioinstrumentacion',
              'scope': 'unit',
              'unit_id': 'BIOINST-U02',
              'purpose': 'Evaluar clasificación funcional, caracterización estática, diagnóstico de no idealidades, dinámica de primer orden, carga y selección basada en requisitos mediante casos nuevos y controles negativos.',
              'student_payload_policy': 'En una aplicación dinámica, answer_key y feedback se excluyen del payload inicial del estudiante; las pistas posteriores deben orientar hacia evidencia y pruebas de refutación sin revelar de inmediato la clasificación esperada.',
              'items': [],
              'status': 'curated_pending_expert_review',
          }

          def make_item(qid, prompt, los, difficulty, cognitive, expected, explanation, misconceptions, correct, incorrect, sources):
              return {
                  'id': qid,
                  'type': 'case_analysis',
                  'prompt': prompt,
                  'linked_learning_outcome_ids': los,
                  'difficulty': difficulty,
                  'cognitive_level': cognitive,
                  'answer_key': {
                      'expected_answer': expected,
                      'explanation': explanation,
                      'common_misconceptions': misconceptions,
                  },
                  'feedback': {'correct': correct, 'incorrect': incorrect},
                  'source_ids': sources,
                  'status': 'curated_pending_expert_review',
              }

          assessment['items'] = [
              make_item(
                  'BIOINST-U02-Q01',
                  'Una galga resistiva está adherida a una viga, forma parte de un puente de Wheatstone y después se conecta a un amplificador. Clasifica sensor, transductor, interfaz y acondicionamiento para una frontera que termina en ΔR/R y para otra que termina en tensión de puente. Explica por qué el nombre comercial no decide la clasificación.',
                  ['BIOINST-U02-LO01'], 'intermediate', 'analyze',
                  'La rejilla es el elemento directamente afectado por la deformación transferida. Con frontera hasta ΔR/R, la galga actúa como transductor deformación→cambio relativo de resistencia y el adhesivo/montaje pertenece a la interfaz. Si la frontera se amplía hasta el puente, el conjunto incluye excitación y resistencias y la salida pasa a ser tensión; el amplificador sigue siendo acondicionamiento si queda fuera. La clasificación depende de entrada, salida, interacción y frontera.',
                  'Sensor y transductor pueden coincidir en una pieza práctica, pero no son sinónimos universales. Una frontera alternativa es válida solo si declara qué incluye y qué cantidad sale del bloque.',
                  ['Llamar sensor a todo el sistema.', 'Clasificar por el nombre del catálogo.', 'Ocultar excitación y puente al ampliar la frontera.'],
                  'La respuesta conserva las cantidades de entrada/salida y hace explícita la frontera funcional.',
                  'Dibuja primero la ruta deformación→rejilla→resistencia→puente→tensión y decide en qué nodo termina cada frontera.',
                  ['vim3-sensor-3-8', 'vim3-transducer-3-7', 'ni-strain-gage-loading-u2']
              ),
              make_item(
                  'BIOINST-U02-Q02',
                  'En el intervalo x=0…2 unidades, un transductor entrega y=0,20; 2,20; 4,20 V para x=0;1;2 bajo las mismas condiciones. Estima sensibilidad y offset, indica unidades y dominio y explica por qué esos dos parámetros no prueban linealidad global, resolución ni exactitud.',
                  ['BIOINST-U02-LO02'], 'intermediate', 'apply',
                  'La pendiente en el intervalo es 2,0 V por unidad de x y el offset respecto de x=0 es 0,20 V. La conclusión solo corresponde a x=0…2 y a las condiciones declaradas. Sensibilidad, resolución, exactitud, selectividad y linealidad global son propiedades distintas y requieren evidencia propia.',
                  'Una sensibilidad solo es interpretable con variables, unidades, intervalo, referencia y condiciones. Tres puntos compatibles con una recta no autorizan extrapolación fuera del dominio.',
                  ['Tratar 2 V/unidad como propiedad universal.', 'Llamar resolución a la pendiente.', 'Suponer exactitud porque el ajuste local es lineal.'],
                  'Has calculado los parámetros y, más importante, has limitado correctamente su dominio.',
                  'Escribe primero la relación y=Kx+b y luego anota junto a K el intervalo y las condiciones donde fue estimada.',
                  ['vim3-sensitivity-4-12', 'jcgm-gum-6-2020-u2']
              ),
              make_item(
                  'BIOINST-U02-Q03',
                  'Cuatro curvas sintéticas muestran: A) pendiente local aproximadamente constante; B) pendiente decreciente y meseta en extremos; C) salida ideal constante cerca de cero y recuperación fuera; D) dos ramas reproducibles para la misma entrada según el sentido del barrido. Clasifica los cuatro patrones y propón una prueba que pueda refutar cada diagnóstico.',
                  ['BIOINST-U02-LO03'], 'advanced', 'analyze',
                  'A: linealidad local, que puede refutarse extendiendo el intervalo. B: saturación, cuya interpretación se contrasta extendiendo rango o cambiando ganancia/bloque. C: zona muerta, que se audita con mayor resolución alrededor de cero y pendiente local. D: histéresis, que se contrasta repitiendo e invirtiendo el barrido o ajustando ramas separadas. La evidencia debe conservar dirección, orden e intervalo.',
                  'Los patrones no ideales requieren diseños distintos. Una sola curva agregada o un R² alto puede ocultar dependencia del rango o de la trayectoria.',
                  ['Confundir zona muerta con resolución.', 'Llamar ruido a dos ramas reproducibles.', 'Inferir el bloque causal solo por la forma de la curva.'],
                  'La clasificación incluye evidencia y una estrategia falsable, no solo etiquetas.',
                  'Para cada curva escribe qué observación la caracteriza y qué nueva observación te obligaría a cambiar de diagnóstico.',
                  ['jcgm-gum-6-2020-u2', 'vim3-sensitivity-4-12']
              ),
              make_item(
                  'BIOINST-U02-Q04',
                  'Un sensor se barre arriba y abajo y presenta dos ramas separadas para la misma entrada. En un segundo experimento, con entrada fija, su salida cambia lentamente durante 40 minutos. ¿Qué fenómeno domina en cada caso y qué diseño mínimo usarías para evitar confundirlos?',
                  ['BIOINST-U02-LO03'], 'intermediate', 'analyze',
                  'La separación dependiente del sentido del barrido es compatible con histéresis; el cambio lento con entrada y condiciones nominalmente constantes es compatible con deriva. Para distinguirlos deben registrarse dirección/orden/ciclos en el primer caso y tiempo/repeticiones/condiciones en el segundo; ambos pueden coexistir.',
                  'Histéresis codifica historia o trayectoria; deriva codifica evolución temporal. Un protocolo que omite dirección o tiempo hace ambas interpretaciones ambiguas.',
                  ['Llamar deriva a cualquier diferencia entre ramas.', 'Llamar histéresis a cualquier cambio temporal.', 'Analizar datos sin conservar orden de adquisición.'],
                  'La respuesta vincula cada patrón con la variable experimental que debe conservarse.',
                  'Pregunta si el cambio depende principalmente de la dirección de la entrada o del tiempo transcurrido con entrada fija.',
                  ['jcgm-gum-6-2020-u2']
              ),
              make_item(
                  'BIOINST-U02-Q05',
                  'Un control sintético sigue `tau·dy/dt + y = Kx + b` con `tau=2,0 s` y recibe un escalón. Calcula aproximadamente qué fracción del cambio final se espera a t=2,0 s y la frecuencia de corte −3 dB del modelo. Explica por qué ni el tiempo de respuesta del componente ni el ancho de banda de una cadena real deben igualarse automáticamente a esos dos números.',
                  ['BIOINST-U02-LO04'], 'advanced', 'apply',
                  f'A una constante de tiempo se espera 1−exp(−1)≈0,632, es decir ~63,2 % del cambio. Para el primer orden lineal, f_c=1/(2πtau)=~{1/(2*math.pi*2):.3f} Hz. El tiempo de respuesta depende de un criterio de asentamiento especificado y una cadena real puede añadir retardos, polos, ceros, carga o acondicionamiento; por eso estas relaciones se limitan al modelo declarado.',
                  'La relación temporal y el punto −3 dB derivan del modelo de primer orden, no de una definición universal de sensor.',
                  ['Igualar siempre tiempo de respuesta y tau.', 'Usar f_c del componente como ancho de banda del sistema.', 'Omitir condiciones iniciales y modelo.'],
                  'El cálculo es correcto y la interpretación permanece dentro del modelo que lo hace válido.',
                  'Separa dos preguntas: qué predice la ecuación ideal y qué evidencia necesitarías para afirmar que un componente o cadena sigue esa ecuación.',
                  ['vim3-step-response-4-23', 'jcgm-gum-6-2020-u2', 'vishay-ntclg100e2103jb-datasheet']
              ),
              make_item(
                  'BIOINST-U02-Q06',
                  'Decide si el modelo simple de primer orden debe aceptarse o rechazarse en tres controles: A) la salida permanece plana 0,4 s antes de iniciar la transición; B) supera el valor final y oscila antes de asentarse; C) solo existe una tabla estacionaria entrada–salida sin eje temporal. Justifica cada decisión y di qué información falta.',
                  ['BIOINST-U02-LO04'], 'advanced', 'evaluate',
                  'El primer orden simple declarado se rechaza en los tres: A contiene un retardo no modelado; B muestra sobreimpulso/oscilación incompatible con una respuesta simple monotónica; C no contiene información temporal para identificar dinámica. Rechazar el modelo simple no prueba qué modelo alternativo es correcto.',
                  'Los controles negativos impiden aceptar un modelo por parecido superficial. Un modelo simplificado debe declarar efectos omitidos y dominio de adecuación.',
                  ['Forzar una tau aunque haya retardo.', 'Ajustar un primer orden a una respuesta con sobreimpulso.', 'Inferir dinámica desde una curva estática.'],
                  'Has usado evidencia incompatible para rechazar el modelo simple sin sobreidentificar un modelo alternativo.',
                  'Busca primero qué supuesto del primer orden simple viola cada control: inicio inmediato, monotonía o existencia de un eje temporal.',
                  ['jcgm-gum-6-2020-u2', 'vim3-step-response-4-23']
              ),
              make_item(
                  'BIOINST-U02-Q07',
                  'Una fuente de 100 kΩ se conecta primero a una entrada de 100 kΩ y luego a una de 10 MΩ. Calcula la fracción de tensión conservada en ambos casos y explica qué demuestra este ejemplo sobre carga. Después da un ejemplo análogo térmico, mecánico u óptico y señala la evidencia que faltaría.',
                  ['BIOINST-U02-LO03', 'BIOINST-U02-LO05'], 'advanced', 'apply',
                  'Con 100 kΩ de entrada se conserva 100/(100+100)=0,50 de la tensión ideal. Con 10 MΩ se conserva 10 000/(10 000+100)≈0,990, ~99,0 %. La medición puede modificar la cantidad observada por interacción. Un análogo válido es autocalentamiento de un termistor (requiere potencia, montaje y medio), masa/rigidez añadida por una galga (requiere montaje y respuesta mecánica) o cadena óptica (requiere longitud de onda, geometría, ambiente y amplificador).',
                  'La carga no es exclusivamente eléctrica: toda medición intercambia energía o información y el mecanismo debe modelarse para la interfaz concreta.',
                  ['Suponer que alta impedancia significa carga cero.', 'Ignorar autocalentamiento.', 'Presentar una mitigación propuesta como garantía.'],
                  'El cálculo muestra cuantitativamente la perturbación y la transferencia conserva el mecanismo y la evidencia faltante.',
                  'Identifica primero qué cantidad del objeto o la interfaz puede cambiar porque el sistema de medición está presente.',
                  ['ni-strain-gage-loading-u2', 'vishay-ntclg100e2103jb-datasheet', 'hamamatsu-s5821-03-product']
              ),
              make_item(
                  'BIOINST-U02-Q08',
                  'Debes seleccionar entre un termistor NTC, una galga y un fotodiodo para tres cadenas educativas diferentes. Explica cómo construirías la matriz de selección y por qué no es válido escoger simplemente el componente con mayor sensibilidad o frecuencia de corte. Incluye cómo tratarías valores típicos, máximos y un factor de galga no resuelto.',
                  ['BIOINST-U02-LO05', 'BIOINST-U02-LO01', 'BIOINST-U02-LO02'], 'advanced', 'create',
                  'La matriz parte de requisitos comparables: cantidad de entrada/salida, rango, sensibilidad, selectividad, carga, dinámica, ambiente, alimentación, integración, calibrabilidad y evidencia. Cada especificación conserva unidad, condición y categoría (nominal/típica/máxima/tolerancia/no resuelta). Un valor típico no es garantía y un campo no resuelto debe permanecer como evidencia faltante. La elección es una hipótesis que necesita prueba en la cadena integrada.',
                  'La documentación del componente solo es comparable cuando se normalizan significado y condiciones. Una cifra destacada no resume los compromisos de integración.',
                  ['Elegir siempre la mayor sensibilidad.', 'Convertir un valor típico en mínimo garantizado.', 'Inventar el factor de galga faltante.', 'Transferir frecuencia de corte del fotodiodo a toda la cadena.'],
                  'La selección está gobernada por requisitos y evidencia, no por una métrica única.',
                  'Construye primero columnas de requisitos y categorías de evidencia; solo después coloca los valores de cada candidato.',
                  ['vishay-ntclg100e2103jb-datasheet', 'micro-measurements-cea-06-125una-350', 'hamamatsu-s5821-03-product', 'jcgm-gum-6-2020-u2']
              ),
          ]
          dump(ASSESSMENT_PATH, assessment)

          # Literal claims use authoral key points so traceability validator can locate them verbatim in the unit.
          section_source = {
              1: 'vim3-sensor-3-8',
              2: 'vim3-sensitivity-4-12',
              3: 'jcgm-gum-6-2020-u2',
              4: 'ni-strain-gage-loading-u2',
              5: 'vim3-step-response-4-23',
              6: 'jcgm-gum-6-2020-u2',
          }
          claims_payload = load(CLAIMS_PATH)
          claims = [claim for claim in claims_payload.get('claims', []) if claim.get('unit_id') != 'BIOINST-U02']
          u2_claim_ids = []
          counter = 0
          for section_index, section in enumerate(authoral['theory_sections'], start=1):
              sid = section_source.get(section_index, 'jcgm-gum-6-2020-u2')
              for key_point in section.get('key_points', []):
                  counter += 1
                  cid = f'BIOINST-U02-C{counter:03d}'
                  lowered = key_point.casefold()
                  claim_type = 'interpretation_boundary' if any(token in lowered for token in (' no ', 'no ', 'sinónimo', 'no existe', 'no sustituye')) else 'methodological_requirement'
                  risk = 'high' if any(token in lowered for token in ('clínic', 'garant', 'sistema completo', 'universal')) else 'medium'
                  claims.append({
                      'claim_id': cid,
                      'unit': 2,
                      'text': key_point,
                      'claim_type': claim_type,
                      'risk': risk,
                      'context': 'Aplicado a caracterización y selección educativa de transductores; el resultado concreto depende de la frontera, las condiciones, el modelo, la interfaz y el uso previsto.',
                      'source_id': sid,
                      'locator': {'section': section['heading']},
                      'support': 'direct' if sid.startswith('vim3-') else 'indirect',
                      'source_verification_status': 'verified_directly',
                      'review_state': 'ai_review_provisional',
                      'reviewer_validation_id': None,
                      'reviewed_at': '2026-08-23',
                      'id': cid,
                      'unit_id': 'BIOINST-U02',
                  })
                  u2_claim_ids.append(cid)
          claims_payload['scope'] = 'Afirmaciones centrales de Bioinstrumentación con fuente y localizador; Unidades 1–2 integradas y revisión disciplinaria humana pendiente.'
          claims_payload['review_state'] = 'ai_review_provisional'
          claims_payload['claims'] = claims
          dump(CLAIMS_PATH, claims_payload)
          unit['claim_ids'] = u2_claim_ids

          unit['editorial_notice'] = (
              'Contenido educativo canónico integrado desde la fuente autoral histórica y las prácticas/evaluaciones técnicas U2 ya existentes. '
              'La revisión disciplinaria humana sigue pendiente y el paquete histórico mantiene sus estados originales; esta curación no autoriza '
              'prácticas con personas, validación de dispositivos, seguridad, conformidad ni utilidad clínica. Procedencia: '
              'data/course_redevelopment/bioinstrumentacion/units/unit-02.json, data/practice_implementations/bioinstrumentacion-unit-02.json, '
              'data/assessment_implementations/bioinstrumentacion-unit-02.json y data/review_handoffs/bioinstrumentacion-unit-02.json.'
          )
          dump(UNIT_PATH, unit)
          PY

      - name: Regenerate public site
        run: python scripts/generate_site.py --force --with-units

      - name: Validate academic courses
        run: python scripts/validate_academic_courses.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate Bioinstrumentation migration
        run: |
          python scripts/preflight_bioinstrumentation_atomic_migration.py
          python scripts/validate_bioinstrumentation_public_canonical.py

      - name: Validate generated units
        run: python scripts/validate_generated_units.py

      - name: Validate previews
        run: python scripts/check_generated_preview.py --all

      - name: Audit public alignment
        run: python scripts/audit_public_unit_alignment.py --strict

      - name: Validate links
        run: python scripts/validate_links.py

      - name: Remove temporary curator
        run: rm -f .github/workflows/temp-bioinstrumentacion-u02-curation.yml

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Curate canonical Bioinstrumentation Unit 2"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
