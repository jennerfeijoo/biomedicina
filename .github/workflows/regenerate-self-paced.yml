name: Regenerate self-paced pages

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Regenerate published pages
        run: python scripts/generate_site.py --force --with-units

      - name: Validate generated diff
        run: git diff --check

      - name: Commit generated outputs when needed
        run: |
          if git diff --quiet; then
            echo "Generated outputs are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Synchronize self-paced generated pages"
          git push origin "HEAD:${{ github.head_ref }}"
