name: Bioinstrumentation U5 Scientific Editorial Audit

on:
  pull_request:
    paths:
      - "data/editorial_audits/bioinstrumentacion-unit-05.json"
      - "docs/pilots/bioinstrumentacion/unit-05/AUDIT.md"
      - "scripts/validate_bioinstrumentation_u5_audit.py"
      - ".github/workflows/bioinstrumentation-u5-audit.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/validate_bioinstrumentation_u5_audit.py
