name: Bioinstrumentation Public Canonical

on:
  pull_request:
    paths:
      - 'data/subjects/ingenieria-biomedica/bioinstrumentacion.json'
      - 'data/generated_courses/bioinstrumentacion.json'
      - 'data/generated_units/bioinstrumentacion/**'
      - 'data/course_migrations/bioinstrumentacion-public-canonical-v1.json'
      - 'data/course_redevelopment/bioinstrumentacion/units/**'
      - 'scripts/validate_bioinstrumentation_public_canonical.py'
      - 'scripts/preflight_bioinstrumentation_atomic_migration.py'
      - 'docs/audits/bioinstrumentacion/ATOMIC_MIGRATION_PLAN.md'
      - '.github/workflows/bioinstrumentation-public-canonical.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify preserved legacy state
        run: python scripts/preflight_bioinstrumentation_atomic_migration.py
      - name: Validate canonical public course
        run: python scripts/validate_bioinstrumentation_public_canonical.py
