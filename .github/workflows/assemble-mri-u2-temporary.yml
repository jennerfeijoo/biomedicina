name: Assemble MRI U2 temporary

on:
  push:
    branches:
      - codex/imagenes-biomedicas-avanzadas-i-u2-mri

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/imagenes-biomedicas-avanzadas-i-u2-mri
          fetch-depth: 0

      - name: Assemble and validate curated MRI U2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import io
          import json
          import tarfile

          root = Path('.tmp/mri_u2')
          names = ['part01', 'fix02a', 'fix02b', 'part03', 'part04', 'part05', 'part06', 'part07']
          expected = [4000, 2000, 2000, 4000, 4000, 4000, 4000, 36]
          parts = [(root / name).read_text(encoding='utf-8').strip() for name in names]
          actual = [len(part) for part in parts]
          if actual != expected:
              raise SystemExit(f'Longitudes de payload inválidas: {actual} != {expected}')
          if sum(actual) != 24036:
              raise SystemExit(f'Longitud total inválida: {sum(actual)}')

          raw = base64.b64decode(''.join(parts), validate=True)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as archive:
              unit_member = archive.extractfile('unit-02.json')
              test_member = archive.extractfile('test_u2.py')
              if unit_member is None or test_member is None:
                  raise SystemExit('El payload no contiene los dos artefactos esperados')
              unit = unit_member.read().decode('utf-8')
              test = test_member.read().decode('utf-8')

          data = json.loads(unit)
          assert data['schema_version'] == '2.0'
          assert data['subject_id'] == 'imagenes-biomedicas-avanzadas-i'
          assert data['unit'] == 2
          assert data['slug'] == 'mri-avanzada'
          assert 'concepto de la unidad que debe definirse mediante entidades observables' not in unit.casefold()
          assert len(data['theory_sections']) == 5
          assert len(data['sources']) >= 15

          source = Path('data/course_redevelopment/imagenes-biomedicas-avanzadas-i/units/unit-02.json')
          mirror = Path('data/generated_units/imagenes-biomedicas-avanzadas-i/unit-02.json')
          test_path = Path('tests/test_imagenes_biomedicas_avanzadas_i_unit_02_curated.py')
          source.write_text(unit, encoding='utf-8')
          mirror.write_text(unit, encoding='utf-8')
          test_path.write_text(test, encoding='utf-8')
          if source.read_bytes() != mirror.read_bytes():
              raise SystemExit('Fuente y espejo no son idénticos')
          compile(test, str(test_path), 'exec')
          print(f'MRI U2 validada: {len(unit)} caracteres; prueba={len(test)} caracteres')
          PY

      - name: Remove temporary transfer mechanism
        shell: bash
        run: |
          rm -rf .tmp/mri_u2
          rm -f .github/workflows/assemble-mri-u2-temporary.yml

      - name: Commit curated MRI U2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Curar MRI avanzada U2 y retirar transferencia temporal"
          git push origin HEAD:codex/imagenes-biomedicas-avanzadas-i-u2-mri
