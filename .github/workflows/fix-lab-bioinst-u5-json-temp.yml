name: Fix Lab Bioinstrumentation U5 JSON temp

on:
  push:
    branches:
      - codex/laboratorio-bioinstrumentacion-unit-05-academic-quality

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/laboratorio-bioinstrumentacion-unit-05-academic-quality
          fetch-depth: 0
      - name: Repair JSON and verify mirror
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('data/course_redevelopment/laboratorio-bioinstrumentacion/units/unit-05.json'),
              Path('data/generated_units/laboratorio-bioinstrumentacion/unit-05.json'),
          ]
          old = '"correction": "No afirmar seguridad eléctrica, EMC o uso humano sin procesos y ensayos específicos."\n  ],'
          new = '"correction": "No afirmar seguridad eléctrica, EMC o uso humano sin procesos y ensayos específicos."}\n  ],'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one repair target, found {text.count(old)}')
              text = text.replace(old, new)
              json.loads(text)
              path.write_text(text, encoding='utf-8')
          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit('source and generated mirror diverged')
          PY
      - name: Self-clean and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-lab-bioinst-u5-json-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix Laboratorio Bioinstrumentación U5 JSON"
          git push origin HEAD:codex/laboratorio-bioinstrumentacion-unit-05-academic-quality
