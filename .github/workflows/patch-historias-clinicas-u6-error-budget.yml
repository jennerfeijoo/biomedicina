name: Patch Historias Clinicas U6 error budget

on:
  push:
    branches:
      - codex/historias-clinicas-u6-implementacion-validacion

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/historias-clinicas-u6-implementacion-validacion
          fetch-depth: 0
      - name: Add structured operational equation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('data/course_redevelopment/historias-clinicas-terminologias-estandares/units/unit-06.json')
          mirror = Path('data/generated_units/historias-clinicas-terminologias-estandares/unit-06.json')
          data = json.loads(source.read_text(encoding='utf-8'))
          section = data['theory_sections'][3]

          paragraph = (
              'Un criterio operacional cuantitativo útil es el presupuesto de error asociado a un SLO de disponibilidad. '
              'Si A_SLO es la fracción objetivo de disponibilidad durante una ventana T_window, el tiempo máximo de indisponibilidad '
              'compatible con ese objetivo es T_error=(1-A_SLO)T_window. Por ejemplo, 99.9 % durante 30 días deja 0.001×30 días = '
              '0.03 días = 43.2 minutos de presupuesto. El cálculo solo traduce un objetivo operacional previamente acordado; no '
              'demuestra seguridad clínica, calidad semántica ni autorización de producción.'
          )
          if paragraph not in section['paragraphs']:
              section['paragraphs'].insert(5, paragraph)

          equation = {
              'latex': 'T_{error}=(1-A_{SLO})T_{window}',
              'meaning': 'Tiempo máximo de indisponibilidad compatible con un objetivo de disponibilidad dentro de una ventana definida.',
              'variables': {
                  'T_{error}': 'presupuesto de tiempo de indisponibilidad',
                  'A_{SLO}': 'fracción objetivo de disponibilidad entre 0 y 1',
                  'T_{window}': 'duración de la ventana de observación'
              }
          }
          section['equations'] = [equation]
          key_point = 'El error budget traduce un SLO de disponibilidad en tiempo de indisponibilidad permitido.'
          if key_point not in section['key_points']:
              section['key_points'].append(key_point)

          rendered = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          source.write_text(rendered, encoding='utf-8')
          mirror.write_text(rendered, encoding='utf-8')

          test_path = Path('tests/test_historias_clinicas_unit_06_curated.py')
          test_text = test_path.read_text(encoding='utf-8')
          if 'def test_structured_error_budget_equation' not in test_text:
              marker = '\n\nif __name__ == "__main__":\n'
              addition = '''\n    def test_structured_error_budget_equation(self) -> None:\n        section = self.unit["theory_sections"][3]\n        equations = section.get("equations", [])\n        self.assertEqual(len(equations), 1)\n        equation = equations[0]\n        self.assertEqual(equation["latex"], "T_{error}=(1-A_{SLO})T_{window}")\n        self.assertIn("indisponibilidad", equation["meaning"].casefold())\n        self.assertEqual(set(equation["variables"]), {"T_{error}", "A_{SLO}", "T_{window}"})\n        text = " ".join(section["paragraphs"]).casefold()\n        self.assertIn("43.2 minutos", text)\n        self.assertIn("no demuestra seguridad clínica", text)\n'''
              if marker not in test_text:
                  raise SystemExit('No se encontró el marcador final del test')
              test_text = test_text.replace(marker, addition + marker)
              test_path.write_text(test_text, encoding='utf-8')

          assert source.read_bytes() == mirror.read_bytes()
          json.loads(source.read_text(encoding='utf-8'))
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-historias-clinicas-u6-error-budget.yml
          git add data/course_redevelopment/historias-clinicas-terminologias-estandares/units/unit-06.json \
                  data/generated_units/historias-clinicas-terminologias-estandares/unit-06.json \
                  tests/test_historias_clinicas_unit_06_curated.py
          git commit -m 'Añadir error budget estructurado a Historias Clínicas U6'
          git push origin HEAD:codex/historias-clinicas-u6-implementacion-validacion
