name: Diagnose Innovacion U1
on:
  push:
    branches: [codex/innovacion-emprendimiento-u1-necesidades]
    paths: [.github/workflows/diagnose-innovacion-u1.yml]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/innovacion-emprendimiento-u1-necesidades
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture exact regression failure
        shell: bash
        run: |
          set +e
          python -m unittest -v tests.test_innovacion_emprendimiento_unit_01_curated > /tmp/innovacion-u1-test.log 2>&1
          rc=$?
          set -e
          mkdir -p .tmp
          cp /tmp/innovacion-u1-test.log .tmp/innovacion-u1-test.log
          printf '\nEXIT_CODE=%s\n' "$rc" >> .tmp/innovacion-u1-test.log
          rm .github/workflows/diagnose-innovacion-u1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capturar diagnóstico de regresión Innovación U1"
          git push origin HEAD:codex/innovacion-emprendimiento-u1-necesidades
