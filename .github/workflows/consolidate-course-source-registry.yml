name: Consolidate course source registry

on:
  push:
    branches:
      - agent/biologia-desarrollo-evidence-based
    paths:
      - 'scripts/consolidate_course_source_registry.py'
      - '.github/workflows/consolidate-course-source-registry.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/biologia-desarrollo-evidence-based
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidate and validate registry
        run: |
          python scripts/consolidate_course_source_registry.py \
            --subject-id biologia-desarrollo \
            --write
          python scripts/consolidate_course_source_registry.py \
            --subject-id biologia-desarrollo \
            --check
          python scripts/audit_course_bibliography.py \
            --subject-id biologia-desarrollo \
            --fail-on-exact-duplicates \
            --fail-on-incomplete \
            --fail-on-ambiguous
          git diff --check
      - name: Commit consolidated registry
        run: |
          if git diff --quiet; then
            echo 'No consolidation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/source_registry
          git commit -m 'Consolidate developmental biology source registry'
          git push origin HEAD:agent/biologia-desarrollo-evidence-based
