name: Bioinstrumentation U5 Authoral Draft

on:
  pull_request:
    paths:
      - "data/course_redevelopment/bioinstrumentacion/units/unit-05.json"
      - "data/editorial_audits/bioinstrumentacion-unit-05.json"
      - "docs/pilots/bioinstrumentacion/unit-05/AUTHORAL_DRAFT.md"
      - "scripts/validate_bioinstrumentation_u5_authoral.py"
      - ".github/workflows/bioinstrumentation-u5-authoral.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/validate_bioinstrumentation_u5_authoral.py
