name: Materialize pending courses

on:
  pull_request:
    paths:
      - 'scripts/generate_fisiologia_i_bioinformatica_redevelopment.py'
      - 'scripts/recover_fisiologia_bioinformatica_package.py'
      - 'scripts/build_missing_bioinformatica_redevelopment.py'
      - 'data/bootstrap/fisiologia-bioinformatica/**'
      - '.github/workflows/materialize-pending-courses.yml'
  push:
    branches:
      - agent/complete-fisiologia-i-bioinformatica
    paths:
      - 'scripts/generate_fisiologia_i_bioinformatica_redevelopment.py'
      - 'scripts/recover_fisiologia_bioinformatica_package.py'
      - 'scripts/build_missing_bioinformatica_redevelopment.py'
      - 'data/bootstrap/fisiologia-bioinformatica/**'
      - '.github/workflows/materialize-pending-courses.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-pending-courses
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-fisiologia-i-bioinformatica
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize academic source packages
        id: materialize
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/recover_fisiologia_bioinformatica_package.py \
            2>&1 | tee materializer-diagnostic.txt

      - name: Upload materializer diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pending-courses-materializer-diagnostic
          path: |
            materializer-diagnostic.txt
            partial-recovery/
          if-no-files-found: error

      - name: Enforce materialization
        if: steps.materialize.outcome != 'success'
        run: |
          cat materializer-diagnostic.txt
          exit 1

      - name: Promote both courses
        run: |
          python scripts/publish_courses.py \
            --subject fisiologia-humana-i \
            --subject bioinformatica \
            --manifest publication-manifest.json

      - name: Validate advanced units
        run: python scripts/validate_generated_units.py

      - name: Generate public pages
        run: |
          python scripts/generate_site.py \
            --force \
            --subject fisiologia-humana-i \
            --with-units \
            --force-authored-units
          python scripts/generate_site.py \
            --force \
            --subject bioinformatica \
            --with-units \
            --force-authored-units
          python scripts/generate_public_indexes.py \
            --manifest publication-manifest.json

      - name: Validate publication
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py
          python scripts/publish_courses.py \
            --subject fisiologia-humana-i \
            --subject bioinformatica \
            --check-public
          python scripts/generate_public_indexes.py \
            --manifest publication-manifest.json \
            --check

      - name: Audit curriculum and portfolio
        run: |
          python scripts/audit_course_portfolio.py --strict
          python scripts/audit_developed_courses.py \
            --strict \
            --json-output data/course_audits/DEVELOPED_COURSES_AUDIT_2026-07-27.json \
            --markdown-output data/course_audits/DEVELOPED_COURSES_AUDIT_2026-07-27.md

      - name: Remove temporary materializer
        run: |
          git rm scripts/generate_fisiologia_i_bioinformatica_redevelopment.py
          git rm scripts/recover_fisiologia_bioinformatica_package.py
          git rm scripts/build_missing_bioinformatica_redevelopment.py
          git rm -r data/bootstrap/fisiologia-bioinformatica
          git rm .github/workflows/materialize-pending-courses.yml
          rm -rf partial-recovery
          rm -f materializer-diagnostic.txt publication-manifest.json

      - name: Commit source and public courses
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que registrar."
            exit 0
          fi
          git commit -m "Completar Fisiología Humana I y Bioinformática"
          git push origin HEAD:agent/complete-fisiologia-i-bioinformatica
