name: CitoNauta Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-generated-units:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Run generated-unit validation
        id: unit_validation
        continue-on-error: true
        run: python3 scripts/validate_generated_units.py > generated-unit-validation.txt 2>&1

      - name: Upload generated-unit validation report
        if: steps.unit_validation.outcome != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: generated-unit-validation
          path: generated-unit-validation.txt

      - name: Enforce generated-unit validation
        if: steps.unit_validation.outcome != 'success'
        run: |
          cat generated-unit-validation.txt
          exit 1

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate curriculum data
        run: python scripts/validate_curriculum.py

      - name: Enforce self-paced learning model
        run: python scripts/validate_self_paced_model.py

      - name: Validate catalog discovery
        run: python scripts/validate_catalog.py

      - name: Validate prerequisite graph
        run: python scripts/validate_prerequisite_graph.py

      - name: Validate incremental course plans
        run: python scripts/validate_course_plan_packages.py

      - name: Validate excellence pilot foundations
        run: python scripts/validate_pilot_foundations.py

      - name: Validate pilot unit preparation
        run: python scripts/validate_pilot_unit_preparation.py

      - name: Validate generated units
        run: python scripts/validate_generated_units.py

      - name: Validate every course architecture
        run: |
          set -euo pipefail
          for course in data/generated_courses/*.json; do
            python -m json.tool "$course" > /dev/null
          done

      - name: Enforce course readiness
        run: python scripts/audit_course_readiness.py --strict

      - name: Run cross-course portfolio audit
        id: portfolio_audit
        continue-on-error: true
        run: |
          mkdir -p audit-artifacts
          python scripts/audit_course_portfolio.py \
            --strict \
            --json-output audit-artifacts/course-portfolio-audit.json \
            > audit-artifacts/course-portfolio-audit.txt 2>&1

      - name: Upload course portfolio audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: course-portfolio-audit
          path: audit-artifacts/

      - name: Enforce course portfolio audit
        if: steps.portfolio_audit.outcome != 'success'
        run: |
          cat audit-artifacts/course-portfolio-audit.txt
          exit 1

      - name: Validate developed-unit renderer
        run: node --check assets/js/generated-units.js

      - name: Validate course renderer
        run: node --check assets/js/course.js

      - name: Validate catalog renderer
        run: node --check assets/js/catalog.js

      - name: Validate prerequisite-map renderer
        run: node --check assets/js/prerequisite-map.js

      - name: Validate autonomous course content
        run: python scripts/validate_agent_content.py

      - name: Check generated preview
        run: python scripts/check_generated_preview.py --limit 8

      - name: Check enriched HTML synchronization
        run: python scripts/enrich_generated_pages.py --check

      - name: Check generator dry run
        run: python scripts/generate_site.py --dry-run --with-units

      - name: Validar cobertura lectiva por unidades
        run: python scripts/validate_units.py

      - name: Validate internal links
        run: python scripts/validate_links.py
