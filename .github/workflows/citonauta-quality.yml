name: CitoNauta Quality Gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate all sources, scientific evidence, tests and reproducibility
        run: python scripts/run_quality.py --report-dir "${RUNNER_TEMP}/citonauta-quality"
      - name: Verify committed generated files
        run: git diff --exit-code
      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: citonauta-quality
          path: ${{ runner.temp }}/citonauta-quality
