name: Bioinstrumentation U4 Preparation

on:
  pull_request:
    paths:
      - "data/unit_preparation/bioinstrumentacion-unit-04.json"
      - "data/source_registry/bioinstrumentacion-unit-04.json"
      - "docs/pilots/bioinstrumentacion/unit-04/AUTHORING_READINESS.md"
      - "scripts/validate_bioinstrumentation_u4_preparation.py"
      - ".github/workflows/bioinstrumentation-u4-preparation.yml"
  push:
    branches: [main]
    paths:
      - "data/unit_preparation/bioinstrumentacion-unit-04.json"
      - "data/source_registry/bioinstrumentacion-unit-04.json"
      - "docs/pilots/bioinstrumentacion/unit-04/AUTHORING_READINESS.md"
      - "scripts/validate_bioinstrumentation_u4_preparation.py"
      - ".github/workflows/bioinstrumentation-u4-preparation.yml"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/validate_bioinstrumentation_u4_preparation.py
