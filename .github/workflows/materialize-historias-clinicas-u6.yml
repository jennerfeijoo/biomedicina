name: Materialize Historias Clinicas U6

on:
  push:
    branches:
      - codex/historias-clinicas-u6-implementacion-validacion
    paths:
      - '.tmp/historias_clinicas_u6/**'
      - '.github/workflows/materialize-historias-clinicas-u6.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/historias-clinicas-u6-implementacion-validacion
          fetch-depth: 0
      - name: Verify and materialize payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, json, tarfile

          root = Path('.')
          parts = [root / f'.tmp/historias_clinicas_u6/payload.part{i:02d}' for i in range(1, 6)]
          payload = ''.join(p.read_text(encoding='utf-8') for p in parts)
          assert len(payload) == 23696, len(payload)
          assert hashlib.sha256(payload.encode()).hexdigest() == '5076a4b63d175b785b274450efaaa59c8e1913e0f2b62a78798125184e651786'
          raw = base64.b64decode(payload)
          with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tf:
              unit = tf.extractfile('unit-06.json').read().decode('utf-8')
              test = tf.extractfile('test_historias_clinicas_unit_06_curated.py').read().decode('utf-8')
          parsed = json.loads(unit)
          assert parsed['subject_id'] == 'historias-clinicas-terminologias-estandares'
          assert parsed['unit'] == 6
          source = root / 'data/course_redevelopment/historias-clinicas-terminologias-estandares/units/unit-06.json'
          mirror = root / 'data/generated_units/historias-clinicas-terminologias-estandares/unit-06.json'
          test_path = root / 'tests/test_historias_clinicas_unit_06_curated.py'
          source.write_text(unit, encoding='utf-8')
          mirror.write_text(unit, encoding='utf-8')
          test_path.write_text(test, encoding='utf-8')
          assert source.read_bytes() == mirror.read_bytes()
          PY
          python -m unittest tests.test_historias_clinicas_unit_06_curated -v
      - name: Commit canonical U6 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/course_redevelopment/historias-clinicas-terminologias-estandares/units/unit-06.json \
                  data/generated_units/historias-clinicas-terminologias-estandares/unit-06.json \
                  tests/test_historias_clinicas_unit_06_curated.py
          if git diff --cached --quiet; then
            echo 'No materialization changes required.'
          else
            git commit -m 'Curación académica de Historias Clínicas U6'
            git push origin HEAD:codex/historias-clinicas-u6-implementacion-validacion
          fi
