name: Materialize pharmacology course

on:
  push:
    branches:
      - agent/rebuild-farmacologia-farmacocinetica-farmacodinamica
    paths:
      - '.github/workflows/materialize-pharmacology-course.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/materialize-pharmacology-course.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/rebuild-farmacologia-farmacocinetica-farmacodinamica
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble verified base64 package
        id: assemble
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee materialization-diagnostic.txt
          from pathlib import Path

          root = Path('.github/materialize-pharmacology')
          names = [
              'part00.b64', 'part01.b64', 'part02.b64', 'part03.b64',
              'part04.b64', 'part05.b64', 'part05b0.b64', 'part05b1.b64',
              'part05b2.b64', 'part05c.b64', 'part05d.b64', 'part06.b64',
          ]
          chunks = []
          for name in names:
              path = root / name
              print('checking', path, 'exists=', path.exists())
              if not path.exists():
                  raise FileNotFoundError(path)
              value = path.read_text(encoding='utf-8')
              print(name, len(value))
              chunks.append(value)

          final_path = root / 'part07.b64'
          print('checking', final_path, 'exists=', final_path.exists())
          if not final_path.exists():
              raise FileNotFoundError(final_path)
          final_value = final_path.read_text(encoding='utf-8')
          print('part07.b64', len(final_value))
          if len(final_value) != 244:
              raise ValueError(f'part07 debe contener 244 caracteres; contiene {len(final_value)}')
          corrected_final = final_value[:220] + final_value[228:]
          if len(corrected_final) != 236:
              raise ValueError('la reparación determinista de part07 no produjo 236 caracteres')

          assembled = ''.join(chunks) + corrected_final
          output = Path('/tmp/pharm.b64')
          output.write_text(assembled, encoding='utf-8')
          print('assembled_length', len(assembled))
          PY
          wc -c /tmp/pharm.b64 2>&1 | tee -a materialization-diagnostic.txt
          sha256sum /tmp/pharm.b64 2>&1 | tee -a materialization-diagnostic.txt
      - name: Upload materialization diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmacology-materialization-diagnostic
          path: materialization-diagnostic.txt
          if-no-files-found: error
      - name: Enforce assembly
        if: steps.assemble.outcome != 'success'
        run: |
          cat materialization-diagnostic.txt
          exit 1
      - name: Verify complete base64 hash
        run: echo 'd2349fedddaf81aac9d7d7a26203b268a632b9c877d2865f59f020c83a506a1c  /tmp/pharm.b64' | sha256sum -c -
      - name: Decode course archive
        run: base64 --decode /tmp/pharm.b64 > /tmp/pharm.tgz
      - name: Verify course archive hash
        run: echo '64b69f297daaf5e861554b66bcd2b22a06d540e9f3f77ba57c6465514de22b0b  /tmp/pharm.tgz' | sha256sum -c -
      - name: Extract course archive
        run: tar -xzf /tmp/pharm.tgz -C .
      - name: Validate materialized JSON package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          subject = 'farmacologia-farmacocinetica-farmacodinamica'
          package = Path('data/course_redevelopment') / subject
          expected = [package / 'course.json'] + [
              package / 'units' / f'unit-{number:02d}.json'
              for number in range(1, 9)
          ]
          expected += [
              Path('data/curriculum_decisions') / f'{subject}.json',
              Path('data/curriculum_coverage') / f'{subject}-2026.json',
          ]
          for path in expected:
              if not path.exists():
                  raise FileNotFoundError(path)
              data = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(data, dict):
                  raise ValueError(f'{path}: la raíz no es un objeto')
              print('OK', path)
          units = sorted((package / 'units').glob('unit-*.json'))
          if len(units) != 8:
              raise ValueError(f'se esperaban 8 unidades y se encontraron {len(units)}')
          PY
      - name: Remove temporary materialization files
        run: |
          rm -rf .github/materialize-pharmacology
          rm -f .github/workflows/materialize-pharmacology-course.yml
          rm -f materialization-diagnostic.txt
      - name: Commit course package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize pharmacology course package'
          git push origin HEAD:agent/rebuild-farmacologia-farmacocinetica-farmacodinamica
