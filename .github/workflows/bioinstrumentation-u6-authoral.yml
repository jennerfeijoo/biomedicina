name: Bioinstrumentation U6 Authoral Draft

on:
  pull_request:
    paths:
      - 'data/course_redevelopment/bioinstrumentacion/units/unit-06.json'
      - 'docs/pilots/bioinstrumentacion/unit-06/AUTHORAL_DRAFT.md'
      - 'scripts/validate_bioinstrumentation_u6_authoral.py'
      - '.github/workflows/bioinstrumentation-u6-authoral.yml'
      - 'data/editorial_audits/bioinstrumentacion-unit-06.json'
      - 'data/practice_implementations/bioinstrumentacion-unit-06.json'
      - 'data/assessment_implementations/bioinstrumentacion-unit-06.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate authoral draft
        run: python scripts/validate_bioinstrumentation_u6_authoral.py
