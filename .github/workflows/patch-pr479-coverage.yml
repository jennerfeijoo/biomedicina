name: Patch PR479 coverage metric

on:
  push:
    branches:
      - codex/historias-clinicas-u6-implementacion-validacion

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/historias-clinicas-u6-implementacion-validacion
          fetch-depth: 0
      - name: Add traceable coverage metric and regression
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('data/course_redevelopment/historias-clinicas-terminologias-estandares/units/unit-06.json')
          mirror = Path('data/generated_units/historias-clinicas-terminologias-estandares/unit-06.json')
          test = Path('tests/test_historias_clinicas_unit_06_curated.py')

          data = json.loads(source.read_text(encoding='utf-8'))
          section = data['theory_sections'][0]
          marker = 'cobertura trazable de requisitos'
          paragraph = (
              'Una medida descriptiva útil es la cobertura trazable de requisitos: la proporción de requisitos verificables que cuentan '
              'con al menos una prueba ejecutada y enlazada a evidencia. Deben publicarse numerador y denominador, no solo el porcentaje, '
              'porque excluir requisitos no verificables o contar varias pruebas del mismo requisito cambia la interpretación. Alcanzar '
              '100 % de cobertura trazable no demuestra que las pruebas sean suficientes, que todos los caminos estén cubiertos ni que la '
              'implementación sea conforme, interoperable o clínicamente válida.'
          )
          if not any(marker in p.casefold() for p in section['paragraphs']):
              section['paragraphs'].insert(5, paragraph)
          eq = {
              'latex': r'\\mathrm{Cobertura}_{req}=\\frac{N_{req\\,con\\,prueba\\,ejecutada}}{N_{req\\,verificables}}',
              'meaning': 'Proporción descriptiva de requisitos verificables con al menos una prueba ejecutada y trazada; no es una medida de conformidad global ni de validez clínica.'
          }
          equations = section.setdefault('equations', [])
          if not any('Cobertura' in item.get('latex', '') for item in equations):
              equations.append(eq)

          activity = data['guided_activities'][0]
          problem = ('Calcula la cobertura trazable de requisitos como N de requisitos verificables con al menos una prueba ejecutada dividido '
                     'por N de requisitos verificables; informa numerador y denominador y explica por qué 100 % no demuestra conformidad global.')
          if not any(marker in p.casefold() for p in activity['problems']):
              activity['problems'].insert(4, problem)
          criterion = ('La cobertura trazable declara numerador y denominador y no se interpreta como conformidad, interoperabilidad ni validez clínica global.')
          if not any(marker in p.casefold() for p in activity['checking_criteria']):
              activity['checking_criteria'].insert(4, criterion)

          rendered = json.dumps(data, ensure_ascii=False, indent=2) + '\n'
          source.write_text(rendered, encoding='utf-8')
          mirror.write_text(rendered, encoding='utf-8')

          text = test.read_text(encoding='utf-8')
          anchor = '    def test_publication_is_synchronized(self) -> None:\n'
          method = '''    def test_traceable_requirement_coverage_is_quantified_without_overclaim(self) -> None:\n        equations = [eq for section in self.unit["theory_sections"] for eq in section.get("equations", [])]\n        self.assertTrue(any("Cobertura" in eq.get("latex", "") for eq in equations))\n        first = json.dumps(self.unit["theory_sections"][0], ensure_ascii=False).casefold()\n        self.assertIn("cobertura trazable de requisitos", first)\n        self.assertIn("100 % de cobertura trazable no demuestra", first)\n        activity = self.unit["guided_activities"][0]\n        joined = " ".join(activity["problems"] + activity["checking_criteria"]).casefold()\n        self.assertIn("cobertura trazable", joined)\n        self.assertIn("numerador", joined)\n        self.assertIn("denominador", joined)\n\n'''
          if 'test_traceable_requirement_coverage_is_quantified_without_overclaim' not in text:
              if anchor not in text:
                  raise SystemExit('test anchor not found')
              text = text.replace(anchor, method + anchor, 1)
              test.write_text(text, encoding='utf-8')

          assert source.read_bytes() == mirror.read_bytes()
          json.loads(source.read_text(encoding='utf-8'))
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/patch-pr479-coverage.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Añade cobertura trazable a Historias Clínicas U6'
          git push origin HEAD:codex/historias-clinicas-u6-implementacion-validacion
