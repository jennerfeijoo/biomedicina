name: Bioinstrumentation U4 Final Audit

on:
  pull_request:
    paths:
      - "data/final_authoral_audits/bioinstrumentacion-unit-04.json"
      - "data/course_redevelopment/bioinstrumentacion/units/unit-04.json"
      - "data/practice_implementations/bioinstrumentacion-unit-04.json"
      - "data/assessment_implementations/bioinstrumentacion-unit-04.json"
      - "docs/pilots/bioinstrumentacion/unit-04/FINAL_AUTHORAL_AUDIT.md"
      - "scripts/validate_bioinstrumentation_u4_final_audit.py"
      - ".github/workflows/bioinstrumentation-u4-final-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_bioinstrumentation_u4_final_audit.py
