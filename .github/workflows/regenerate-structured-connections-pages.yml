name: Regenerate structured connections pages

on:
  push:
    branches:
      - agent/fix-biomedical-connections-rendering
    paths:
      - assets/js/generated-units.js
      - scripts/advanced_unit_renderer.py
      - .github/workflows/regenerate-structured-connections-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-structured-connections-pages
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-biomedical-connections-rendering
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate deterministic public pages
        run: |
          python scripts/generate_site.py --force --with-units
          python scripts/enrich_generated_pages.py
          python scripts/enrich_authored_unit_pages.py

      - name: Reject technical object representations
        run: |
          if grep -R -F -n --include='*.html' "[object Object]" .; then
            echo "Se detectó una representación técnica en HTML."
            exit 1
          fi
          if grep -R -F -n --include='*.html' "{&#x27;topic&#x27;:" .; then
            echo "Se detectó un diccionario Python en HTML."
            exit 1
          fi

      - name: Commit regenerated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "No hay páginas por actualizar."
            exit 0
          fi
          git commit -m "Regenerar páginas con conexiones biomédicas legibles"
          git push origin HEAD:agent/fix-biomedical-connections-rendering
