name: Temporary sync Fisiología Humana II

on:
  push:
    branches:
      - agent/rebuild-fisiologia-humana-ii

permissions:
  contents: write

jobs:
  sync-generated-pages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-fisiologia-humana-ii

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate deterministic public pages
        run: |
          python scripts/generate_site.py --force --with-units
          python scripts/enrich_generated_pages.py
          python scripts/enrich_authored_unit_pages.py

      - name: Verify synchronization scope
        shell: bash
        run: |
          git diff --name-only | sort > /tmp/actual-files.txt
          cat > /tmp/expected-files.txt <<'EOF'
          biologicas-medicas/fisiologia-humana-ii/index.html
          biologicas-medicas/fisiologia-humana-ii/unidades/index.html
          biologicas-medicas/index.html
          catalogo/index.html
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt

      - name: Commit synchronized pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            biologicas-medicas/fisiologia-humana-ii/index.html \
            biologicas-medicas/fisiologia-humana-ii/unidades/index.html \
            biologicas-medicas/index.html \
            catalogo/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Sincronizar páginas de Fisiología Humana II'
            git push
          fi
