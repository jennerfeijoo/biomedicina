name: Temporary repair Biomateriales U4 JSON

on:
  push:
    branches:
      - codex/biomateriales-unit-04-refresh

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/biomateriales-unit-04-refresh
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Repair JSON escape and mirror
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          source = Path('data/course_redevelopment/biomateriales/units/unit-04.json')
          mirror = Path('data/generated_units/biomateriales/unit-04.json')
          text = source.read_text(encoding='utf-8')
          text = text.replace('m_{productos\\ recuperados}', 'm_{productos\\\\ recuperados}')
          text = text.replace('m_{perdida\\ del\\ especimen}', 'm_{perdida\\\\ del\\\\ especimen}')
          json.loads(text)
          source.write_text(text, encoding='utf-8')
          mirror.write_text(text, encoding='utf-8')
          PY
      - name: Validate and regenerate
        run: |
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python -m unittest tests.test_biomateriales_unit_04_curated
          python scripts/generate_site.py --force --with-units
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/temp-fix-biomateriales-u4-json.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair and synchronize Biomateriales U4"
          git fetch origin codex/biomateriales-unit-04-refresh
          git rebase origin/codex/biomateriales-unit-04-refresh
          git push origin HEAD:codex/biomateriales-unit-04-refresh
