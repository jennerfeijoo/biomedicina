name: Bioinstrumentation U5 Assessment Authorization

on:
  pull_request:
    paths:
      - "data/assessment_authorizations/bioinstrumentacion-unit-05.json"
      - "data/unit_preparation/bioinstrumentacion-unit-05.json"
      - "data/unit_preparation/bioinstrumentacion-unit-05-blocker-resolution.json"
      - "data/practice_implementations/bioinstrumentacion-unit-05.json"
      - "docs/pilots/bioinstrumentacion/unit-05/ASSESSMENT_AUTHORIZATION.md"
      - "scripts/validate_bioinstrumentation_u5_assessment_authorization.py"
      - ".github/workflows/bioinstrumentation-u5-assessment-authorization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_bioinstrumentation_u5_assessment_authorization.py
