name: Biomaterials Baseline Audit

on:
  pull_request:
    paths:
      - 'data/source_intake/biomateriales-yachay-outline.json'
      - 'data/editorial_audits/biomateriales-baseline.json'
      - 'docs/audits/biomateriales/BASELINE_CONTENT_AUDIT.md'
      - 'scripts/validate_biomaterials_baseline_audit.py'
      - 'data/catalog_statuses.json'
      - 'ingenieria-biomedica/biomateriales/**'
      - '.github/workflows/biomaterials-baseline-audit.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate Biomaterials baseline audit
        run: python scripts/validate_biomaterials_baseline_audit.py
