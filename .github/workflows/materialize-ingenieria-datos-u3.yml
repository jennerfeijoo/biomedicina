name: Materialize Ingenieria Datos U3

on:
  push:
    branches:
      - codex/ingenieria-datos-biomedicos-u3-almacenamiento-modelado
    paths:
      - .github/workflows/materialize-ingenieria-datos-u3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and validate payload
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/u3_payload/part*.txt > /tmp/u3_payload.b64
          test "$(wc -c < /tmp/u3_payload.b64)" -eq 45692
          base64 -d /tmp/u3_payload.b64 > /tmp/u3_payload.tar.gz
          echo "9bf9ee5530ae13939567b50ff1b829d69dae442703847b5fbdd40268f76f12a0  /tmp/u3_payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/u3_payload.tar.gz -C .
          python - <<'PY'
          import json
          import py_compile
          from pathlib import Path

          source = Path('data/course_redevelopment/ingenieria-datos-biomedicos/units/unit-03.json')
          mirror = Path('data/generated_units/ingenieria-datos-biomedicos/unit-03.json')
          unit = json.loads(source.read_text(encoding='utf-8'))
          assert unit['unit'] == 3
          assert unit['slug'] == 'almacenamiento-y-modelado'
          assert source.read_bytes() == mirror.read_bytes()
          assert len(unit['theory_sections']) == 5
          assert len(unit['glossary']) >= 55
          assert len(unit['sources']) >= 16
          assert all(s['verification_status'] == 'verified_directly' for s in unit['sources'])
          py_compile.compile('tests/test_ingenieria_datos_biomedicos_unit_03_curated.py', doraise=True)
          py_compile.compile('tests/test_ingenieria_datos_biomedicos_unit_03_semantic_guards.py', doraise=True)
          print('U3 payload validated')
          PY

      - name: Remove transfer scaffolding and commit U3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/u3_payload
          rm -f .github/workflows/materialize-ingenieria-datos-u3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Curación académica de Ingeniería de Datos Biomédicos U3"
          git push origin HEAD:codex/ingenieria-datos-biomedicos-u3-almacenamiento-modelado
