name: Bioinstrumentation U6 Final Authoral Audit

on:
  pull_request:
    paths:
      - "data/final_authoral_audits/bioinstrumentacion-unit-06.json"
      - "data/course_redevelopment/bioinstrumentacion/units/unit-06.json"
      - "scripts/validate_bioinstrumentation_u6_final_audit.py"
      - ".github/workflows/bioinstrumentation-u6-final-audit.yml"
  push:
    branches: [main]
    paths:
      - "data/final_authoral_audits/bioinstrumentacion-unit-06.json"
      - "data/course_redevelopment/bioinstrumentacion/units/unit-06.json"
      - "scripts/validate_bioinstrumentation_u6_final_audit.py"
      - ".github/workflows/bioinstrumentation-u6-final-audit.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/validate_bioinstrumentation_u6_final_audit.py
