name: Finalize PR122 course readiness

on:
  push:
    branches:
      - agent/complete-fisiologia-i-bioinformatica
    paths:
      - 'scripts/patch_pr122_course_readiness.py'
      - '.github/workflows/finalize-pr122-readiness.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-pr122-readiness
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-fisiologia-i-bioinformatica
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Complete diagnostic assessment and resources
        run: python scripts/patch_pr122_course_readiness.py

      - name: Promote reconstructed courses
        run: |
          python scripts/publish_courses.py \
            --subject fisiologia-humana-i \
            --subject bioinformatica \
            --manifest publication-manifest.json

      - name: Regenerate public pages and indexes
        run: |
          python scripts/generate_site.py \
            --force \
            --subject fisiologia-humana-i \
            --with-units \
            --force-authored-units
          python scripts/generate_site.py \
            --force \
            --subject bioinformatica \
            --with-units \
            --force-authored-units
          python scripts/generate_public_indexes.py \
            --manifest publication-manifest.json

      - name: Validate course architecture and publication
        run: |
          python scripts/validate_self_paced_model.py
          python scripts/validate_generated_units.py
          python scripts/audit_course_readiness.py --strict
          python scripts/audit_course_portfolio.py --strict
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py
          python scripts/publish_courses.py \
            --subject fisiologia-humana-i \
            --subject bioinformatica \
            --check-public
          python scripts/generate_public_indexes.py \
            --manifest publication-manifest.json \
            --check

      - name: Refresh developed-course audit
        run: |
          python scripts/audit_developed_courses.py \
            --strict \
            --json-output data/course_audits/DEVELOPED_COURSES_AUDIT_2026-07-27.json \
            --markdown-output data/course_audits/DEVELOPED_COURSES_AUDIT_2026-07-27.md

      - name: Remove temporary automation
        run: |
          git rm scripts/patch_pr122_course_readiness.py
          git rm .github/workflows/finalize-pr122-readiness.yml
          rm -f publication-manifest.json

      - name: Commit final course artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios que registrar."
            exit 0
          fi
          git commit -m "Completar preparación académica de Fisiología I y Bioinformática"
          git push origin HEAD:agent/complete-fisiologia-i-bioinformatica
