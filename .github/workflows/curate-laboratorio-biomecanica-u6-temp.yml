name: Curate Laboratorio Biomecanica U6 temp

on:
  push:
    branches:
      - codex/laboratorio-biomecanica-unit-06-academic-quality
    paths:
      - scripts/curate_laboratorio_biomecanica_u6_temp.py
      - .github/workflows/curate-laboratorio-biomecanica-u6-temp.yml

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/laboratorio-biomecanica-unit-06-academic-quality
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Curate U6
        run: python scripts/curate_laboratorio_biomecanica_u6_temp.py
      - name: Validate generated units
        run: python scripts/validate_generated_units.py
      - name: Audit generic content
        run: python scripts/audit_generic_content.py
      - name: Self-clean and commit
        run: |
          rm -f scripts/curate_laboratorio_biomecanica_u6_temp.py
          rm -f .github/workflows/curate-laboratorio-biomecanica-u6-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Curate Laboratorio de Biomecánica U6"
          git push origin HEAD:codex/laboratorio-biomecanica-unit-06-academic-quality
