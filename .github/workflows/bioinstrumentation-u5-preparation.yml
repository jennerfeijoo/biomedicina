name: Bioinstrumentation U5 Preparation

on:
  pull_request:
    paths:
      - 'data/unit_preparation/bioinstrumentacion-unit-05.json'
      - 'docs/pilots/bioinstrumentacion/unit-05/PREPARATION.md'
      - 'scripts/validate_bioinstrumentation_u5_preparation.py'
      - '.github/workflows/bioinstrumentation-u5-preparation.yml'
  push:
    branches: [main]
    paths:
      - 'data/unit_preparation/bioinstrumentacion-unit-05.json'
      - 'docs/pilots/bioinstrumentacion/unit-05/PREPARATION.md'
      - 'scripts/validate_bioinstrumentation_u5_preparation.py'
      - '.github/workflows/bioinstrumentation-u5-preparation.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/validate_bioinstrumentation_u5_preparation.py
