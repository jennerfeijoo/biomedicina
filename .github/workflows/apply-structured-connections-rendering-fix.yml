name: Apply structured connections rendering fix

on:
  push:
    branches:
      - agent/fix-biomedical-connections-rendering
    paths:
      - scripts/apply_structured_connections_rendering_fix.py
      - assets/js/generated-units.js
      - scripts/advanced_unit_renderer.py
      - .github/workflows/apply-structured-connections-rendering-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: structured-connections-rendering-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-biomedical-connections-rendering
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply idempotent migration
        run: python scripts/apply_structured_connections_rendering_fix.py

      - name: Verify JavaScript syntax
        run: node --check assets/js/generated-units.js

      - name: Verify Python syntax
        run: python -m py_compile scripts/advanced_unit_renderer.py

      - name: Reject technical object literals
        run: |
          ! grep -F '[object Object]' assets/js/generated-units.js
          grep -F 'const text = textValue(item);' assets/js/generated-units.js
          grep -F 'return [text for item in value if (text := text_value(item))]' scripts/advanced_unit_renderer.py

      - name: Commit patched renderers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/generated-units.js scripts/advanced_unit_renderer.py
          if git diff --cached --quiet; then
            echo "Renderers already patched."
            exit 0
          fi
          git commit -m "Corregir conexiones biomédicas estructuradas"
          git push origin HEAD:agent/fix-biomedical-connections-rendering
