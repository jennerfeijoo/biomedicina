name: Expand immunology theory

on:
  pull_request:
    paths:
      - '.github/workflows/expand-immunology-theory.yml'

permissions:
  contents: write

jobs:
  expand:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add unit-specific integrative sections
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('data/course_redevelopment/inmunologia-inmunopatologia/units')
          sections = {
            1: {
              'heading': 'Variación humana, referencias y razonamiento longitudinal',
              'paragraphs': [
                'Los intervalos de referencia inmunológicos dependen de edad, sexo, ascendencia, exposición, hora, estación, embarazo, medicación y plataforma. Un valor fuera del intervalo describe rareza respecto de una población de referencia, no enfermedad automática. Los estudios longitudinales permiten separar variación estable de cambios inducidos, pero requieren repetir condiciones de muestreo y conservar identificadores de lote. Las comparaciones entre grupos necesitan revisar composición celular, centros y procesamiento antes de atribuir una diferencia a biología.',
                'El razonamiento longitudinal conecta una línea basal con perturbación, expansión, contracción y recuperación. La misma frecuencia celular puede representar estados distintos antes y después de una exposición. Las trayectorias individuales pueden ser más informativas que promedios transversales. Para inferir homeostasis se combinan producción, migración, proliferación, muerte y función; ninguna medición aislada identifica todos estos términos. El informe debe distinguir qué se observó, qué se infirió y qué experimento permitiría discriminar mecanismos alternativos.'
              ],
              'key_points': ['Los intervalos de referencia son contextuales.', 'El batch puede parecer variación biológica.', 'Las trayectorias separan estado basal y respuesta.', 'Observación e inferencia deben distinguirse.'],
              'equations': [{'latex': 'LongitudinalChange = post_exposure - matched_baseline', 'meaning': 'Contraste individual que reduce parte de la heterogeneidad basal.', 'variables': {}}]
            },
            2: {
              'heading': 'Interacción entre inmunidad innata, coagulación y metabolismo',
              'paragraphs': [
                'La respuesta innata modifica endotelio, plaquetas y coagulación. Complemento, trampas extracelulares, factor tisular y mediadores inflamatorios pueden contener una amenaza y también favorecer microtrombosis. Esta interacción no implica que toda coagulopatía sea inmune ni que bloquear una molécula restaure el sistema. Se necesitan medidas temporales de activación, consumo, perfusión y lesión. Las muestras plasmáticas requieren anticoagulante y procesamiento apropiados porque la activación ex vivo puede generar señales falsas.',
                'La activación también reorganiza metabolismo celular. Neutrófilos, macrófagos y dendríticas ajustan glucólisis, respiración, lípidos y aminoácidos para sostener función. Estos cambios pueden regular citocinas y reparación, pero una firma metabólica no identifica un estado universal. Disponibilidad de oxígeno y nutrientes difiere entre sangre, tejido inflamado y cultivo. Los experimentos deben combinar flujo metabólico, función y perturbación, evitando interpretar una concentración final como tasa o causalidad.'
              ],
              'key_points': ['Inflamación y coagulación forman redes acopladas.', 'La preanalítica afecta productos de activación.', 'Metabolismo participa en la función innata.', 'Concentración final no equivale a flujo metabólico.'],
              'equations': [{'latex': 'InnateOutput = signaling × metabolic_capacity × tissue_environment', 'meaning': 'La salida innata depende de señal, capacidad metabólica y entorno.', 'variables': {}}]
            },
            3: {
              'heading': 'Predicción de epítopos y validación de presentación',
              'paragraphs': [
                'Los algoritmos de unión HLA priorizan péptidos a partir de secuencia y motivos, pero predicen solo una parte del proceso. No incorporan completamente expresión, degradación, transporte, competencia, edición ni abundancia en superficie. Un puntaje alto no demuestra presentación natural ni inmunogenicidad. La validación puede combinar inmunopeptidómica, estabilidad de HLA, multímeros y respuesta funcional. Los conjuntos de entrenamiento y las versiones del algoritmo deben registrarse para evitar comparaciones opacas.',
                'La inmunopeptidómica identifica ligandos eluidos mediante espectrometría de masas y está condicionada por cantidad de muestra, anticuerpo de captura, sensibilidad y búsqueda computacional. Péptidos no detectados pueden estar por debajo del límite y los detectados pueden no inducir respuesta. La asignación a un alelo puede ser ambigua cuando se expresan varios HLA. Diseños monoalélicos ayudan, pero alteran el contexto. Una cadena de evidencia sólida separa predicción, presentación física, reconocimiento clonal y función.'
              ],
              'key_points': ['Predicción de unión no demuestra presentación.', 'La inmunopeptidómica tiene límites de detección.', 'La asignación alélica puede ser ambigua.', 'Predicción, presentación, reconocimiento y función son etapas distintas.'],
              'equations': [{'latex': 'EpitopeEvidence = predicted_binding + physical_presentation + clonal_recognition + function', 'meaning': 'Capas complementarias de evidencia para un epítopo.', 'variables': {}}]
            },
            4: {
              'heading': 'Evolución clonal y análisis de linajes B',
              'paragraphs': [
                'Las secuencias relacionadas pueden organizarse en linajes para reconstruir diversificación después de una exposición. La inferencia depende de asignación correcta de genes germinales, definición de clon, calidad de secuencia y modelo filogenético. Distancias cortas no garantizan descendencia directa y secuencias faltantes pueden alterar el árbol. El número de mutaciones tampoco es equivalente a afinidad, porque la selección favorece combinaciones funcionales y puede tolerar cambios neutrales o perjudiciales.',
                'Vincular secuencia y función requiere expresar anticuerpos representativos y medir unión, cinética, neutralización o función Fc. Elegir solo clones abundantes puede omitir respuestas raras potentes; elegir los más mutados puede sesgar hacia historias largas sin relevancia. El muestreo longitudinal de sangre y tejido mejora la reconstrucción, aunque no observa todos los nichos. Los análisis deben reportar definición de clon, germline, pipeline, umbrales y sensibilidad a decisiones analíticas.'
              ],
              'key_points': ['Los árboles B son inferencias con secuencias faltantes.', 'Mutación no equivale a afinidad.', 'Secuencia y función deben conectarse experimentalmente.', 'La definición de clon debe documentarse.'],
              'equations': [{'latex': 'ClonalInference = sequence_similarity + shared_gene_usage + junction_evidence + time', 'meaning': 'Fuentes conceptuales para inferir pertenencia a un linaje B.', 'variables': {}}]
            },
            5: {
              'heading': 'Dinámica clonal, funcionalidad múltiple y causalidad',
              'paragraphs': [
                'Las respuestas T pueden seguirse combinando clonotipos, fenotipo y función. Un clon que se expande después de exposición puede estar relacionado con el estímulo, pero también responder a coinfección, inflamación o reactividad cruzada. Las trayectorias con línea basal, múltiples tiempos y controles permiten atribución más fuerte. La contracción diferencial y la migración pueden cambiar frecuencias sin alterar el número corporal total. La normalización por células, volumen o repertorio produce interpretaciones distintas.',
                'La polifuncionalidad resume varias lecturas por célula, como citocinas, degranulación o proliferación. Contar funciones puede ocultar magnitud, combinaciones y relevancia tisular. Una célula con muchas citocinas no es necesariamente más protectora y puede contribuir a daño. Para apoyar causalidad se requieren perturbaciones, relación dosis-respuesta, especificidad y conexión con desenlaces. Los análisis deben declarar compensación, umbrales, estimulación, tiempo y corrección por múltiples comparaciones.'
              ],
              'key_points': ['Expansión temporal fortalece, pero no prueba, atribución.', 'La normalización cambia la lectura de frecuencia.', 'Polifuncionalidad no es una escala universal de calidad.', 'La causalidad requiere perturbación y desenlaces.'],
              'equations': [{'latex': 'ClonalExpansion = frequency_after / frequency_before', 'meaning': 'Razón descriptiva que requiere considerar muestreo y composición.', 'variables': {}}]
            },
            6: {
              'heading': 'Diseño de estudios de inmunogenicidad vacunal',
              'paragraphs': [
                'Un estudio de inmunogenicidad define población, línea basal, tiempos, plataforma, exposición previa y desenlaces. Los tiempos deben capturar respuesta temprana, pico, contracción y persistencia. Las comparaciones entre dosis necesitan aleatorización o control de confusión. El análisis por protocolo puede sobrestimar respuesta si excluye participantes con problemas relacionados con tolerabilidad o acceso. La ausencia de una muestra no es neutral cuando depende de enfermedad o respuesta.',
                'La estandarización incluye materiales de referencia, controles positivos y negativos, laboratorios, lotes y reglas de aceptación. La serología puede complementarse con neutralización, células B, células T y muestras mucosales. Multiplicidad de antígenos, variantes y tiempos aumenta oportunidades de hallazgos selectivos. Un plan preespecificado distingue desenlaces primarios, correlatos exploratorios y análisis de subgrupos. La inmunogenicidad apoya plausibilidad, pero no sustituye eficacia o efectividad clínica.'
              ],
              'key_points': ['El tiempo de muestreo forma parte del desenlace.', 'La ausencia de muestras puede introducir sesgo.', 'La estandarización permite comparación entre lotes y laboratorios.', 'Inmunogenicidad no sustituye eficacia clínica.'],
              'equations': [{'latex': 'FoldRise = post_vaccination_measure / baseline_measure', 'meaning': 'Cambio relativo que debe acompañarse de escala, límite y valor basal.', 'variables': {}}]
            },
            7: {
              'heading': 'Fenocopias, penetrancia y clasificación clínica funcional',
              'paragraphs': [
                'Fenocopias inmunológicas pueden originarse por autoanticuerpos contra citocinas, alteraciones somáticas, cáncer, infección o fármacos y producir patrones similares a errores germinales. Su reconocimiento cambia la interpretación de herencia y tratamiento. La ausencia de antecedentes familiares no excluye una variante de novo, penetrancia incompleta o mosaicismo. El árbol familiar aporta evidencia, pero debe combinarse con edad de inicio, exposiciones y pruebas funcionales.',
                'Las categorías diagnósticas evolucionan cuando aparecen nuevos genes, mecanismos y fenotipos. Una clasificación es una herramienta de organización, no una representación definitiva de cada persona. Los pacientes pueden cruzar categorías o cambiar de fenotipo con edad y tratamiento. Las pruebas funcionales deben compararse con controles apropiados y considerar inflamación activa y medicación. La revisión multidisciplinaria integra inmunología, genética, microbiología y clínica para evitar sobreinterpretación de un único resultado.'
              ],
              'key_points': ['Fenocopias pueden imitar defectos germinales.', 'La ausencia de historia familiar no excluye genética.', 'Las clasificaciones cambian con evidencia.', 'La revisión funcional y multidisciplinaria reduce errores.'],
              'equations': [{'latex': 'Phenotype = germline_variation + somatic_change + environment + treatment + age', 'meaning': 'Factores que pueden producir o modificar un fenotipo inmunológico.', 'variables': {}}]
            },
            8: {
              'heading': 'Diseño traslacional y ciclo de vida de biomarcadores inmunes',
              'paragraphs': [
                'El desarrollo de un biomarcador comienza con uso previsto: selección, estratificación, farmacodinámica, seguridad o monitorización. Cada uso requiere población, momento, muestra, comparador y consecuencia de error. El descubrimiento en una cohorte pequeña y de alta dimensión produce optimismo si la selección de variables y el punto de corte usan los mismos datos. Una validación bloqueada debe preservar el pipeline completo y evaluar calibración, sensibilidad a preanalítica y desempeño por centros.',
                'Después de introducir una prueba, cambios de plataforma, tratamiento y población pueden producir drift. El control de calidad incluye materiales, lotes, tendencias y reglas para investigar desviaciones. Una asociación con respuesta no demuestra que actuar sobre el marcador mejore resultados. Para utilidad clínica se compara una estrategia que usa el biomarcador con la práctica alternativa. La gobernanza debe definir versiones, acceso, privacidad, incidentes y retirada cuando el desempeño deja de ser adecuado.'
              ],
              'key_points': ['El uso previsto determina el diseño de validación.', 'Descubrimiento y validación deben separarse.', 'Los biomarcadores pueden sufrir drift.', 'Utilidad clínica exige evaluar decisiones, no solo asociaciones.'],
              'equations': [{'latex': 'ClinicalUtility = outcome_with_biomarker_strategy - outcome_with_standard_strategy', 'meaning': 'Contraste conceptual de una estrategia guiada por biomarcador.', 'variables': {}}]
            }
          }

          changed = []
          for number, section in sections.items():
              path = root / f'unit-{number:02d}.json'
              data = json.loads(path.read_text(encoding='utf-8'))
              headings = {item.get('heading') for item in data.get('theory_sections', [])}
              if section['heading'] not in headings:
                  data.setdefault('theory_sections', []).append(section)
                  path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  changed.append(str(path))
          print('Expanded:', changed)
          PY
      - name: Commit expansions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/course_redevelopment/inmunologia-inmunopatologia/units
          if git diff --cached --quiet; then
            echo "No theory expansion required."
            exit 0
          fi
          git commit -m "Expand immunology theory sections"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
