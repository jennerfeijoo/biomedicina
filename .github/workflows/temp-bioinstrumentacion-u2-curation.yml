name: Curate Bioinstrumentation U2 temporary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  curate:
    if: github.head_ref == 'codex/bioinstrumentacion-unit-02-academic-quality-final'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Curate canonical unit 2
        run: python scripts/temp_curate_bioinstrumentacion_u2.py

      - name: Regenerate public site
        run: python scripts/generate_site.py --force --with-units

      - name: Validate academic courses
        run: python scripts/validate_academic_courses.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate generated units
        run: python scripts/validate_generated_units.py

      - name: Validate previews
        run: python scripts/check_generated_preview.py --all

      - name: Audit public alignment
        run: python scripts/audit_public_unit_alignment.py --strict

      - name: Validate links
        run: python scripts/validate_links.py

      - name: Remove temporary curator
        run: rm -f scripts/temp_curate_bioinstrumentacion_u2.py .github/workflows/temp-bioinstrumentacion-u2-curation.yml

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Curate canonical Bioinstrumentation unit 2"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
