name: Locate unit-count contract

on:
  pull_request:
    paths:
      - '.github/workflows/locate-unit-count.yml'

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate historical unit count
        shell: bash
        run: |
          mkdir -p unit-count-diagnostic/files
          grep -R -n -E '508|unidades lectivas' .github/workflows scripts \
            | tee unit-count-diagnostic/matches.txt
          python - <<'PY'
          from pathlib import Path
          import shutil

          roots = [Path('.github/workflows'), Path('scripts')]
          output = Path('unit-count-diagnostic/files')
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  text = path.read_text(encoding='utf-8', errors='ignore')
                  if '508' in text or 'unidades lectivas' in text:
                      target = output / path
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(path, target)
          PY

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: unit-count-contract-diagnostic
          path: unit-count-diagnostic/
          if-no-files-found: error
