name: Cleanup Genetica staging

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'agent/complete-remaining-courses' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Remove one-time construction files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .tmp/genetica
          git rm .github/workflows/build-genetica-course.yml
          git rm .github/workflows/cleanup-genetica-staging.yml
          git commit -m "Remove Genetica staging files"
          git push origin HEAD:${{ github.head_ref }}
