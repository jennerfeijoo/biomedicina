name: Temporary ICG canonical course closure

on:
  push:
    branches:
      - codex/ingenieria-clinica-gestion-course-completion

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/ingenieria-clinica-gestion-course-completion
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build canonical course
        run: python scripts/curate_ingenieria_clinica_gestion_course_temp.py

      - name: Validate canonical course strictly
        run: python scripts/validate_academic_courses.py --course ingenieria-clinica-gestion --strict-content

      - name: Validate curriculum and generated units
        run: |
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py

      - name: Run regression suite
        run: python -m unittest discover -s tests -p 'test*.py'

      - name: Generate public course
        run: python scripts/generate_site.py --force --subject ingenieria-clinica-gestion --with-units

      - name: Synchronize editorial catalog
        run: python scripts/sync_catalog_statuses.py

      - name: Validate public output
        run: |
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py

      - name: Remove temporary machinery
        run: |
          rm -f scripts/curate_ingenieria_clinica_gestion_course_temp.py
          rm -f .github/workflows/curate-icg-course-temp.yml

      - name: Commit canonical closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Complete canonical Clinical Engineering course"
          git push origin HEAD:codex/ingenieria-clinica-gestion-course-completion
