name: Temporary Biomedical Data Engineering U1 curation

on:
  push:
    branches:
      - codex/ingenieria-datos-biomedicos-unit-01-academic-quality

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Curate U1 source and exact mirror
        run: python scripts/curate_ingenieria_datos_biomedicos_u1_temp.py
      - name: Validate structured content
        run: |
          python scripts/validate_curriculum.py
          python scripts/validate_generated_units.py
          python -m unittest tests.test_ingenieria_datos_biomedicos_unit_01_curated -v
          python scripts/audit_generic_content.py
          python scripts/audit_curriculum_completeness.py --strict
          python scripts/audit_course_readiness.py --strict
      - name: Regenerate public course
        run: |
          python scripts/generate_site.py --force --subject ingenieria-datos-biomedicos --with-units
          python scripts/sync_catalog_statuses.py
          python scripts/audit_public_unit_alignment.py --strict
          python scripts/validate_links.py
      - name: Remove temporary files
        run: |
          rm scripts/curate_ingenieria_datos_biomedicos_u1_temp.py
          rm .github/workflows/temp-ingenieria-datos-u1.yml
      - name: Commit permanent U1 curation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Curate Biomedical Data Engineering U1"
          git push origin HEAD:codex/ingenieria-datos-biomedicos-unit-01-academic-quality
