name: Repair Biofotónica U5 duplicate bibliography

on:
  push:
    branches:
      - codex/biofotonica-unit-05-academic-quality

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/biofotonica-unit-05-academic-quality
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Remove duplicate TG274 record and validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('data/course_redevelopment/biofotonica/units/unit-05.json'),
              Path('data/generated_units/biofotonica/unit-05.json'),
          ]
          canonical = 'https://pubmed.ncbi.nlm.nih.gov/39815459/'
          duplicate = 'https://pmc.ncbi.nlm.nih.gov/articles/PMC11882379/'
          for path in paths:
              data = json.loads(path.read_text(encoding='utf-8'))
              before = len(data['sources'])
              data['sources'] = [item for item in data['sources'] if item.get('url') != duplicate]
              if len(data['sources']) != before - 1:
                  raise SystemExit(f'No se eliminó exactamente una referencia duplicada en {path}')
              if not any(item.get('url') == canonical for item in data['sources']):
                  raise SystemExit(f'Falta referencia canónica TG274 en {path}')
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit('Fuente y espejo no son idénticos')
          PY
          python -m unittest tests.test_biofotonica_unit_05_curated
          python scripts/audit_course_portfolio.py --strict
      - name: Remove temporary workflow and commit repair
        run: |
          rm .github/workflows/fix-biofotonica-u5-bibliography-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Biofotónica U5 bibliography duplication"
          git push origin HEAD:codex/biofotonica-unit-05-academic-quality
