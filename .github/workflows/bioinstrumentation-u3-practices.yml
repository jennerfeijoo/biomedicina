name: Bioinstrumentation U3 Practices

on:
  pull_request:
    paths:
      - 'scripts/bioinstrumentation_u3_practice_u3p1.py'
      - 'scripts/bioinstrumentation_u3_practice_u3p2.py'
      - 'scripts/bioinstrumentation_u3_practice_u3p3.py'
      - 'scripts/validate_bioinstrumentation_u3_practices.py'
      - 'data/practice_implementations/bioinstrumentacion-unit-03.json'
      - '.github/workflows/bioinstrumentation-u3-practices.yml'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/validate_bioinstrumentation_u3_practices.py
