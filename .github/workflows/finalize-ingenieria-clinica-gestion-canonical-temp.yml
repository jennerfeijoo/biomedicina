name: Finalize Clinical Engineering canonical corpus (temporary)

on:
  push:
    branches:
      - codex/ingenieria-clinica-gestion-canonical-closure
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/ingenieria-clinica-gestion-canonical-closure
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Bootstrap canonical corpus
        run: python scripts/bootstrap_ingenieria_clinica_gestion_canonical_temp.py

      - name: Finalize canonical corpus
        run: python scripts/finalize_ingenieria_clinica_gestion_canonical_temp.py

      - name: Validate canonical course strictly
        run: python scripts/validate_academic_courses.py --course ingenieria-clinica-gestion --strict-content

      - name: Run Clinical Engineering regressions
        run: python -m unittest discover -s tests -p 'test_ingenieria_clinica_gestion*.py'

      - name: Validate structured units
        run: python scripts/validate_generated_units.py

      - name: Generate public Clinical Engineering course
        run: python scripts/generate_site.py --force --subject ingenieria-clinica-gestion --with-units --force-authored-units

      - name: Validate public alignment
        run: python scripts/audit_public_unit_alignment.py --strict

      - name: Validate internal links
        run: python scripts/validate_links.py

      - name: Remove temporary closure tooling
        run: |
          rm -f scripts/bootstrap_ingenieria_clinica_gestion_canonical_temp.py
          rm -f scripts/finalize_ingenieria_clinica_gestion_canonical_temp.py
          rm -f .github/workflows/finalize-ingenieria-clinica-gestion-canonical-temp.yml
          rm -f global-generation.txt

      - name: Commit canonical closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Close canonical Clinical Engineering and Management course"
          git push origin HEAD:codex/ingenieria-clinica-gestion-canonical-closure
