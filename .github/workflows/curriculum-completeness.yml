name: CitoNauta Curriculum Completeness

on:
  pull_request:
    paths:
      - 'data/generated_courses/**'
      - 'data/generated_units/**'
      - 'data/curriculum_coverage/**'
      - 'data/course_supplements/**'
      - 'data/curriculum_expansions/**'
      - 'docs/ACADEMIC_COMPLETENESS_STANDARD.md'
      - 'docs/CURRICULUM_EXPANSIONS.md'
      - 'docs/SELF_PACED_LEARNING_MODEL.md'
      - 'scripts/audit_curriculum_completeness.py'
      - 'scripts/audit_curriculum_expansions.py'
      - 'scripts/audit_course_readiness.py'
      - 'scripts/validate_generated_units.py'
      - 'scripts/validate_course_supplements.py'
      - 'scripts/validate_self_paced_model.py'
      - '.github/workflows/curriculum-completeness.yml'
  push:
    branches:
      - main
    paths:
      - 'data/generated_courses/**'
      - 'data/generated_units/**'
      - 'data/curriculum_coverage/**'
      - 'data/course_supplements/**'
      - 'data/curriculum_expansions/**'
      - 'docs/ACADEMIC_COMPLETENESS_STANDARD.md'
      - 'docs/CURRICULUM_EXPANSIONS.md'
      - 'docs/SELF_PACED_LEARNING_MODEL.md'
      - 'scripts/audit_curriculum_completeness.py'
      - 'scripts/audit_curriculum_expansions.py'
      - 'scripts/audit_course_readiness.py'
      - 'scripts/validate_generated_units.py'
      - 'scripts/validate_course_supplements.py'
      - 'scripts/validate_self_paced_model.py'
      - '.github/workflows/curriculum-completeness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curriculum-completeness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Enforce self-paced learning model
        run: python scripts/validate_self_paced_model.py

      - name: Validate generated units without word limits
        run: python scripts/validate_generated_units.py

      - name: Validate advanced course supplements without word limits
        run: python scripts/validate_course_supplements.py

      - name: Validate course architecture without word thresholds
        id: readiness
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/audit_course_readiness.py --strict 2>&1 | tee reports-course-readiness.txt

      - name: Upload course-readiness diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: course-readiness-diagnostic
          path: reports-course-readiness.txt
          if-no-files-found: error

      - name: Enforce course architecture
        if: steps.readiness.outcome != 'success'
        run: |
          cat reports-course-readiness.txt
          exit 1

      - name: Audit coverage matrices
        run: |
          mkdir -p reports
          python scripts/audit_curriculum_completeness.py \
            --strict \
            --json-output reports/curriculum-completeness.json

      - name: Audit implemented disciplinary expansions
        run: |
          python scripts/audit_curriculum_expansions.py \
            --strict \
            --json-output reports/curriculum-expansions.json

      - name: Upload curriculum reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: curriculum-completeness-reports
          path: |
            reports/curriculum-completeness.json
            reports/curriculum-expansions.json
          if-no-files-found: warn
