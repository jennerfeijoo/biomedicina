name: Bioinstrumentation U3 Review Package

on:
  pull_request:
    paths:
      - "data/authoral_audits/bioinstrumentacion-unit-03.json"
      - "data/review_protocols/bioinstrumentacion-unit-03-human-review.json"
      - "data/review_packets/bioinstrumentacion-unit-03-professional-review.json"
      - "docs/pilots/bioinstrumentacion/unit-03/REVIEW_PACKAGE.md"
      - "scripts/validate_bioinstrumentation_u3_review_package.py"
      - ".github/workflows/bioinstrumentation-u3-review-package.yml"
  push:
    branches: [main]
    paths:
      - "data/authoral_audits/bioinstrumentacion-unit-03.json"
      - "data/review_protocols/bioinstrumentacion-unit-03-human-review.json"
      - "data/review_packets/bioinstrumentacion-unit-03-professional-review.json"
      - "docs/pilots/bioinstrumentacion/unit-03/REVIEW_PACKAGE.md"
      - "scripts/validate_bioinstrumentation_u3_review_package.py"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python scripts/validate_bioinstrumentation_u3_review_package.py
