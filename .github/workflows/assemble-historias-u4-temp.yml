name: Assemble Historias U4 temp

on:
  push:
    branches:
      - codex/historias-clinicas-u4-interoperabilidad
    paths:
      - '.tmp/u4_payload/**'
      - '.github/workflows/assemble-historias-u4-temp.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble and validate U4
        run: |
          python - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path

          root = Path('.')
          p1 = (root / '.tmp/u4_payload/unit.part1').read_text(encoding='utf-8').strip()
          fix = (root / '.tmp/u4_payload/fix01.1').read_text(encoding='utf-8').strip()
          expected = '4b294c4228aaf61b598c9d3692f598a1f4c55f74'
          def blob_sha(s):
              b=s.encode(); return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          print('part1 length/hash', len(p1), blob_sha(p1))
          print('fix length/hash', len(fix), blob_sha(fix))
          candidates = {
              'original': p1,
              'fix+tail800': fix + p1[800:],
              'fix+tail801': fix + p1[801:],
              'drop_last': p1[:-1],
          }
          chosen = None
          for name, value in candidates.items():
              print(name, len(value), blob_sha(value))
              if blob_sha(value) == expected:
                  chosen = value
          if chosen is None:
              raise SystemExit('No candidate reconstructs exact part1')

          encoded = chosen + ''.join(
              (root / f'.tmp/u4_payload/unit.part{i}').read_text(encoding='utf-8').strip()
              for i in range(2, 5)
          )
          unit_text = zlib.decompress(base64.b64decode(encoded)).decode('utf-8')
          data = json.loads(unit_text)
          assert data['subject_id'] == 'historias-clinicas-terminologias-estandares'
          assert data['unit'] == 4 and data['slug'] == 'interoperabilidad'
          test_text = zlib.decompress(base64.b64decode((root / '.tmp/u4_payload/test.b64').read_text(encoding='utf-8').strip())).decode('utf-8')

          source = root / 'data/course_redevelopment/historias-clinicas-terminologias-estandares/units/unit-04.json'
          mirror = root / 'data/generated_units/historias-clinicas-terminologias-estandares/unit-04.json'
          test_path = root / 'tests/test_historias_clinicas_unit_04_curated.py'
          source.parent.mkdir(parents=True, exist_ok=True); mirror.parent.mkdir(parents=True, exist_ok=True); test_path.parent.mkdir(parents=True, exist_ok=True)
          source.write_text(unit_text, encoding='utf-8'); mirror.write_text(unit_text, encoding='utf-8'); test_path.write_text(test_text, encoding='utf-8')
          assert source.read_bytes() == mirror.read_bytes()
          PY
          python scripts/validate_generated_units.py
          python tests/test_historias_clinicas_unit_04_curated.py
      - name: Commit assembled U4
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/course_redevelopment/historias-clinicas-terminologias-estandares/units/unit-04.json
          git add data/generated_units/historias-clinicas-terminologias-estandares/unit-04.json
          git add tests/test_historias_clinicas_unit_04_curated.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materializar curación de Historias Clínicas U4"
          git push origin HEAD:${GITHUB_REF_NAME}
