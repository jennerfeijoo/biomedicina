name: Repair course core resources

on:
  pull_request:
    paths:
      - '.github/workflows/repair-core-resources.yml'

permissions:
  contents: write

concurrency:
  group: repair-course-core-resources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add missing core resources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          additions = {
              Path('data/course_redevelopment/machine-learning-biomedico-validacion-clinica/course.json'): [
                  {
                      'title': 'CONSORT-AI',
                      'url': 'https://www.nature.com/articles/s41591-020-1034-x',
                  },
                  {
                      'title': 'SPIRIT-AI',
                      'url': 'https://www.nature.com/articles/s41591-020-1037-7',
                  },
              ],
              Path('data/course_redevelopment/omicas-celula-unica-biologia-espacial/course.json'): [
                  {
                      'title': 'AnnData documentation',
                      'url': 'https://anndata.readthedocs.io/en/stable/',
                  },
              ],
          }

          for path, resources in additions.items():
              data = json.loads(path.read_text(encoding='utf-8'))
              current = data.setdefault('core_resources', [])
              titles = {str(item.get('title', '')).casefold() for item in current if isinstance(item, dict)}
              for resource in resources:
                  if resource['title'].casefold() not in titles:
                      current.append(resource)
                      titles.add(resource['title'].casefold())
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit repaired resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/course_redevelopment/machine-learning-biomedico-validacion-clinica/course.json
          git add data/course_redevelopment/omicas-celula-unica-biologia-espacial/course.json
          if git diff --cached --quiet; then
            echo "Los recursos centrales ya estaban completos."
            exit 0
          fi
          git commit -m "Complete core resources for redeveloped courses"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
