name: Bioinstrumentation U6 Blocker Resolution

on:
  pull_request:
    paths:
      - "data/unit_preparation/bioinstrumentacion-unit-06-blocker-resolution.json"
      - "docs/pilots/bioinstrumentacion/unit-06/BLOCKER_RESOLUTION.md"
      - "scripts/validate_bioinstrumentation_u6_blocker_resolution.py"
      - ".github/workflows/bioinstrumentation-u6-blocker-resolution.yml"
  push:
    branches: [main]
    paths:
      - "data/unit_preparation/bioinstrumentacion-unit-06-blocker-resolution.json"
      - "docs/pilots/bioinstrumentacion/unit-06/BLOCKER_RESOLUTION.md"
      - "scripts/validate_bioinstrumentation_u6_blocker_resolution.py"
      - ".github/workflows/bioinstrumentation-u6-blocker-resolution.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate blocker resolution
        run: python scripts/validate_bioinstrumentation_u6_blocker_resolution.py
