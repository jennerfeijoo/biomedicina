name: Bioinstrumentation U4 Authoral

on:
  pull_request:
    paths:
      - 'data/course_redevelopment/bioinstrumentacion/units/unit-04.json'
      - 'scripts/validate_bioinstrumentation_u4_authoral.py'
      - 'docs/pilots/bioinstrumentacion/unit-04/AUTHORAL_DRAFT.md'
      - '.github/workflows/bioinstrumentation-u4-authoral.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python scripts/validate_bioinstrumentation_u4_authoral.py
