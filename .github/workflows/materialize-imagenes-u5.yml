name: Materialize Imagenes Avanzadas I U5

on:
  push:
    branches:
      - codex/imagenes-avanzadas-i-u5-registro-fusion

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/imagenes-avanzadas-i-u5-registro-fusion
          fetch-depth: 0

      - name: Assemble and validate payload
        run: |
          set -euo pipefail
          cat .tmp/u5_payload/part01.b64 \
              .tmp/u5_payload/part02.b64 \
              .tmp/u5_payload/part03.b64 \
              .tmp/u5_payload/part04.b64 \
              .tmp/u5_payload/part05.b64 | base64 -d > /tmp/u5.tar.gz
          rm -rf /tmp/u5 && mkdir -p /tmp/u5
          tar -xzf /tmp/u5.tar.gz -C /tmp/u5
          test "$(wc -c < /tmp/u5/unit-05.json)" -eq 59181
          test "$(wc -c < /tmp/u5/test_u5.py)" -eq 8613
          python - <<'PY'
          import json, py_compile
          from pathlib import Path
          unit = Path('/tmp/u5/unit-05.json')
          data = json.loads(unit.read_text(encoding='utf-8'))
          assert data['subject_id'] == 'imagenes-biomedicas-avanzadas-i'
          assert data['unit'] == 5
          assert data['slug'] == 'registro-y-fusion'
          assert len(data['theory_sections']) == 5
          assert len(data['glossary']) >= 55
          assert len(data['sources']) >= 18
          assert all(x['verification_status'] == 'verified_directly' for x in data['sources'])
          test_path = Path('/tmp/u5/test_u5.py')
          test_text = test_path.read_text(encoding='utf-8')
          assert '"transformación inversa",' in test_text
          test_text = test_text.replace('"transformación inversa",', '"su inversa",')
          test_path.write_text(test_text, encoding='utf-8')
          py_compile.compile('/tmp/u5/test_u5.py', doraise=True)
          PY

      - name: Materialize canonical unit and regression
        run: |
          set -euo pipefail
          cp /tmp/u5/unit-05.json data/course_redevelopment/imagenes-biomedicas-avanzadas-i/units/unit-05.json
          cp /tmp/u5/unit-05.json data/generated_units/imagenes-biomedicas-avanzadas-i/unit-05.json
          cp /tmp/u5/test_u5.py tests/test_imagenes_biomedicas_avanzadas_i_unit_05_curated.py
          cmp data/course_redevelopment/imagenes-biomedicas-avanzadas-i/units/unit-05.json \
              data/generated_units/imagenes-biomedicas-avanzadas-i/unit-05.json
          python -m unittest tests.test_imagenes_biomedicas_avanzadas_i_unit_05_curated

      - name: Remove transfer artifacts and commit
        run: |
          set -euo pipefail
          rm -rf .tmp/u5_payload
          rm .github/workflows/materialize-imagenes-u5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Curar Imágenes Biomédicas Avanzadas I U5"
          git push origin HEAD:codex/imagenes-avanzadas-i-u5-registro-fusion
