name: Public Content Alignment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-public-unit-alignment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate advanced unit sources
        run: python scripts/validate_generated_units.py

      - name: Check authored unit enrichment
        run: python scripts/enrich_authored_unit_pages.py --check

      - name: Audit committed advanced unit pages
        run: |
          mkdir -p audit-artifacts
          python scripts/audit_public_unit_alignment.py \
            --strict \
            --json-output audit-artifacts/public-unit-alignment.json \
            | tee audit-artifacts/public-unit-alignment.txt

      - name: Regenerate public site deterministically
        run: |
          python scripts/generate_site.py --force --with-units
          python scripts/enrich_generated_pages.py
          python scripts/enrich_authored_unit_pages.py

      - name: Enforce generated-site synchronization
        run: |
          git diff --name-only | tee audit-artifacts/generated-site-files.txt
          git diff --no-ext-diff --binary > audit-artifacts/generated-site.patch
          git diff --exit-code

      - name: Upload alignment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-unit-alignment
          path: audit-artifacts/
