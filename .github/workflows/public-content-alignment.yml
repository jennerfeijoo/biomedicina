name: Public Content Alignment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit-public-unit-alignment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate site and capture publication drift
        run: |
          mkdir -p audit-artifacts
          python scripts/generate_site.py --force --with-units
          git diff --name-only > audit-artifacts/generated-site-files.txt
          git diff --no-ext-diff --binary > audit-artifacts/generated-site.patch

      - name: Audit advanced JSON against public unit pages
        run: |
          python scripts/audit_public_unit_alignment.py \
            --json-output audit-artifacts/public-unit-alignment.json \
            | tee audit-artifacts/public-unit-alignment.txt

      - name: Upload alignment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-unit-alignment
          path: audit-artifacts/
