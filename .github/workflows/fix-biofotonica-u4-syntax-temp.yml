name: Repair Biofotonica U4 syntax

on:
  push:
    branches:
      - codex/biofotonica-unit-04-academic-quality

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/biofotonica-unit-04-academic-quality
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Repair both exact mirrors and validate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('data/course_redevelopment/biofotonica/units/unit-04.json'),
              Path('data/generated_units/biofotonica/unit-04.json'),
          ]
          old = '"correction": "Seleccionar según mensurando, mecanismo de contraste, resolución, profundidad, velocidad, calibración y límites del escenario."\n  ],'
          new = '"correction": "Seleccionar según mensurando, mecanismo de contraste, resolución, profundidad, velocidad, calibración y límites del escenario."}\n  ],'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Patrón de reparación no encontrado en {path}')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              json.loads(text)
          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit('Fuente y espejo no son idénticos')
          PY
          python -m unittest tests.test_biofotonica_unit_04_curated
      - name: Remove temporary workflow and commit repair
        run: |
          rm .github/workflows/fix-biofotonica-u4-syntax-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Biofotonica U4 JSON syntax"
          git push origin HEAD:codex/biofotonica-unit-04-academic-quality
