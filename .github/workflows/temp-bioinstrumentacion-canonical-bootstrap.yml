name: Bootstrap Bioinstrumentation canonical temporary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'codex/bioinstrumentacion-canonical-bootstrap'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Create canonical course
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/courses/bioinstrumentacion
          python scripts/migrate_course_to_canonical.py --subject bioinstrumentacion --course-code BIOINST
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          course_dir = root / 'data/courses/bioinstrumentacion'
          course_path = course_dir / 'course.json'
          course = json.loads(course_path.read_text(encoding='utf-8'))
          course['scope'] = {
              'included': [
                  'Especificación del mensurando, sistema de medición, indicación, resultado y trazabilidad metrológica.',
                  'Sensores y transductores con modelos estáticos, dinámicos, de carga e interfaz.',
                  'Biopotenciales, electrodos, conducción de volumen e interfaz electrodo-tejido con límites no diagnósticos.',
                  'Acondicionamiento analógico, ganancia, impedancia, ruido, modo común, filtrado y recuperación.',
                  'Muestreo, conversión analógico-digital, cuantización, sincronización e integridad temporal.',
                  'Sensores mecánicos, térmicos, de flujo y ópticos bajo referencias y geometrías declaradas.',
                  'Razonamiento educativo sobre aislamiento, seguridad eléctrica y compatibilidad electromagnética sin afirmar conformidad.',
                  'Caracterización, calibración, trazabilidad, incertidumbre y reglas de decisión limitadas.',
                  'Verificación, validación, riesgo, controles, discrepancias y aptitud para un uso definido.',
                  'Integración de arquitectura, presupuestos, trazabilidad, reproducibilidad y expediente de evidencia.'
              ],
              'excluded': [
                  'Conexión experimental de estudiantes a personas o a dispositivos médicos energizados sin infraestructura, supervisión y autorización específicas.',
                  'Diagnóstico clínico a partir de ECG, EEG, EMG u otras señales; las modalidades se usan para razonamiento instrumental.',
                  'Declaraciones de seguridad eléctrica, conformidad EMC, certificación, acreditación o aprobación regulatoria.',
                  'Sustitución de ensayos normativos, calibraciones acreditadas, validación clínica o revisión profesional competente.'
              ],
              'handoff_courses': [
                  'laboratorio-bioinstrumentacion',
                  'senales-biomedicas',
                  'desarrollo-dispositivos-medicos',
                  'ciencia-regulatoria-calidad-seguridad-tecnologias-medicas'
              ]
          }
          course['editorial_notice'] = (
              'Corpus canónico educativo en revisión. Conserva la secuencia pública de diez unidades y la procedencia histórica documentada; '
              'no implica revisión disciplinaria externa, autorización para prácticas con personas, conformidad normativa ni validez clínica.'
          )
          course_path.write_text(json.dumps(course, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for n in range(1, 11):
              path = course_dir / 'units' / f'unit-{n:02d}.json'
              unit = json.loads(path.read_text(encoding='utf-8'))
              prereq = [] if n == 1 else [f'BIOINST-U{n-1:02d}']
              unit['prerequisite_unit_ids'] = prereq
              for activity in unit['activities']:
                  activity['prerequisite_unit_ids'] = prereq
              if n in (1, 2, 3):
                  historical = f'data/course_redevelopment/bioinstrumentacion/units/unit-{n:02d}.json'
              elif n in (5, 6, 7):
                  historical = f'data/course_redevelopment/bioinstrumentacion/units/unit-{n-1:02d}.json'
              else:
                  historical = None
              notice = unit.get('editorial_notice', '').strip()
              provenance = (
                  f' Procedencia autoral histórica adicional: {historical}; la numeración canónica se rige por '
                  'data/course_migrations/bioinstrumentacion-public-canonical-v1.json.'
                  if historical else
                  ' Esta unidad se incorporó en la secuencia pública de diez unidades y todavía no tiene un documento autoral histórico equivalente en data/course_redevelopment.'
              )
              unit['editorial_notice'] = (notice + provenance).strip()
              path.write_text(json.dumps(unit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          migration_path = root / 'data/course_migrations/bioinstrumentacion-numbering-v1.json'
          migration = json.loads(migration_path.read_text(encoding='utf-8'))
          migration['status'] = 'canonical_academic_bootstrap_executed'
          migration['canonical_academic_bootstrap'] = {
              'executed_at': '2026-08-23',
              'course_path': 'data/courses/bioinstrumentacion/course.json',
              'course_code': 'BIOINST',
              'unit_count': 10,
              'source_of_public_content': 'data/generated_units/bioinstrumentacion/unit-*.json',
              'historical_authoral_sources_preserved': True,
              'legacy_numbering_rewritten': False,
              'human_review_executed': False,
              'disciplinary_review_complete': False,
              'publication_state': 'published_provisional_review'
          }
          migration['source_architecture']['current_public_numbering'] = list(range(1, 11))
          migration['next_action'] = 'curate_canonical_units_sequentially_without_rewriting_historical_audits'
          migration_path.write_text(json.dumps(migration, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Regenerate public site
        run: python scripts/generate_site.py --force --with-units

      - name: Validate academic courses
        run: python scripts/validate_academic_courses.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate generated units
        run: python scripts/validate_generated_units.py

      - name: Validate previews
        run: python scripts/check_generated_preview.py --all

      - name: Audit public alignment
        run: python scripts/audit_public_unit_alignment.py --strict

      - name: Validate links
        run: python scripts/validate_links.py

      - name: Remove temporary workflow
        run: rm -f .github/workflows/temp-bioinstrumentacion-canonical-bootstrap.yml

      - name: Commit validated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Bootstrap canonical Bioinstrumentation course"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
