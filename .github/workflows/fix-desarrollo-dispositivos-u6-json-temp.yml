name: Repair Desarrollo Dispositivos U6 JSON

on:
  push:
    branches:
      - codex/desarrollo-dispositivos-medicos-unit-06-academic-quality

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/desarrollo-dispositivos-medicos-unit-06-academic-quality
          fetch-depth: 0

      - name: Repair source and exact mirror
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('data/course_redevelopment/desarrollo-dispositivos-medicos/units/unit-06.json'),
              Path('data/generated_units/desarrollo-dispositivos-medicos/unit-06.json'),
          ]
          needle = 'autoridades competentes."\n  ],'
          replacement = 'autoridades competentes."}\n  ],'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if needle not in text:
                  raise SystemExit(f'Expected malformed fragment not found in {path}')
              text = text.replace(needle, replacement, 1)
              json.loads(text)
              path.write_text(text, encoding='utf-8')

          if paths[0].read_bytes() != paths[1].read_bytes():
              raise SystemExit('Redevelopment source and generated mirror differ after repair')
          PY
          python -m unittest tests.test_desarrollo_dispositivos_medicos_unit_06_curated

      - name: Commit repair and self-clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-desarrollo-dispositivos-u6-json-temp.yml
          git add data/course_redevelopment/desarrollo-dispositivos-medicos/units/unit-06.json
          git add data/generated_units/desarrollo-dispositivos-medicos/unit-06.json
          git commit -m "Fix Desarrollo Dispositivos U6 JSON syntax"
          git push origin HEAD:codex/desarrollo-dispositivos-medicos-unit-06-academic-quality

# Trigger the already-installed repair workflow; it removes itself after success.
