name: Curate Bioinstrumentation Unit 01 temporary

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  curate:
    if: github.head_ref == 'codex/bioinstrumentacion-unit-01-academic-quality'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Integrate authoral Unit 1 into canonical course
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path('.')
          COURSE = ROOT / 'data/courses/bioinstrumentacion'
          UNIT_PATH = COURSE / 'units/unit-01.json'
          ASSESSMENT_PATH = COURSE / 'assessments/unit-01.json'
          GLOSSARY_PATH = COURSE / 'glossary.json'
          SOURCES_PATH = COURSE / 'sources.json'
          CLAIMS_PATH = COURSE / 'claims.json'
          AUTHORAL_PATH = ROOT / 'data/course_redevelopment/bioinstrumentacion/units/unit-01.json'

          def load(path: Path):
              return json.loads(path.read_text(encoding='utf-8'))

          def dump(path: Path, payload):
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          unit = load(UNIT_PATH)
          authoral = load(AUTHORAL_PATH)

          subtopic_titles = [
              [
                  'Una etiqueta clínica no especifica el mensurando',
                  'Solo se añaden condiciones que cambian significado o comparabilidad',
                  'El uso previsto determina el detalle necesario',
                  'La dependencia del método se declara sin sustituir la cantidad',
              ],
              [
                  'Fenómeno, cantidad y señal ocupan capas distintas',
                  'La indicación puede pertenecer a otra clase de cantidad',
                  'El resultado incluye valor medido e información relevante',
                  'Leer la cadena desde ambos extremos evita atajos conceptuales',
              ],
              [
                  'Sistema de medición y proceso de medición no son idénticos',
                  'La cadena sigue una ruta de señal y no sustituye al modelo',
                  'Las fronteras son decisiones explícitas de modelado',
                  'Los metadatos preservan significado físico y auditabilidad',
              ],
              [
                  'El modelo de medición exige cantidades y dominio explícitos',
                  'Las variables contextuales se clasifican por su mecanismo',
                  'Una corrección no elimina la incertidumbre asociada',
                  'Un modelo responsable declara supuestos y efectos omitidos',
              ],
              [
                  'Una calibración concreta no garantiza todos los resultados futuros',
                  'La trazabilidad pertenece al resultado específico',
                  'Cada eslabón debe ser compatible con las cantidades del modelo',
                  'Auditar trazabilidad exige resultado, referencia, cadena y condiciones',
              ],
              [
                  'Trazabilidad y aptitud para el uso responden preguntas distintas',
                  'La evidencia técnica no autoriza por sí sola inferencia clínica',
                  'Siete preguntas reconstruyen la evidencia de una medición',
                  'El dominio exige transferencia y detección de evidencia faltante',
              ],
          ]

          topics = []
          for ti, section in enumerate(authoral['theory_sections'], start=1):
              topic_id = f'BIOINST-U01-T{ti:02d}'
              blocks = []
              for ei, equation in enumerate(section.get('equations', []), start=1):
                  blocks.append({
                      'id': f'{topic_id}-B{ei:02d}',
                      'type': 'equation',
                      'latex': equation['latex'],
                      'label': equation.get('meaning', ''),
                      'variables': {str(k): str(v) for k, v in (equation.get('variables') or {}).items()},
                  })
              subtopics = []
              paragraphs = section.get('paragraphs', [])
              if len(paragraphs) != 4:
                  raise SystemExit(f'Expected four paragraphs in authoral section {ti}, got {len(paragraphs)}')
              for si, paragraph in enumerate(paragraphs, start=1):
                  st_id = f'{topic_id}-ST{si:02d}'
                  subtopics.append({
                      'id': st_id,
                      'title': subtopic_titles[ti-1][si-1],
                      'blocks': [{
                          'id': f'{st_id}-B01',
                          'type': 'paragraph',
                          'text': paragraph,
                      }],
                  })
              topics.append({
                  'id': topic_id,
                  'title': section['heading'],
                  'blocks': blocks,
                  'key_points': section.get('key_points', []),
                  'subtopics': subtopics,
              })

          unit['purpose'] = authoral['purpose']
          unit['topics'] = topics
          unit['activities'] = [{
              'id': 'BIOINST-U01-ACT01',
              'title': 'Auditoría de una cadena de medición y su evidencia',
              'purpose': (
                  'Reconstruir una cadena biomédica desde el mensurando hasta el resultado, separar la ruta de señal del modelo de medición '
                  'y decidir qué afirmaciones de trazabilidad y aptitud están realmente sostenidas por la evidencia disponible.'
              ),
              'prerequisite_unit_ids': [],
              'instructions': [
                  'Elige una ruta segura: la cadena térmica sintética implementada en `scripts/generate_bioinstrumentation_thermal_dataset.py` o la auditoría offline del encabezado WFDB del registro 100 con `scripts/audit_wfdb_header.py`. No uses datos humanos nuevos ni interpretes clínicamente el ECG.',
                  'Antes de ejecutar nada, redacta el uso previsto y especifica el mensurando: clase de cantidad, sistema o portador, localización, intervalo o agregación temporal, condiciones, unidad y dependencia del procedimiento cuando sea necesaria.',
                  'Dibuja dos representaciones separadas: a) fenómeno/interacción → señales → indicación, y b) modelo de medición con cantidades de entrada, influencias, correcciones y valor atribuido. Declara las fronteras elegidas.',
                  'Documenta metadatos, referencias, calibraciones y fuentes de incertidumbre disponibles. Audita al menos dos afirmaciones de trazabilidad indicando qué puede aceptarse, qué debe rechazarse y qué evidencia falta.',
                  'Cierra con una conclusión limitada: separa observación, cálculo e inferencia; explica si existe evidencia de trazabilidad y por qué eso no basta para declarar aptitud clínica, seguridad o conformidad.'
              ],
              'tasks': [
                  'Clasifica ejemplos del caso como fenómeno, cantidad, mensurando, señal, indicación, valor medido, resultado, cantidad de entrada, influencia o referencia; justifica las categorías que podrían confundirse.',
                  'Corrige tres especificaciones ambiguas —por ejemplo «temperatura corporal», «presión arterial» o «ECG»— hasta convertirlas en mensurandos auditables o explica por qué una etiqueta dada no puede convertirse todavía en mensurando.',
                  'Ejecuta o inspecciona una de las prácticas reproducibles. En la ruta térmica conserva T_u, T_d, T_s e indicación como variables distintas; en la ruta WFDB verifica registro, canales, frecuencia, muestras, formato, versión y procedencia sin interpretar morfología.',
                  'Construye un diagrama de cadena con interfaces, transformaciones, unidades y frontera del sistema; marca al menos un punto donde pueda perderse significado, saturarse una señal o faltar metadata.',
                  'Construye una tabla de interfaces con cantidad representada, unidad o escala, referencia, rango o dominio, reloj/tiempo cuando aplique, transformación y metadata mínima necesaria.',
                  'Escribe un modelo de medición introductorio que separe cantidades de entrada, posibles influencias, correcciones y supuestos. Explica por qué el diagrama de hardware no sustituye este modelo.',
                  'Audita las afirmaciones «el instrumento es trazable», «el certificado garantiza resultados futuros» y una afirmación específica de resultado con referencia/cadena/incertidumbre. Reescribe cada una con el alcance que permita la evidencia.',
                  'Transfiere el razonamiento a un caso biomédico diferente y enumera qué evidencia adicional sería necesaria antes de ampliar la conclusión a aptitud para el uso, diagnóstico, seguridad o decisión clínica.'
              ],
              'deliverables': [
                  'Ficha de mensurando y uso previsto con cantidad, portador, localización, tiempo, condiciones, unidad, procedimiento cuando aplique y límites de inferencia.',
                  'Diagrama de cadena de medición con frontera explícita y diagrama separado del modelo de medición.',
                  'Tabla de interfaces y metadatos que permita reconstruir escala, referencia, tiempo, canal, versión y procedencia.',
                  'Evidencia reproducible de una práctica: manifiesto/hash y parámetros de la cadena térmica, o informe de auditoría del encabezado WFDB con versión, DOI y campos verificados.',
                  'Auditoría de modelo, calibración y trazabilidad con al menos tres afirmaciones revisadas y la evidencia que las sostiene o limita.',
                  'Conclusión final de una página que separe observación, cálculo e inferencia, identifique evidencia faltante y registre una autocorrección realizada durante la actividad.'
              ],
              'checking_criteria': [
                  'El mensurando es una cantidad suficientemente especificada y no el dispositivo, la señal, el fenómeno ni una etiqueta clínica genérica.',
                  'El uso previsto y las inferencias prohibidas están escritos antes de interpretar la salida.',
                  'La indicación, el valor medido y el resultado de medición se mantienen como conceptos distintos.',
                  'La cadena de medición y el modelo de medición aparecen como representaciones diferentes y coherentes.',
                  'Las interfaces incluyen unidades o escalas, referencias y metadatos suficientes para reconstruir el significado de los datos.',
                  'La práctica seleccionada es reproducible y conserva parámetros, versión, procedencia y límites; no requiere adquisición humana.',
                  'Calibración y certificado se describen con alcance temporal y condiciones, sin presentarlos como garantía universal.',
                  'La trazabilidad se atribuye a un resultado específico y no al instrumento, laboratorio o certificado de forma aislada.',
                  'La incertidumbre y la trazabilidad no se usan como sinónimos de aptitud para el uso, seguridad, diagnóstico o validez clínica.',
                  'La conclusión final es proporcional a la evidencia y declara de forma explícita qué observación o prueba faltaría para ampliar el alcance.'
              ],
              'estimated_duration_minutes': 240,
              'status': 'curated_pending_expert_review',
          }]

          specific_sources = [
              'bipm-vim-quantity', 'bipm-vim-measurand', 'bipm-vim-indication', 'bipm-vim-measured-value',
              'bipm-vim-measurement-result', 'bipm-vim-measuring-system', 'bipm-vim-measuring-chain',
              'bipm-vim-measurement-model', 'bipm-vim-calibration', 'bipm-vim-traceability', 'bipm-vim-uncertainty',
              'jcgm-gum-1-2023', 'jcgm-gum-6-2020', 'nist-tn-2156', 'physionet-mit-bih-arrhythmia'
          ]
          unit['source_ids'] = specific_sources
          unit['claim_ids'] = [f'BIOINST-U01-C{i:03d}' for i in range(1, 19)]
          unit['status']['sources'] = 'traceable'
          unit['editorial_notice'] = (
              'Contenido educativo canónico integrado desde la fuente autoral histórica y artefactos técnicos ya existentes. '
              'La revisión disciplinaria humana sigue pendiente; esta curación no autoriza adquisición con personas, interpretación clínica, '
              'declaraciones de seguridad o conformidad. Procedencia: data/course_redevelopment/bioinstrumentacion/units/unit-01.json, '
              'data/practice_implementations/bioinstrumentacion-unit-01.json y data/assessment_implementations/bioinstrumentacion-unit-01.json.'
          )
          dump(UNIT_PATH, unit)

          assessment = {
              '$schema': '../../../../schemas/academic/assessment-v1.schema.json',
              'schema_version': '1.0',
              'id': 'BIOINST-U01-EVAL',
              'course_id': 'bioinstrumentacion',
              'scope': 'unit',
              'unit_id': 'BIOINST-U01',
              'purpose': 'Evaluar transferencia del vocabulario metrológico a casos nuevos de especificación, cadena, modelo, metadata y trazabilidad sin sobreinterpretación clínica.',
              'student_payload_policy': 'En una aplicación dinámica, answer_key y feedback se excluyen del payload inicial del estudiante; la retroalimentación se libera después del primer intento y favorece pistas antes que revelar una respuesta completa.',
              'items': [] ,
              'status': 'curated_pending_expert_review',
          }

          def item(qid, prompt, los, difficulty, cognitive, expected, explanation, misconceptions, correct, incorrect, source_ids):
              return {
                  'id': qid,
                  'type': 'case_analysis',
                  'prompt': prompt,
                  'linked_learning_outcome_ids': los,
                  'difficulty': difficulty,
                  'cognitive_level': cognitive,
                  'answer_key': {
                      'expected_answer': expected,
                      'explanation': explanation,
                      'common_misconceptions': misconceptions,
                  },
                  'feedback': {'correct': correct, 'incorrect': incorrect},
                  'source_ids': source_ids,
                  'status': 'curated_pending_expert_review',
              }

          assessment['items'] = [
              item(
                  'BIOINST-U01-Q01',
                  'En una cadena térmica aparecen estas descripciones: «transferencia de calor en la piel», «temperatura», «temperatura superficial del antebrazo derecho promediada entre 25 y 35 s de contacto», «tensión del sensor», «2048 cuentas del ADC» y «34,1 °C ± 0,3 °C con método y condiciones». Clasifica cada una como fenómeno, cantidad, mensurando, señal, indicación o resultado y justifica dos fronteras que suelen confundirse.',
                  ['BIOINST-U01-LO01', 'BIOINST-U01-LO02'], 'intermediate', 'analyze',
                  'Fenómeno: transferencia de calor; cantidad: temperatura; mensurando: temperatura superficial suficientemente especificada; señal: tensión del sensor; indicación: código 2048; resultado: valor atribuido acompañado de incertidumbre y contexto. La clasificación debe explicar que una etiqueta de cantidad no especifica el mensurando y que una indicación no es el resultado completo.',
                  'La unidad evalúa categorías distintas de la cadena. El mensurando es la cantidad pretendida suficientemente especificada; la indicación es una salida del sistema y el resultado agrega valores atribuidos e información relevante.',
                  ['Llamar mensurando a cualquier palabra con unidad.', 'Tratar el código digital como resultado completo.', 'Confundir fenómeno biológico con cantidad medida.'],
                  'La clasificación mantiene separadas intención de medición, representación y resultado.',
                  'Revisa qué pregunta responde cada capa: qué se quiere medir, qué señal entrega el sistema y qué información acompaña al valor final.',
                  ['bipm-vim-quantity', 'bipm-vim-measurand', 'bipm-vim-indication', 'bipm-vim-measurement-result']
              ),
              item(
                  'BIOINST-U01-Q02',
                  'Un protocolo escribe únicamente «medir temperatura corporal». Reescribe el objetivo como un mensurando auditable para una práctica educativa de contacto y explica qué elementos añadiste y por qué no puedes concluir temperatura central.',
                  ['BIOINST-U01-LO01'], 'intermediate', 'create',
                  'Una respuesta válida especifica clase de cantidad, superficie o portador, localización, intervalo o regla temporal, condiciones de contacto/entorno, unidad y procedimiento cuando sea parte de la realización. Debe limitar la inferencia a la temperatura superficial definida y no equipararla con temperatura central.',
                  'La especificación del mensurando debe contener el detalle necesario para que otra persona determine qué cantidad se pretende atribuir y bajo qué condiciones.',
                  ['Añadir el nombre del sensor en lugar de especificar la cantidad.', 'Usar «corporal» como si identificara sitio y estado.', 'Suponer que una medición superficial representa directamente una cantidad central.'],
                  'La reformulación hace reproducible la intención de medición y limita su interpretación.',
                  'Añade solo las condiciones que cambian significado o comparabilidad: portador, localización, tiempo, estado, procedimiento y uso previsto.',
                  ['bipm-vim-measurand', 'jcgm-gum-6-2020']
              ),
              item(
                  'BIOINST-U01-Q03',
                  'Un ADC entrega 2048 cuentas y el display muestra 37,1 °C. Explica por qué ambas salidas pueden pertenecer a clases de cantidad diferentes y qué debe conservarse para reconstruir cómo se obtuvo el valor mostrado.',
                  ['BIOINST-U01-LO02', 'BIOINST-U01-LO05'], 'intermediate', 'analyze',
                  '2048 cuentas puede ser una indicación digital; 37,1 °C es un valor atribuido después de aplicar escala/modelo/calibración. Deben conservarse dato original, relación de conversión, coeficientes, unidades, cantidades auxiliares, versión, condiciones y la información de incertidumbre pertinente.',
                  'El VIM permite que la indicación pertenezca a una clase de cantidad distinta de la cantidad medida. El display no elimina las transformaciones intermedias.',
                  ['Suponer que una indicación debe tener la misma unidad que el mensurando.', 'Descartar las cuentas originales después de convertirlas.', 'Confundir una cifra mostrada con un resultado completo.'],
                  'Has reconstruido la transición entre indicación y valor atribuido sin perder trazabilidad de la transformación.',
                  'Separa primero salida del instrumento, modelo de conversión y resultado; después enumera qué datos permiten repetir la conversión.',
                  ['bipm-vim-indication', 'bipm-vim-measurement-result', 'bipm-vim-measurement-model']
              ),
              item(
                  'BIOINST-U01-Q04',
                  'Para un transductor de presión se dibuja P → deformación → resistencia → tensión → código → P estimada. Un estudiante afirma que ese diagrama «ya es el modelo de medición». Evalúa la afirmación y añade lo que falta.',
                  ['BIOINST-U01-LO03', 'BIOINST-U01-LO05'], 'advanced', 'evaluate',
                  'La secuencia es una cadena de medición o representación de la ruta de señal. El modelo de medición debe expresar relaciones matemáticas entre el mensurando y cantidades de entrada relevantes, incluidas correcciones e influencias, además de supuestos, condiciones y dominio de validez. Ambos artefactos se complementan pero no son equivalentes.',
                  'Una cadena identifica elementos de una ruta de señal; un modelo de medición es una relación matemática entre cantidades involucradas.',
                  ['Usar un diagrama de hardware como sustituto del modelo.', 'Llamar influencia a toda variable contextual sin analizar su mecanismo.', 'Omitir fronteras y condiciones de validez.'],
                  'La respuesta distingue arquitectura física/funcional de la relación metrológica entre cantidades.',
                  'Pregunta por separado «¿por dónde viaja la señal?» y «¿qué ecuación o relación permite atribuir el valor al mensurando?».',
                  ['bipm-vim-measuring-chain', 'bipm-vim-measurement-model', 'jcgm-gum-6-2020']
              ),
              item(
                  'BIOINST-U01-Q05',
                  'Recibes una matriz de enteros procedente de un registro fisiológico, pero faltan frecuencia de muestreo, ganancia, unidades y etiquetas de canal. ¿Qué conclusiones son válidas, qué metadata pedirías y qué uso clínico queda fuera de alcance?',
                  ['BIOINST-U01-LO02', 'BIOINST-U01-LO03'], 'intermediate', 'evaluate',
                  'Puede describirse la estructura numérica, pero no interpretarse correctamente amplitud, tiempo o canal sin metadata. Deben recuperarse al menos identidad/versión del registro, canal, unidad/ganancia, frecuencia, número de muestras, formato y procedencia. En la práctica de la unidad no se diagnostica, clasifica arritmias ni interpreta morfología clínica.',
                  'El encabezado WFDB del MIT-BIH muestra que frecuencia, canales, formato y escala forman parte del significado operativo del archivo; los números aislados no son autoexplicativos.',
                  ['Asumir una frecuencia de muestreo estándar.', 'Inferir unidades por el rango de enteros.', 'Interpretar clínicamente una señal solo porque proviene de una base fisiológica.'],
                  'La respuesta identifica qué información falta antes de convertir números en una señal interpretable.',
                  'Distingue primero datos almacenados de metadata; después limita la conclusión a lo que el archivo realmente documenta.',
                  ['physionet-mit-bih-arrhythmia', 'bipm-vim-measurement-result']
              ),
              item(
                  'BIOINST-U01-Q06',
                  'Audita esta frase: «El termómetro es trazable a NIST, por lo tanto sus lecturas son correctas». Indica al menos cuatro problemas y propón una redacción técnicamente defendible.',
                  ['BIOINST-U01-LO04'], 'advanced', 'evaluate',
                  'La trazabilidad es propiedad de un resultado, no una reputación universal del instrumento. Deben identificarse resultado, mensurando, referencia, cadena documentada de calibraciones, contribuciones de incertidumbre, condiciones/intervalo y estado/versión relevantes. La trazabilidad no garantiza ausencia de errores ni que todas las lecturas futuras sean correctas.',
                  'VIM 2.41 y NIST TN 2156 exigen relacionar resultados concretos con referencias mediante una cadena documentada y advierten contra atribuir trazabilidad de forma indiscriminada a instrumentos o certificados.',
                  ['Decir que el instrumento es trazable sin identificar resultado.', 'Usar «NIST» como referencia suficiente.', 'Tratar un certificado como garantía eterna.', 'Equiparar trazabilidad con exactitud absoluta.'],
                  'La redacción resultante tiene sujeto, referencia, cadena, condiciones y límites explícitos.',
                  'Empieza preguntando «¿qué resultado concreto es el sujeto de la afirmación?» y reconstruye los eslabones hasta la referencia.',
                  ['bipm-vim-traceability', 'nist-tn-2156']
              ),
              item(
                  'BIOINST-U01-Q07',
                  'Se documenta un resultado de 25,00 °C obtenido en una fecha concreta, conectado a una referencia R mediante calibraciones C1–C3 con incertidumbres declaradas. ¿Qué elementos permiten aceptar una afirmación limitada de trazabilidad y qué aspectos seguirían necesitando comprobación?',
                  ['BIOINST-U01-LO04', 'BIOINST-U01-LO05'], 'advanced', 'analyze',
                  'La afirmación limitada puede sostenerse si están identificados el resultado/mensurando, referencia, cadena ininterrumpida documentada, incertidumbres de los eslabones y condiciones de validez. Aun deben comprobarse vigencia/estado del sistema, aplicación correcta del modelo, compatibilidad de cantidades, uso dentro del alcance y si la incertidumbre y demás prestaciones satisfacen la necesidad concreta.',
                  'Una cadena documentada hace reconstruible la relación con referencias; no elimina la necesidad de comprobar que el resultado se obtuvo y usó bajo las condiciones cubiertas.',
                  ['Aceptar la cadena sin revisar compatibilidad de cantidades.', 'Suponer que la cadena demuestra estabilidad posterior.', 'Olvidar que el modelo/software puede cambiar.'],
                  'La respuesta distingue evidencia de trazabilidad de evidencia de funcionamiento y uso posterior.',
                  'Separa «¿puedo reconstruir la relación con la referencia?» de «¿el sistema funcionó correctamente y el resultado sirve para esta necesidad?».',
                  ['bipm-vim-traceability', 'bipm-vim-calibration', 'nist-tn-2156']
              ),
              item(
                  'BIOINST-U01-Q08',
                  'Un resultado está metrológicamente trazado y su incertidumbre está documentada. El equipo propone declararlo «apto para cualquier decisión clínica». Evalúa esa conclusión y redacta una regla de decisión más responsable.',
                  ['BIOINST-U01-LO05'], 'advanced', 'evaluate',
                  'La conclusión no está justificada. Trazabilidad e incertidumbre son componentes de la evidencia, pero la aptitud depende de la necesidad y puede requerir rango, dinámica, selectividad, estabilidad, condiciones, riesgos, procedimiento y validación específica. Una regla responsable limita el uso al mensurando, condiciones y finalidad evaluados y exige evidencia adicional antes de inferencia clínica o regulatoria.',
                  'VIM y NIST separan trazabilidad de adecuación de la incertidumbre y de ausencia de errores. La suficiencia para un uso es una evaluación contextual adicional.',
                  ['Usar trazabilidad como sinónimo de calidad total.', 'Suponer que una incertidumbre pequeña valida cualquier uso.', 'Convertir desempeño técnico en validez clínica.'],
                  'La regla final condiciona el uso a evidencia específica y declara qué usos permanecen fuera de alcance.',
                  'Pregunta qué decisión se tomará, qué error sería tolerable y qué prestaciones/evidencia exige esa decisión además de trazabilidad.',
                  ['bipm-vim-traceability', 'bipm-vim-uncertainty', 'nist-tn-2156', 'jcgm-gum-1-2023']
              ),
          ]
          dump(ASSESSMENT_PATH, assessment)

          sources = load(SOURCES_PATH)
          source_by_id = {s['id']: s for s in sources['sources']}
          new_sources = [
              {
                  'id': 'bipm-vim-quantity',
                  'title': 'VIM3 1.1 — quantity',
                  'organization': 'Joint Committee for Guides in Metrology / BIPM',
                  'url': 'https://jcgm.bipm.org/vim/en/1.1.html',
                  'type': 'terminología metrológica oficial',
                  'verification_status': 'verified_directly',
                  'locator': 'VIM3, entry 1.1 and notes',
                  'curricular_function': 'Definir cantidad y distinguir la propiedad cuantificable del fenómeno, cuerpo o sustancia que la porta.',
                  'limitations': 'La entrada terminológica no define por sí sola una señal, un procedimiento clínico ni un sistema de medición.',
                  'coverage': [1],
                  'used_by_unit_ids': ['BIOINST-U01'],
              },
              {
                  'id': 'bipm-vim-measured-value',
                  'title': 'VIM3 2.10 — measured quantity value',
