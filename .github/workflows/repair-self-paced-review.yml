name: Repair self-paced review feedback

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Fetch main
        run: git fetch origin main

      - name: Apply reproducible repairs
        run: python scripts/fix_self_paced_review.py

      - name: Validate patch hygiene
        run: git diff --check

      - name: Commit repairs when needed
        run: |
          if git diff --quiet; then
            echo "No repairs required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Address self-paced migration review findings"
          git push origin "HEAD:${{ github.head_ref }}"
