name: Audit course workload

on:
  pull_request:
    paths:
      - 'data/course_redevelopment/biologia-desarrollo/workload.json'
      - 'data/course_redevelopment/biologia-desarrollo/course.json'
      - 'data/course_redevelopment/biologia-desarrollo/CURRICULUM_ALIGNMENT_MATRIX.md'
      - 'scripts/audit_course_workload.py'
      - '.github/workflows/audit-course-workload.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recalculate and verify course workload
        run: |
          python scripts/audit_course_workload.py \
            --subject-id biologia-desarrollo
